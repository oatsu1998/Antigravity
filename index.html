<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny — Sports Command Center</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c0f;
            --surface: #111418;
            --surface2: #181c22;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.13);
            --text: #e8eaed;
            --muted: #6b7280;
            --accent: #f59e0b;
            --accent2: #3b82f6;
            --live: #ef4444;
            --win: #10b981;
            --font-head: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            border-bottom: 1px solid var(--border2);
            background: var(--surface);
        }

        .logo {
            font-family: var(--font-head);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--text);
            opacity: 0.4;
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #clock {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .refresh-btn {
            background: none;
            border: 1px solid var(--border2);
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .refresh-select {
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            outline: none;
        }

        .refresh-select:hover {
            border-color: var(--accent);
        }

        .league-tabs {
            display: flex;
            gap: 2px;
            padding: 16px 28px 0;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            background: var(--surface);
        }

        .tab {
            font-family: var(--font-head);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 20px;
            border: none;
            background: none;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--live);
            border-radius: 50%;
            margin-left: 6px;
            animation: pulse 1.4s infinite;
            vertical-align: middle;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .main {
            padding: 24px 28px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .league-panel {
            display: none;
        }

        .league-panel.active {
            display: block;
        }

        .league-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 20px;
        }

        .league-title {
            font-family: var(--font-head);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text);
        }

        .league-date {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
            align-items: start;
        }

        .game-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 18px;
            transition: border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            border-color: var(--border2);
        }

        .game-card.live {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .game-card.live::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--live);
        }

        .game-card.pinned {
            border-color: rgba(251, 191, 36, 0.45);
            box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.2);
        }

        .game-card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }

        .game-card.drag-over {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .card-top-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .drag-handle {
            cursor: grab;
            color: var(--muted);
            font-size: 14px;
            padding: 0 4px;
            user-select: none;
            flex-shrink: 0;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .pin-btn {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 4px;
            line-height: 1;
            color: var(--muted);
            transition: color 0.15s;
            flex-shrink: 0;
        }

        .pin-btn:hover {
            color: #FBBF24;
        }

        .pin-btn.active {
            color: #FBBF24;
        }


        .game-status {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-live {
            color: var(--live);
            font-weight: 500;
        }

        .status-sched {
            color: var(--muted);
        }

        .status-final {
            color: var(--win);
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .team-name {
            font-family: var(--font-head);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .team-record {
            font-size: 10px;
            color: var(--muted);
        }

        .team-score {
            font-family: var(--font-head);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text);
            min-width: 48px;
            text-align: right;
            flex-shrink: 0;
        }

        .team-score.winner {
            color: var(--accent);
        }

        .game-footer {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .game-info {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        .game-odds {
            font-size: 10px;
            color: var(--accent2);
            letter-spacing: 0.5px;
        }

        .no-games {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 1px;
            border: 1px dashed var(--border2);
            border-radius: 6px;
        }

        .no-games .icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 2px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .error-msg {
            font-size: 10px;
            color: var(--live);
            letter-spacing: 1px;
            padding: 4px 8px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .summary-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--surface2);
            border-radius: 4px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .summary-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .summary-value {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .summary-value.live-count {
            color: var(--live);
        }

        .summary-value.sched-count {
            color: var(--accent2);
        }

        .vs-divider {
            font-size: 10px;
            color: var(--muted);
            text-align: center;
            margin: 2px 0;
        }

        /* CARD DETAILS */
        .card-details {
            display: none;
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .game-card.expanded .card-details {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sp-section {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .sp-section:last-child {
            margin-bottom: 0;
        }

        .sp-section-title {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .sp-play {
            font-size: 11px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            line-height: 1.4;
        }

        .sp-play:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .sp-play-time {
            color: var(--accent2);
            font-size: 9px;
            margin-right: 6px;
        }

        .sp-stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px dashed var(--border);
        }

        .sp-stat-row:last-child {
            border-bottom: none;
        }

        .sp-stat-label {
            color: var(--muted);
            font-size: 11px;
        }

        .sp-leader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .sp-leader-name {
            font-size: 12px;
            font-weight: 500;
        }

        .sp-leader-val {
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .sp-team-col {
            flex: 1;
        }

        .sp-team-col:first-child {
            border-right: 1px solid var(--border);
            padding-right: 8px;
        }

        .sp-team-col:last-child {
            padding-left: 8px;
        }

        .sp-leaders-grid {
            display: flex;
            gap: 8px;
        }

        .sp-boxscore-wrapper {
            overflow-x: auto;
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            scrollbar-width: thin;
        }

        .sp-boxscore-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: right;
        }

        .sp-boxscore-table th {
            font-family: var(--font-head);
            font-weight: 700;
            color: var(--muted);
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
            white-space: nowrap;
        }

        .sp-boxscore-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border2);
            white-space: nowrap;
        }

        .sp-boxscore-table tr:last-child td {
            border-bottom: none;
        }

        .sp-boxscore-table th.col-player,
        .sp-boxscore-table td.col-player {
            text-align: left;
            position: sticky;
            left: 0;
            background: var(--surface2);
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .sp-boxscore-table td.col-player {
            font-weight: 500;
            color: var(--text);
        }

        .sp-boxscore-table tr.totals-row td {
            font-weight: 700;
            color: var(--accent);
            background: rgba(255, 255, 255, 0.03);
            border-top: 2px solid var(--border);
        }

        .dnp-text {
            color: var(--muted);
            font-size: 10px;
            text-align: left;
            padding-left: 12px !important;
        }

        .betting-widget {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bw-header {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr;
            font-size: 10px;
            color: var(--muted);
            text-align: center;
        }

        .bw-header span:first-child {
            text-align: left;
        }

        .bw-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr;
            gap: 6px;
            align-items: center;
        }

        .bw-team {
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bw-cell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border2);
            border-radius: 4px;
            padding: 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 36px;
            transition: all 0.2s;
        }

        .bw-cell:hover {
            border-color: var(--accent2);
            background: rgba(59, 130, 246, 0.1);
        }

        .bw-val {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .bw-sub {
            font-size: 10px;
            color: var(--accent2);
        }

        .bw-val-only {
            color: var(--accent2);
            font-size: 12px;
            font-weight: 600;
        }

        .bw-prob {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px;
        }

        .bw-prob-bar-wrap {
            flex: 1;
            height: 4px;
            background: var(--surface2);
            border-radius: 2px;
            overflow: hidden;
            display: flex;
        }

        .bw-prob-bar-left {
            background: var(--accent2);
            height: 100%;
        }

        .bw-prob-bar-right {
            background: var(--muted);
            height: 100%;
            opacity: 0.3;
        }

        .bw-prob-val-left {
            color: var(--text);
            font-weight: 600;
        }

        .bw-prob-val-right {
            color: var(--text);
            font-weight: 600;
        }

        /* ADVANCED BETTING WIDGET (ORL vs DET) */
        .adv-betting-widget {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .adv-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border2);
            border-radius: 8px;
            padding: 16px;
        }

        .adv-header {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 80px;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border2);
            padding-bottom: 10px;
            margin-bottom: 14px;
            text-align: center;
        }

        .adv-header span:first-child {
            text-align: left;
        }

        .adv-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 80px;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .adv-row:last-child {
            margin-bottom: 0;
        }

        .adv-team {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .adv-team-color {
            width: 6px;
            height: 16px;
            border-radius: 2px;
        }

        .adv-cell {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .adv-val {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .adv-val.blue {
            color: var(--accent2);
        }

        .adv-sub {
            font-size: 11px;
            color: var(--muted);
        }

        .adv-pub {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 44px;
            height: 44px;
            margin: 0 auto;
        }

        .adv-pub-svg {
            transform: rotate(-90deg);
            width: 44px;
            height: 44px;
        }

        .adv-pub-bg {
            fill: none;
            stroke: var(--surface2);
            stroke-width: 3;
        }

        .adv-pub-fg {
            fill: none;
            stroke: var(--text);
            stroke-width: 3;
            stroke-linecap: round;
        }

        .adv-pub-text {
            position: absolute;
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
        }

        #panel-live .adv-betting-widget {
            display: none !important;
        }

        .bet-slip {
            position: fixed;
            right: -340px;
            top: 0;
            bottom: 0;
            width: 320px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
        }

        .bet-slip.open {
            right: 0;
        }

        .bs-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bs-title {
            font-family: var(--font-head);
            font-size: 20px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: 2px;
        }

        .bs-bankroll {
            font-size: 12px;
            color: var(--win);
            font-weight: bold;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .bs-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bs-item {
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 6px;
            padding: 12px;
        }

        .bs-item-head {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .bs-item-team {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .bs-item-odds {
            font-size: 13px;
            color: var(--accent2);
            font-weight: bold;
        }

        .bs-item-type {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .bs-wager-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .bs-wager-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .bs-wager-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .bs-to-win {
            font-size: 11px;
            color: var(--muted);
            text-align: right;
            margin-top: 8px;
        }

        .bs-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
        }

        .bs-place-btn {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .bs-place-btn:hover {
            opacity: 0.9;
        }

        .bs-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-family: var(--font-head);
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            z-index: 90;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .bw-cell.clickable {
            cursor: pointer;
        }

        .bw-cell.clickable:hover {

    <script>
        const LEAGUES = [
            { id: 'nba', label: 'NBA', sport: 'basketball', league: 'nba' },
            { id: 'nhl', label: 'NHL', sport: 'hockey', league: 'nhl' },

        ];

        let activeTab = 'live';
        let leagueData = {};
        let oddsCache = {};

        let previousGameState = {};
        let leaguePollingState = {
            'nba': { nextPoll: 0, interval: 3600 },
            'nhl': { nextPoll: 0, interval: 3600 },
            'mlb': { nextPoll: 0, interval: 3600 }
        };

        // THE ODDS API INTEGRATION
        const ODDS_API_KEY = "4b3eeba2d1e049c875c619c01cf1307d";
        let paidOddsCache = {};
        const ODDS_SPORT_MAP = {
            'nba': 'basketball_nba',
            'mlb': 'baseball_mlb',
            'nhl': 'icehockey_nhl'
        };

        let globalMaxUsed = parseInt(localStorage.getItem('espn_api_usage')) || null;
        let globalRemaining = null;
        let lastRefreshCost = 0;

        async function fetchPaidOdds(lg) {
            const oddsSport = ODDS_SPORT_MAP[lg.id];
            if (!oddsSport) return [];

            console.log(`[Odds API] Fetching ${lg.id} from network due to score/status change.`);

            const url = `https://api.the-odds-api.com/v4/sports/${oddsSport}/odds?apiKey=${ODDS_API_KEY}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&eventStatus=pre,in`;
            try {
                const res = await fetch(url, { cache: 'no-store' });

                // Read Odds API usage from headers
                const rem = parseInt(res.headers.get('x-requests-remaining'));
                const used = parseInt(res.headers.get('x-requests-used'));
                if (!isNaN(rem) && !isNaN(used)) {
                    globalRemaining = rem;
                    if (globalMaxUsed === null || used > globalMaxUsed) {
                        globalMaxUsed = used;
                    }
                }

                if (!res.ok) return paidOddsCache[lg.id] || [];
                return await res.json();
            } catch (e) {
                console.error("Odds API Error:", e);
                return paidOddsCache[lg.id] || [];
            }
        }

        function clockTick() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) +
                '  ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(clockTick, 1000);
        clockTick();

        function todayStr() {
            const d = new Date();
            return d.getFullYear().toString() +
                String(d.getMonth() + 1).padStart(2, '0') +
                String(d.getDate()).padStart(2, '0');
        }

        async function fetchLeague(lg) {
            const url = `https://site.api.espn.com/apis/site/v2/sports/${lg.sport}/${lg.league}/scoreboard?dates=${todayStr()}&limit=50`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                return { ok: true, events: data.events || [], leagues: data.leagues || [] };
            } catch (e) {
                return { ok: false, error: e.message, events: [] };
            }
        }

        function gameStatus(event) {
            const s = event.status?.type;
            if (!s) return { label: 'SCHEDULED', cls: 'status-sched', isLive: false, isFinal: false };
            if (s.completed) {
                const finalLabel = s.shortDetail && s.shortDetail.toUpperCase().includes('OT') ? s.shortDetail.toUpperCase() : 'FINAL';
                return { label: finalLabel, cls: 'status-final', isLive: false, isFinal: true };
            }
            if (s.state === 'in' || s.description === 'In Progress' || s.description === 'Halftime' || s.description === 'End of Period' || (s.shortDetail && s.shortDetail.toLowerCase().includes('half'))) {
                let label = 'LIVE';
                if (s.description === 'Halftime' || (s.shortDetail && s.shortDetail.toLowerCase().includes('half'))) {
                    label = 'HALFTIME';
                } else if (s.description === 'End of Period') {
                    label = `END Q${event.status.period || ''}`;
                } else if (event.status?.displayClock) {
                    label = `${event.status.displayClock} — ${event.status.period ? 'Q' + event.status.period : ''}`;
                }
                return { label: label, cls: 'status-live', isLive: true, isFinal: false };
            }
            const d = event.date ? new Date(event.date) : null;
            const timeStr = d ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : s.description;
            return { label: timeStr, cls: 'status-sched', isLive: false, isFinal: false };
        }

        // ── Card pin & drag state ──────────────────────────────────────────
        const espnPinned = new Set(JSON.parse(localStorage.getItem('espn_pinned') || '[]'));
        const espnDragOrder = JSON.parse(localStorage.getItem('espn_drag_order') || '{}'); // { tabKey: [id,...] }
        let _espnDragSrc = null;

        function saveEspnPins() { localStorage.setItem('espn_pinned', JSON.stringify([...espnPinned])); }
        function saveEspnOrder(tabKey, ids) {
            espnDragOrder[tabKey] = ids;
            localStorage.setItem('espn_drag_order', JSON.stringify(espnDragOrder));
        }

        function toggleEspnPin(id, btn) {
            if (espnPinned.has(id)) { espnPinned.delete(id); btn.classList.remove('active'); btn.title = 'Pin'; }
            else { espnPinned.add(id); btn.classList.add('active'); btn.title = 'Unpin'; }
            saveEspnPins();
            const card = document.getElementById(`card-${id}`);
            if (card) card.classList.toggle('pinned', espnPinned.has(id));
            // Re-sort the grid this card lives in
            const grid = card?.closest('.games-grid');
            if (grid) _resortGrid(grid);
        }

        function _resortGrid(grid) {
            const cards = Array.from(grid.querySelectorAll('.game-card'));
            const pinned = cards.filter(c => espnPinned.has(c.dataset.eid));
            const rest = cards.filter(c => !espnPinned.has(c.dataset.eid));
            [...pinned, ...rest].forEach(c => grid.appendChild(c));
        }

        function _onEspnDragStart(e, id) {
            _espnDragSrc = id;
            e.dataTransfer.effectAllowed = 'move';
            document.getElementById(`card-${id}`)?.classList.add('dragging');
        }
        function _onEspnDragEnd(id) {
            document.getElementById(`card-${id}`)?.classList.remove('dragging');
            document.querySelectorAll('.game-card.drag-over').forEach(c => c.classList.remove('drag-over'));
            _espnDragSrc = null;
        }
        function _onEspnDragOver(e, id) {
            e.preventDefault();
            if (_espnDragSrc && _espnDragSrc !== id) {
                document.querySelectorAll('.game-card.drag-over').forEach(c => c.classList.remove('drag-over'));
                document.getElementById(`card-${id}`)?.classList.add('drag-over');
            }
        }
        function _onEspnDrop(e, id, tabKey) {
            e.preventDefault();
            document.getElementById(`card-${id}`)?.classList.remove('drag-over');
            if (!_espnDragSrc || _espnDragSrc === id) return;
            const src = document.getElementById(`card-${_espnDragSrc}`);
            const tgt = document.getElementById(`card-${id}`);
            if (!src || !tgt || src.parentElement !== tgt.parentElement) return;
            const grid = src.parentElement;
            const cards = Array.from(grid.querySelectorAll('.game-card'));
            const si = cards.indexOf(src), ti = cards.indexOf(tgt);
            if (si < ti) grid.insertBefore(src, tgt.nextSibling);
            else grid.insertBefore(src, tgt);
            const newOrder = Array.from(grid.querySelectorAll('.game-card')).map(c => c.dataset.eid);
            saveEspnOrder(tabKey, newOrder);
        }

            if (!comp) return '';

            const home = competitors.find(c => c.homeAway === 'home') || competitors[0];

            if (!home || !away) return '';

            const status = gameStatus(event);
            const homeScore = parseInt(home.score || 0);
            const awayScore = parseInt(away.score || 0);

                const n = (espnName || '').toLowerCase();
                const l = (espnLoc || '').toLowerCase();
                const a = (espnAbbr || '').toLowerCase();

                        <div class="bw-cell clickable" onclick="addToBetSlip(this.parentElement.querySelector('.bw-team').innerText, this.parentElement.parentElement.querySelector('.bw-header span:nth-child(' + (Array.from(this.parentElement.children).indexOf(this) + 1) + ')').innerText, this.querySelector('.bw-val, .bw-val-only').innerText + (this.querySelector('.bw-sub') ? ' ' + this.querySelector('.bw-sub').innerText : ''))"><span class="bw-val">&mdash;</span></div>
                        <div class="bw-cell clickable" onclick="addToBetSlip(this.parentElement.querySelector('.bw-team').innerText, this.parentElement.parentElement.querySelector('.bw-header span:nth-child(' + (Array.from(this.parentElement.children).indexOf(this) + 1) + ')').innerText, this.querySelector('.bw-val, .bw-val-only').innerText + (this.querySelector('.bw-sub') ? ' ' + this.querySelector('.bw-sub').innerText : ''))"><span class="bw-val-only">&mdash;</span></div>
                        <div class="bw-cell clickable" onclick="addToBetSlip(this.parentElement.querySelector('.bw-team').innerText, this.parentElement.parentElement.querySelector('.bw-header span:nth-child(' + (Array.from(this.parentElement.children).indexOf(this) + 1) + ')').innerText, this.querySelector('.bw-val, .bw-val-only').innerText + (this.querySelector('.bw-sub') ? ' ' + this.querySelector('.bw-sub').innerText : ''))"><span class="bw-val">&mdash;</span></div>
                    </div>
                </div>`;
            }

            const hideFooter = bettingWidgetHtml !== '' && (isLALvsHOU || isORLvsDET || isCLEvsTOR);

            return `
    <div class="game-card ${status.isLive ? 'live' : ''} ${espnPinned.has(event.id) ? 'pinned' : ''}" id="card-${event.id}" data-eid="${event.id}"
         draggable="true"
         ondragstart="_onEspnDragStart(event,'${event.id}')"
         ondragend="_onEspnDragEnd('${event.id}')"
         ondragover="_onEspnDragOver(event,'${event.id}')"
         ondrop="_onEspnDrop(event,'${event.id}','${lg.id}')"
         onclick="toggleGameDetails('${event.id}', '${lg.sport}', '${lg.league}')">
      <div class="card-top-bar">
        <span class="drag-handle" onclick="event.stopPropagation()" title="Drag to reorder">⠿</span>
        <div class="game-status" style="margin:0; display:flex; align-items:center; gap:6px;">
          <span class="${status.cls}">${status.label}</span>
          ${status.isLive ? '<span class="live-dot"></span>' : ''}
        </div>
        <button class="pin-btn ${espnPinned.has(event.id) ? 'active' : ''}" onclick="event.stopPropagation(); toggleEspnPin('${event.id}', this)" title="${espnPinned.has(event.id) ? 'Unpin' : 'Pin'}">★</button>
      </div>
      <div class="teams">
        <div class="team-row">
          <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
            ${awayLogo ? `<img src="${awayLogo}" class="team-logo" alt="">` : ''}
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <span class="team-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${away.team?.abbreviation || away.team?.displayName || 'AWAY'}</span>
              ${awayRecord ? `<span class="team-record" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${awayRecord}</span>` : ''}
            </div>
          </div>
          <span class="team-score ${awayWin ? 'winner' : ''}">${status.isLive || status.isFinal ? awayScore : '—'}</span>
        </div>
        <div class="vs-divider">@</div>
        <div class="team-row">
          <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
            ${homeLogo ? `<img src="${homeLogo}" class="team-logo" alt="">` : ''}
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <span class="team-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${home.team?.abbreviation || home.team?.displayName || 'HOME'}</span>
              ${homeRecord ? `<span class="team-record" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${homeRecord}</span>` : ''}
            </div>
          </div>
          <span class="team-score ${homeWin ? 'winner' : ''}">${status.isLive || status.isFinal ? homeScore : '—'}</span>
        </div>
      </div>
      ${bettingWidgetHtml}
      <div class="game-footer" style="${bettingWidgetHtml !== '' ? 'display: none;' : ''}">
        <span class="game-info">${[venue, broadcast].filter(Boolean).join(' · ')}</span>
        ${oddsStr ? `<span class="game-odds">${oddsStr}</span>` : ''}
      </div>
      <div class="card-details" id="details-${event.id}" onclick="event.stopPropagation()"></div>
    </div>
  `;
        }

        function renderPanel(lg, result) {
            let html = '';

            if (!result.ok) {
                html += `<div class="error-msg">ESPN API error — ${result.error}. Try refreshing.</div>`;
            }

            if (result.events.length === 0) {
                html += `
      <div class="no-games">
        <div class="icon">◻</div>
        No games scheduled for today
      </div>
    `;
            } else {
                const sortedEvents = [...result.events].sort((a, b) => {
                    const isPinA = espnPinned.has(a.id), isPinB = espnPinned.has(b.id);
                    if (isPinA !== isPinB) return isPinA ? -1 : 1; // pinned first
                    const statusOrder = (e) => {
                        const s = gameStatus(e);
                        if (s.isLive) return 0;
                        if (s.isFinal) return 2;
                        return 1;
                    };
                    const oa = statusOrder(a), ob = statusOrder(b);
                    if (oa !== ob) return oa - ob;
                    // Respect saved drag order within same group
                    const savedOrder = espnDragOrder[lg.id] || [];
                    const ia = savedOrder.indexOf(a.id), ib = savedOrder.indexOf(b.id);
                    if (ia >= 0 && ib >= 0) return ia - ib;
                    return new Date(a.date || 0) - new Date(b.date || 0);
                });
                html += `<div class="games-grid">${sortedEvents.map(e => renderCard(e, lg)).join('')}</div>`;
            }

            return html;
        }

        function renderLivePanel() {
            let allLiveEvents = [];
            LEAGUES.forEach(lg => {
                if (leagueData[lg.id] && leagueData[lg.id].events) {
                    const liveEvents = leagueData[lg.id].events.filter(e => gameStatus(e).isLive);
                    liveEvents.forEach(e => {
                        allLiveEvents.push({ event: e, lg: lg });
                    });
                }
            });

            if (allLiveEvents.length === 0) {
                const loading = LEAGUES.some(lg => !leagueData[lg.id]);
                if (loading) {
                    return '<div class="loading">LOADING LIVE GAMES...</div>';
                }
                return `
      <div class="no-games">
        <div class="icon">◻</div>
        No live games at the moment
      </div>
    `;
            }

            return `<div class="games-grid">${allLiveEvents.map(item => renderCard(item.event, item.lg)).join('')}</div>`;
        }

        function buildTabs() {
            const tabsEl = document.getElementById('tabs');

            let totalLiveGames = 0;
            LEAGUES.forEach(lg => {
                if (leagueData[lg.id] && leagueData[lg.id].events) {
                    totalLiveGames += leagueData[lg.id].events.filter(e => gameStatus(e).isLive).length;
                }
            });

            let html = `
      <button class="tab ${activeTab === 'live' ? 'active' : ''}" onclick="switchTab('live')" style="display: inline-flex; align-items: center; gap: 8px;">
        <span style="color: var(--live);">LIVE</span>
        ${totalLiveGames > 0 ? '<span class="live-dot" style="margin-left: 2px;"></span>' : ''}
        <span style="font-size:10px; font-weight:normal; margin-left:8px; opacity:0.8; font-family:var(--font-mono); letter-spacing:0.5px; color:var(--live);">${totalLiveGames} Games</span>
      </button>
            `;

            html += LEAGUES.map(lg => {
                const events = leagueData[lg.id]?.events || [];
                const liveCount = events.filter(e => gameStatus(e).isLive).length;
                const schedCount = events.filter(e => !gameStatus(e).isFinal && !gameStatus(e).isLive).length;
                const finalCount = events.filter(e => gameStatus(e).isFinal).length;

                let countsStr = '';
                if (events.length > 0) {
                    countsStr = `<span style="font-size:10px; font-weight:normal; margin-left:8px; opacity:0.8; font-family:var(--font-mono); letter-spacing:0.5px;">` +
                        `<span style="color:var(--live); margin-right:6px;">${liveCount} Live</span>` +
                        `<span style="color:var(--accent2); margin-right:6px;">${schedCount} Sched</span>` +
                        `<span style="color:var(--muted);">${finalCount} Final</span>` +
                        `</span>`;
                }

                return `
      <button class="tab ${activeTab === lg.id ? 'active' : ''}" onclick="switchTab('${lg.id}')" style="display: inline-flex; align-items: center; gap: 8px;">
        ${lg.logo ? `<img src="${lg.logo}" style="width: 16px; height: 16px; object-fit: contain;">` : ''}
        <span>${lg.label}</span>${countsStr}
      </button>
    `;
            }).join('');
            tabsEl.innerHTML = html;
        }

        function buildMain() {
            const mainEl = document.getElementById('main');
            let html = `
      <div class="league-panel ${activeTab === 'live' ? 'active' : ''}" id="panel-live">
        ${renderLivePanel()}
      </div>
            `;
            html += LEAGUES.map(lg => {
                const result = leagueData[lg.id];
                return `
      <div class="league-panel ${activeTab === lg.id ? 'active' : ''}" id="panel-${lg.id}">
        ${result ? renderPanel(lg, result) : '<div class="loading">LOADING GAMES...</div>'}
      </div>
    `;
            }).join('');
            mainEl.innerHTML = html;
        }

        function switchTab(id) {
            activeTab = id;
            buildTabs();
            document.querySelectorAll('.league-panel').forEach(p => p.classList.remove('active'));
            const panel = document.getElementById('panel-' + id);
            if (panel) panel.classList.add('active');
        }

        async function pollLeague(lg, manual = false) {
            const now = Date.now();
            const result = await fetchLeague(lg);
            leagueData[lg.id] = result;
            
            if (result.leagues && result.leagues[0] && result.leagues[0].logos) {
                lg.logo = result.leagues[0].logos[0].href;
            }

            let shouldFetchOdds = manual || !paidOddsCache[lg.id];
            let hasActive = false;
            let hasUpcomingSoon = false;

            if (result.ok && result.events) {
                result.events.forEach(e => {
                    const comp = e.competitions?.[0];
                    const competitors = comp?.competitors || [];
                    const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
                    const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
                    const currentScore = `${home?.score || 0}-${away?.score || 0}`;
                    const currentStatus = e.status?.type?.state || '';
                    
                    const stateKey = currentScore + '|' + currentStatus;

                    if (currentStatus === 'in') hasActive = true;
                    if (currentStatus === 'pre') {
                        const gameTime = new Date(e.date).getTime();
                        const minsAway = (gameTime - now) / 60000;
                        if (minsAway <= 60) hasUpcomingSoon = true;
                    }

                    if (previousGameState[e.id] !== stateKey) {
                        // Only trigger odds fetch if the game is active or pre-game
                        if (currentStatus === 'in' || currentStatus === 'pre') {
                            shouldFetchOdds = true;
                        }
                        previousGameState[e.id] = stateKey;
                    }
                });
            }

            // Determine next poll interval for ESPN
            let interval = 3600; // 1 hour default
            if (hasActive) interval = 15; // 15 seconds if any live game
            else if (hasUpcomingSoon) interval = 60; // 1 min if game within an hour

            leaguePollingState[lg.id].interval = interval;
            leaguePollingState[lg.id].nextPoll = Date.now() + (interval * 1000);

            // Fetch Odds API only if there was a score/status change, or manual override
            if (shouldFetchOdds) {
                const prevUsed = globalMaxUsed;
                const oddsData = await fetchPaidOdds(lg);
                if (oddsData && oddsData.length > 0) {
                    paidOddsCache[lg.id] = oddsData;
                }

                if (prevUsed !== null && globalMaxUsed !== null) {
                    lastRefreshCost = globalMaxUsed - prevUsed;
                    localStorage.setItem('espn_api_usage', globalMaxUsed);
                }
            }

            // Re-render
            const panel = document.getElementById('panel-' + lg.id);
            if (panel) panel.innerHTML = renderPanel(lg, result);
            const livePanel = document.getElementById('panel-live');
            if (livePanel) livePanel.innerHTML = renderLivePanel();
            buildTabs();

            const usageEl = document.getElementById('api-usage');
            if (usageEl && globalRemaining !== null) {
                usageEl.textContent = `API: ${globalRemaining} LEFT (Cost: ${lastRefreshCost})`;
                usageEl.style.display = 'inline';
            }

            if (currentOpenGame) {
                const card = document.getElementById(`card-${currentOpenGame.eventId}`);
                if (card) {
                    card.classList.add('expanded');
                    refreshGameDetails();
                } else {
                    currentOpenGame = null;
                }
            }
        }

        let currentOpenGame = null;

        async function toggleGameDetails(eventId, sport, league) {
            const card = document.getElementById(`card-${eventId}`);

            if (currentOpenGame && currentOpenGame.eventId === eventId) {
                card.classList.remove('expanded');
                currentOpenGame = null;
                return;
            }

            if (currentOpenGame) {
                const oldCard = document.getElementById(`card-${currentOpenGame.eventId}`);
                if (oldCard) oldCard.classList.remove('expanded');
            }

            currentOpenGame = { eventId, sport, league };
            card.classList.add('expanded');
            const detailsEl = document.getElementById(`details-${eventId}`);
            detailsEl.innerHTML = '<div class="loading" style="padding:20px 0;">LOADING DEEP DATA...</div>';
            await refreshGameDetails();
        }

        async function refreshGameDetails() {
            if (!currentOpenGame) return;
            const { eventId, sport, league } = currentOpenGame;
            const url = `https://site.api.espn.com/apis/site/v2/sports/${sport}/${league}/summary?event=${eventId}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                renderSidePanel(data);
            } catch (e) {
                document.getElementById('spContent').innerHTML = `<div class="error-msg">Failed to load details: ${e.message}</div>`;
            }
        }

        function renderSidePanel(data) {
            if (!currentOpenGame) return;
            const detailsEl = document.getElementById(`details-${currentOpenGame.eventId}`);
            if (!detailsEl) return;

            const box = data.boxscore;
            const plays = data.plays || [];

            let html = '';

            // ── Quarter-by-quarter linescore ──────────────────────────────
            const headerComp = data.header?.competitions?.[0];
            if (headerComp) {
                const competitors = headerComp.competitors || [];
                const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
                const home = competitors.find(c => c.homeAway === 'home') || competitors[0];

                const awayLinescores = away?.linescores || [];
                const homeLinescores = home?.linescores || [];
                const numPeriods = Math.max(awayLinescores.length, homeLinescores.length);
                const periods = Array.from({ length: numPeriods }, (_, i) => i + 1);
                const isOT = numPeriods > 4;
                const isBaseball = currentOpenGame?.sport === 'baseball';

                const getLabel = (i) => {
                    if (isBaseball) return (i + 1);            // 1 2 3 … 9 10 …
                    if (i < 4) return (i + 1);                 // 1 2 3 4
                    const ot = i - 3;                          // 1-indexed OT count
                    return ot === 1 ? 'OT' : (ot + 'OT');     // OT 2OT 3OT …
                };

                const awayAbbr = away?.team?.abbreviation || 'AWAY';
                const homeAbbr = home?.team?.abbreviation || 'HOME';
                const awayLogo = away?.team?.logos?.[0]?.href || '';
                const homeLogo = home?.team?.logos?.[0]?.href || '';
                const awayScore = away?.score || '0';
                const homeScore = home?.score || '0';

                // Series info
                const seriesArr = headerComp.series || [];
                const playoffSeries = seriesArr.find(s => s.type === 'playoff');
                const seriesSummary = playoffSeries?.summary || '';
                const gameNote = data.header?.gameNote || '';

                // Venue
                const venue = data.gameInfo?.venue;
                const venueLine = venue ? `${venue.fullName} · ${venue.address?.city}, ${venue.address?.state}` : '';

                html += `
                <div class="sp-section" style="padding:0;">
                    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px 6px;">
                        <div style="font-size:10px; color:var(--accent2); font-family:var(--font-mono);">${gameNote}</div>
                        <div style="font-size:10px; color:var(--muted); font-family:var(--font-mono);">${seriesSummary}</div>
                    </div>
                    <table style="width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:11px;">
                        <thead>
                            <tr style="color:var(--muted); font-size:10px;">
                                <th style="text-align:left; padding:4px 14px; font-weight:400; width:120px;"></th>
                                ${periods.map((_, i) => `<th style="text-align:center; padding:4px 8px; font-weight:400;">${getLabel(i)}</th>`).join('')}
                                <th style="text-align:center; padding:4px 14px; font-weight:700; color:var(--fg);">T</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="border-top:1px solid var(--border);">
                                <td style="padding:8px 14px;">
                                    <div style="display:flex; align-items:center; gap:8px;">
                                        ${awayLogo ? `<img src="${awayLogo}" style="width:18px;height:18px;object-fit:contain;">` : ''}
                                        <span style="font-weight:700; color:var(--fg);">${awayAbbr}</span>
                                    </div>
                                </td>
                                ${periods.map((_, i) => `<td style="text-align:center; padding:8px; color:var(--dim);">${awayLinescores[i]?.displayValue ?? '-'}</td>`).join('')}
                                <td style="text-align:center; padding:8px 14px; font-weight:700; color:var(--fg); font-size:14px;">${awayScore}</td>
                            </tr>
                            <tr style="border-top:1px solid var(--border);">
                                <td style="padding:8px 14px;">
                                    <div style="display:flex; align-items:center; gap:8px;">
                                        ${homeLogo ? `<img src="${homeLogo}" style="width:18px;height:18px;object-fit:contain;">` : ''}
                                        <span style="font-weight:700; color:var(--fg);">${homeAbbr}</span>
                                    </div>
                                </td>
                                ${periods.map((_, i) => `<td style="text-align:center; padding:8px; color:var(--dim);">${homeLinescores[i]?.displayValue ?? '-'}</td>`).join('')}
                                <td style="text-align:center; padding:8px 14px; font-weight:700; color:var(--fg); font-size:14px;">${homeScore}</td>
                            </tr>
                        </tbody>
                    </table>
                    ${venueLine ? `<div style="padding:6px 14px 10px; font-size:10px; color:var(--muted); font-family:var(--font-mono);">${venueLine}</div>` : ''}
                </div>`;
            }

            // Plays
            if (plays.length > 0) {
                html += `
      <div class="sp-section">
        <div class="sp-section-title">Latest Plays</div>
        ${plays.slice().reverse().slice(0, 5).map(p => `
          <div class="sp-play">
            <span class="sp-play-time">${p.clock?.displayValue || ''}</span>
            ${p.text}
          </div>
        `).join('')}
      </div>
    `;
            }

            // Leaders
            if (data.leaders && data.leaders.length > 0) {
                const awayLeaders = data.leaders.find(l => l.team.id === data.boxscore?.teams?.[0]?.team?.id)?.leaders || [];
                const homeLeaders = data.leaders.find(l => l.team.id === data.boxscore?.teams?.[1]?.team?.id)?.leaders || [];

                if (awayLeaders.length && homeLeaders.length) {
                    html += `
        <div class="sp-section">
          <div class="sp-section-title">Top Performers</div>
          <div class="sp-leaders-grid">
            <div class="sp-team-col">
              <div style="font-size:10px;color:var(--muted);margin-bottom:8px;">AWAY</div>
              ${awayLeaders.slice(0, 3).map(c => c.leaders?.[0] ? `
                <div class="sp-leader">
                  <div>
                    <div style="font-size:9px;color:var(--accent2);">${c.displayName}</div>
                    <div class="sp-leader-name">${c.leaders[0].athlete.shortName}</div>
                  </div>
                  <div class="sp-leader-val">${c.leaders[0].displayValue}</div>
                </div>
              ` : '').join('')}
            </div>
            <div class="sp-team-col">
              <div style="font-size:10px;color:var(--muted);margin-bottom:8px;">HOME</div>
              ${homeLeaders.slice(0, 3).map(c => c.leaders?.[0] ? `
                <div class="sp-leader">
                  <div>
                    <div style="font-size:9px;color:var(--accent2);">${c.displayName}</div>
                    <div class="sp-leader-name">${c.leaders[0].athlete.shortName}</div>
                  </div>
                  <div class="sp-leader-val">${c.leaders[0].displayValue}</div>
                </div>

            </div>
          </div>
        </div>
      `;
                }
            }

            // Team Stats
            if (box && box.teams) {
                const t1 = box.teams[0];
                const t2 = box.teams[1];
                if (t1.statistics && t2.statistics) {
                    html += `
         <div class="sp-section">
           <div class="sp-section-title">Team Stats</div>
           <div class="sp-stat-row" style="color:var(--muted);font-size:10px;">
             <span>${t1.team.abbreviation}</span>
             <span>STAT</span>
             <span>${t2.team.abbreviation}</span>
           </div>
           ${t1.statistics.slice(0, 8).map((s1, i) => {
                        const s2 = t2.statistics[i];
                        return `
               <div class="sp-stat-row">
                 <span style="font-weight:600;">${s1.displayValue}</span>
                 <span class="sp-stat-label">${s1.label || s1.name}</span>
                 <span style="font-weight:600;">${s2 ? s2.displayValue : '-'}</span>
               </div>
             `;
                    }).join('')}
         </div>
       `;
                }
            }

            // Boxscore (Players)
            if (data.boxscore && data.boxscore.players) {
                data.boxscore.players.forEach(teamData => {
                    const statsBlock = teamData.statistics?.[0];
                    if (!statsBlock) return;

                    html += `
                        <div class="sp-section">
                            <div class="sp-section-title">${teamData.team.displayName} Box Score</div>
                            <div class="sp-boxscore-wrapper">
                                <table class="sp-boxscore-table">
                                    <thead>
                                        <tr>
                                            <th class="col-player">PLAYER</th>
                                            ${statsBlock.labels.map(l => `<th>${l}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;

                    statsBlock.athletes.forEach(a => {
                        html += `<tr>`;
                        html += `<td class="col-player">${a.athlete.shortName}</td>`;
                        if (a.didNotPlay) {
                            html += `<td colspan="${statsBlock.labels.length}" class="dnp-text">${a.reason || 'DNP'}</td>`;
                        } else {
                            a.stats.forEach(s => {
                                html += `<td>${s}</td>`;
                            });
                        }
                        html += `</tr>`;
                    });

                    if (statsBlock.totals) {
                        html += `<tr class="totals-row">`;
                        html += `<td class="col-player">TEAM</td>`;
                        statsBlock.totals.forEach(t => {
                            html += `<td>${t || '-'}</td>`;
                        });
                        html += `</tr>`;
                    }

                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                });
            }

            detailsEl.innerHTML = html || '<div class="no-games">No deep data available yet.</div>';
        }

        async function initialLoad() {
            buildMain();
            const fetches = LEAGUES.map(lg => pollLeague(lg, true));
            await Promise.all(fetches);
        }

        initialLoad();

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            if (btn) btn.textContent = `↻ FETCHING...`;
            LEAGUES.forEach(lg => pollLeague(lg, true).then(() => {
                if (btn) btn.textContent = `↻ FORCE REFRESH`;
            }));
        }

        let isTabVisible = true;
        document.addEventListener("visibilitychange", () => {
            isTabVisible = !document.hidden;
            if (isTabVisible) {
                const now = Date.now();
                // If we were hidden and missed a poll, poll immediately
                LEAGUES.forEach(lg => {
                    if (now >= leaguePollingState[lg.id].nextPoll) {
                        leaguePollingState[lg.id].nextPoll = now + 9999999;
                        pollLeague(lg).catch(e => console.error(e));
                    }
                });
            }
        });

        setInterval(() => {
            if (!isTabVisible) return;
            const now = Date.now();
            LEAGUES.forEach(lg => {
                if (now >= leaguePollingState[lg.id].nextPoll) {
                    // Prevent concurrent overlapping polls for the same league
                    leaguePollingState[lg.id].nextPoll = now + 9999999; 
                    pollLeague(lg).catch(e => console.error(e));
                }
            });
        }, 1000);
    </script>
    <button class="bs-toggle" onclick="toggleBetSlip()">BET SLIP (<span id="bs-count">0</span>)</button>
    <div id="bet-slip-panel" class="bet-slip">
        <div class="bs-header">
            <div class="bs-title">BET SLIP</div>
            <div class="bs-bankroll">Bankroll: $<span id="bankroll-amount">10000.00</span></div>
        </div>
        <div id="bs-items" class="bs-items">
            <div style="color:var(--muted); font-size:12px; text-align:center;">Your bet slip is empty.</div>
        </div>
        <div class="bs-footer">
            <button class="bs-place-btn" onclick="placeBets()">PLACE BETS</button>
        </div>
    </div>
    <script>
        let bankroll = 10000.00;
        let betSlip = [
            { id: 1, team: 'Timberwolves', type: 'Parlay (+15 & U 224)', odds: -120, wager: 120 }
        ];

        // Initialize: clear past wagers & reset bankroll
        localStorage.removeItem('wagers');
        localStorage.removeItem('espn_api_usage');
        const savedBankroll = localStorage.getItem('bankroll');
        if (savedBankroll) {
            bankroll = parseFloat(savedBankroll);
        } else {
            localStorage.setItem('bankroll', bankroll);
        }

        function updateBankrollDisplay() {
            const el = document.getElementById('bankroll-amount');
            if (el) el.innerText = bankroll.toFixed(2);
        }

        function toggleBetSlip() {
            document.getElementById('bet-slip-panel').classList.toggle('open');
        }

        function addToBetSlip(team, type, odds) {
            if (odds === '-' || odds === undefined || odds === '') return;
            // Parse odds (e.g. "+150" or "-110")
            const parsedOdds = parseInt(odds.toString().replace(/[^0-9-]/g, ''));
            if (isNaN(parsedOdds)) return;

            betSlip.push({ id: Date.now(), team, type, odds: parsedOdds, wager: 0 });
            renderBetSlip();
            document.getElementById('bet-slip-panel').classList.add('open');
        }

        function removeFromBetSlip(id) {
            betSlip = betSlip.filter(b => b.id !== id);
            renderBetSlip();
        }

        function updateWager(id, amount) {
            const bet = betSlip.find(b => b.id === id);
            if (bet) {
                bet.wager = parseFloat(amount) || 0;
                const payout = calculatePayout(bet.wager, bet.odds);
                const payoutEl = document.getElementById(`payout-${id}`);
                if (payoutEl) {
                    payoutEl.innerText = payout.toFixed(2);
                }
            }
        }

        function calculatePayout(wager, odds) {
            if (!wager) return 0;
            if (odds > 0) return wager + (wager * (odds / 100));
            if (odds < 0) return wager + (wager * (100 / Math.abs(odds)));
            return wager;
        }

        function renderBetSlip() {
            const container = document.getElementById('bs-items');
            document.getElementById('bs-count').innerText = betSlip.length;
            if (betSlip.length === 0) {
                container.innerHTML = '<div style="color:var(--muted); font-size:12px; text-align:center;">Your bet slip is empty.</div>';
                return;
            }

            container.innerHTML = betSlip.map(bet => `
                <div class="bs-item">
                    <div class="bs-item-head">
                        <span class="bs-item-team">${bet.team}</span>
                        <button class="bs-remove" onclick="removeFromBetSlip(${bet.id})">×</button>
                    </div>
                    <div class="bs-item-type">${bet.type} <span style="float:right" class="bs-item-odds">${bet.odds > 0 ? '+' : ''}${bet.odds}</span></div>
                    <div class="bs-wager-row">
                        <span style="font-size:12px;color:var(--muted)">Wager: $</span>
                        <input type="number" class="bs-wager-input" placeholder="0.00" value="${bet.wager || ''}" onchange="updateWager(${bet.id}, this.value)" onkeyup="updateWager(${bet.id}, this.value)">
                    </div>
                    <div class="bs-to-win">To Win: $<span id="payout-${bet.id}">${(calculatePayout(bet.wager || 0, bet.odds) - (bet.wager || 0)).toFixed(2)}</span></div>
                </div>
            `).join('');
        }

        function placeBets() {
            let totalWager = betSlip.reduce((sum, bet) => sum + bet.wager, 0);
            if (totalWager <= 0) return alert('Please enter wager amounts.');
            if (totalWager > bankroll) return alert('Insufficient bankroll.');

            bankroll -= totalWager;
            localStorage.setItem('bankroll', bankroll);
            updateBankrollDisplay();

            betSlip = [];
            renderBetSlip();
            alert('Bets placed successfully!');
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateBankrollDisplay();
            renderBetSlip();
        });
    </script>
    <script src="nav.js"></script>
</body>
