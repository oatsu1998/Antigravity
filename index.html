<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny — Sports Command Center</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c0f;
            --surface: #111418;
            --surface2: #181c22;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.13);
            --text: #e8eaed;
            --muted: #6b7280;
            --accent: #f59e0b;
            --accent2: #3b82f6;
            --live: #ef4444;
            --win: #10b981;
            --font-head: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            border-bottom: 1px solid var(--border2);
            background: var(--surface);
        }

        .logo {
            font-family: var(--font-head);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--text);
            opacity: 0.4;
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #clock {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .refresh-btn {
            background: none;
            border: 1px solid var(--border2);
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .refresh-select {
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            outline: none;
        }

        .refresh-select:hover {
            border-color: var(--accent);
        }

        .league-tabs {
            display: flex;
            gap: 2px;
            padding: 16px 28px 0;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            background: var(--surface);
        }

        .tab {
            font-family: var(--font-head);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 20px;
            border: none;
            background: none;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--live);
            border-radius: 50%;
            margin-left: 6px;
            animation: pulse 1.4s infinite;
            vertical-align: middle;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .main {
            padding: 24px 28px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .league-panel {
            display: none;
        }

        .league-panel.active {
            display: block;
        }

        .league-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 20px;
        }

        .league-title {
            font-family: var(--font-head);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text);
        }

        .league-date {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
            align-items: start;
        }

        .game-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 18px;
            transition: border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            border-color: var(--border2);
        }

        .game-card.live {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .game-card.live::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--live);
        }

        .game-card.pinned {
            border-color: rgba(251, 191, 36, 0.45);
            box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.2);
        }

        .game-card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }

        .game-card.drag-over {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .card-top-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .drag-handle {
            cursor: grab;
            color: var(--muted);
            font-size: 14px;
            padding: 0 4px;
            user-select: none;
            flex-shrink: 0;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .pin-btn {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 4px;
            line-height: 1;
            color: var(--muted);
            transition: color 0.15s;
            flex-shrink: 0;
        }

        .pin-btn:hover {
            color: #FBBF24;
        }

        .pin-btn.active {
            color: #FBBF24;
        }


        .game-status {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-live {
            color: var(--live);
            font-weight: 500;
        }

        .status-sched {
            color: var(--muted);
        }

        .status-final {
            color: var(--win);
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .team-name {
            font-family: var(--font-head);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .team-record {
            font-size: 10px;
            color: var(--muted);
        }

        .team-score {
            font-family: var(--font-head);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text);
            min-width: 48px;
            text-align: right;
            flex-shrink: 0;
        }

        .team-score.winner {
            color: var(--accent);
        }

        .game-footer {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .game-info {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        .game-odds {
            font-size: 10px;
            color: var(--accent2);
            letter-spacing: 0.5px;
        }

        .no-games {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 1px;
            border: 1px dashed var(--border2);
            border-radius: 6px;
        }

        .no-games .icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 2px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .error-msg {
            font-size: 10px;
            color: var(--live);
            letter-spacing: 1px;
            padding: 4px 8px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .summary-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--surface2);
            border-radius: 4px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .summary-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .summary-value {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .summary-value.live-count {
            color: var(--live);
        }

        .summary-value.sched-count {
            color: var(--accent2);
        }

        .vs-divider {
            font-size: 10px;
            color: var(--muted);
            text-align: center;
            margin: 2px 0;
        }

        /* CARD DETAILS */
        .card-details {
            display: none;
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .game-card.expanded .card-details {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sp-section {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .sp-section:last-child {
            margin-bottom: 0;
        }

        /* PREMIUM ESPN LIVE BASEBALL GAME CARD */
        .espn-game-card {
            background: linear-gradient(135deg, rgba(20, 30, 45, 0.95), rgba(10, 15, 25, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            font-family: var(--font-mono), monospace;
        }
        .egc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }
        .egc-player-card {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .egc-player-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0,0,0,0.2);
            object-fit: cover;
        }
        .egc-player-info {
            display: flex;
            flex-direction: column;
        }
        .egc-player-role {
            font-size: 8px;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .egc-player-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--fg);
        }
        .egc-player-stats {
            font-size: 10px;
            color: var(--accent2);
        }
        .egc-vs-badge {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            font-size: 9px;
            color: var(--muted);
            font-weight: 700;
            margin: 0 12px;
        }
        .egc-grid {
            display: grid;
            grid-template-columns: 1.1fr 1fr 1.1fr;
            gap: 12px;
        }
        @media (max-width: 768px) {
            .egc-grid {
                grid-template-columns: 1fr;
            }
        }
        .egc-panel-situation {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .egc-counts {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            margin-bottom: 8px;
        }
        .egc-count-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: var(--muted);
        }
        .egc-dots {
            display: flex;
            gap: 4px;
        }
        .egc-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            background: transparent;
        }
        .egc-dot.active {
            background: #E53E3E;
            border-color: #E53E3E;
            box-shadow: 0 0 6px #E53E3E;
        }
        .egc-dot.ball.active {
            background: #4A90E2;
            border-color: #4A90E2;
            box-shadow: 0 0 6px #4A90E2;
        }
        .egc-diamond {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 8px auto;
        }
        .egc-base {
            position: absolute;
            width: 13px;
            height: 13px;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.02);
            transform: rotate(45deg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .egc-base.occupied {
            background: var(--blue);
            border-color: var(--blue);
            box-shadow: 0 0 10px var(--blue);
        }
        .egc-base.first { right: 6px; top: 33px; }
        .egc-base.second { left: 33px; top: 6px; }
        .egc-base.third { left: 6px; top: 33px; }
        .egc-base.home {
            left: 33px;
            bottom: 6px;
            border: 1.5px solid rgba(255,255,255,0.1);
            background: rgba(255, 255, 255, 0.05);
        }
        .egc-panel-heatmap {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.03);
            position: relative;
        }
        .egc-heatmap-grid {
            display: grid;
            grid-template-columns: repeat(3, 24px);
            grid-template-rows: repeat(3, 24px);
            gap: 2px;
        }
        .egc-heat-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 700;
            color: #fff;
            border-radius: 2px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .egc-heat-cell.hot { background: rgba(229, 62, 62, 0.85); border: 1px solid rgba(229, 62, 62, 0.3); }
        .egc-heat-cell.neutral { background: rgba(74, 144, 226, 0.65); border: 1px solid rgba(74, 144, 226, 0.3); }
        .egc-heat-cell.cold { background: rgba(45, 142, 255, 0.85); border: 1px solid rgba(45, 142, 255, 0.3); }

        .egc-panel-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.03);
            font-size: 10px;
            justify-content: center;
        }
        .egc-info-title {
            font-size: 8px;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .egc-info-text {
            color: var(--fg);
            line-height: 1.4;
        }

        .sp-section-title {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .sp-play {
            font-size: 11px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            line-height: 1.4;
        }

        .sp-play:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .sp-play-time {
            color: var(--accent2);
            font-size: 9px;
            margin-right: 6px;
        }

        .sp-stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px dashed var(--border);
        }

        .sp-stat-row:last-child {
            border-bottom: none;
        }

        .sp-stat-label {
            color: var(--muted);
            font-size: 11px;
        }

        .sp-leader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .sp-leader-name {
            font-size: 12px;
            font-weight: 500;
        }

        .sp-leader-val {
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .sp-team-col {
            flex: 1;
        }

        .sp-team-col:first-child {
            border-right: 1px solid var(--border);
            padding-right: 8px;
        }

        .sp-team-col:last-child {
            padding-left: 8px;
        }

        .sp-leaders-grid {
            display: flex;
            gap: 8px;
        }

        .sp-boxscore-wrapper {
            overflow-x: auto;
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            scrollbar-width: thin;
        }

        .sp-boxscore-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: right;
        }

        .sp-boxscore-table th {
            font-family: var(--font-head);
            font-weight: 700;
            color: var(--muted);
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
            white-space: nowrap;
        }

        .sp-boxscore-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border2);
            white-space: nowrap;
        }

        .sp-boxscore-table tr:last-child td {
            border-bottom: none;
        }

        .sp-boxscore-table th.col-player,
        .sp-boxscore-table td.col-player {
            text-align: left;
            position: sticky;
            left: 0;
            background: var(--surface2);
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .sp-boxscore-table td.col-player {
            font-weight: 500;
            color: var(--text);
        }

        .sp-boxscore-table tr.totals-row td {
            font-weight: 700;
            color: var(--accent);
            background: rgba(255, 255, 255, 0.03);
            border-top: 2px solid var(--border);
        }

        .dnp-text {
            color: var(--muted);
            font-size: 10px;
            text-align: left;
            padding-left: 12px !important;
        }

        .betting-widget {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bw-header {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr;
            font-size: 10px;
            color: var(--muted);
            text-align: center;
        }

        .bw-header span:first-child {
            text-align: left;
        }

        .bw-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr;
            gap: 6px;
            align-items: center;
        }

        .bw-team {
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bw-cell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border2);
            border-radius: 4px;
            padding: 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 36px;
            transition: all 0.2s;
        }

        .bw-cell:hover {
            border-color: var(--accent2);
            background: rgba(59, 130, 246, 0.1);
        }

        .bw-val {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .bw-sub {
            font-size: 10px;
            color: var(--accent2);
        }

        .bw-val-only {
            color: var(--accent2);
            font-size: 12px;
            font-weight: 600;
        }

        .bw-prob {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px;
        }

        .bw-prob-bar-wrap {
            flex: 1;
            height: 4px;
            background: var(--surface2);
            border-radius: 2px;
            overflow: hidden;
            display: flex;
        }

        .bw-prob-bar-left {
            background: var(--accent2);
            height: 100%;
        }

        .bw-prob-bar-right {
            background: var(--muted);
            height: 100%;
            opacity: 0.3;
        }

        .bw-prob-val-left {
            color: var(--text);
            font-weight: 600;
        }

        .bw-prob-val-right {
            color: var(--text);
            font-weight: 600;
        }

        /* ADVANCED BETTING WIDGET (ORL vs DET) */
        .adv-betting-widget {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;

<body>

                    <!-- Dynamically populated wagers -->

    <script>
        const LEAGUES = [
            { id: 'nba', label: 'NBA', sport: 'basketball', league: 'nba' },
            { id: 'mlb', label: 'MLB', sport: 'baseball', league: 'mlb' },
            { id: 'ncaaf', label: 'NCAAF', sport: 'football', league: 'college-football' },
            { id: 'nhl', label: 'NHL', sport: 'hockey', league: 'nhl' },
            { id: 'wnba', label: 'WNBA', sport: 'basketball', league: 'wnba' },
            { id: 'nfl', label: 'NFL', sport: 'football', league: 'nfl' }
        ];

        let activeTab = 'live';
        let leagueData = {};
        let oddsCache = {};

        let previousGameState = {};
        let leaguePollingState = {
            'nba': { nextPoll: 0, interval: 3600 },
            'mlb': { nextPoll: 0, interval: 3600 },
            'ncaaf': { nextPoll: 0, interval: 3600 },
            'nhl': { nextPoll: 0, interval: 3600 },
            'wnba': { nextPoll: 0, interval: 3600 },
            'nfl': { nextPoll: 0, interval: 3600 }
        };

        // THE ODDS API INTEGRATION
        const ODDS_API_KEY = "9827845ff1d9a1467dae344761f2db23";
        let paidOddsCache = {};
        const ODDS_SPORT_MAP = {
            'nba': 'basketball_nba',
            'mlb': 'baseball_mlb',
            'nhl': 'icehockey_nhl',
            'ncaaf': 'americanfootball_ncaaf',
            'nfl': 'americanfootball_nfl',
            'wnba': 'basketball_wnba'
        };

        let globalMaxUsed = parseInt(localStorage.getItem('espn_api_usage')) || null;
        let globalRemaining = null;
        let lastRefreshCost = 0;

        async function fetchPaidOdds(lg) {
            const oddsSport = ODDS_SPORT_MAP[lg.id];
            if (!oddsSport) return [];

            console.log(`[Odds API] Fetching ${lg.id} from network due to score/status change.`);

            const url = `https://api.the-odds-api.com/v4/sports/${oddsSport}/odds?apiKey=${ODDS_API_KEY}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&eventStatus=pre,in`;
            try {
                const res = await fetch(url, { cache: 'no-store' });

                // Read Odds API usage from headers
                const rem = parseInt(res.headers.get('x-requests-remaining'));
                const used = parseInt(res.headers.get('x-requests-used'));
                if (!isNaN(rem) && !isNaN(used)) {
                    globalRemaining = rem;
                    if (globalMaxUsed === null || used > globalMaxUsed) {
                        globalMaxUsed = used;
                    }
                }

                if (!res.ok) return paidOddsCache[lg.id] || [];
                return await res.json();
            } catch (e) {
                console.error("Odds API Error:", e);
                return paidOddsCache[lg.id] || [];
            }
        }

        function clockTick() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) +
                '  ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            const badge = document.getElementById('today-date-badge');
            if (badge) {
                badge.textContent = '📅 TODAY: ' + now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
            }
        }
        setInterval(clockTick, 1000);
        clockTick();

        function todayAndTomorrowStr() {
            const d1 = new Date();
            const d2 = new Date(Date.now() + 86400000);
            const fmt = d => d.getFullYear().toString() +
                String(d.getMonth() + 1).padStart(2, '0') +
                String(d.getDate()).padStart(2, '0');
            return `${fmt(d1)}-${fmt(d2)}`;
        }

        async function fetchLeague(lg) {
            const url = `https://site.api.espn.com/apis/site/v2/sports/${lg.sport}/${lg.league}/scoreboard?dates=${todayAndTomorrowStr()}&limit=50`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                return { ok: true, events: data.events || [], leagues: data.leagues || [] };
            } catch (e) {
                return { ok: false, error: e.message, events: [] };
            }
        }

        function gameStatus(event) {
            const s = event.status?.type;
            if (!s) return { label: 'SCHEDULED', cls: 'status-sched', isLive: false, isFinal: false };
            if (s.completed) {
                const finalLabel = s.shortDetail && s.shortDetail.toUpperCase().includes('OT') ? s.shortDetail.toUpperCase() : 'FINAL';
                return { label: finalLabel, cls: 'status-final', isLive: false, isFinal: true };
            }
            if (s.state === 'in' || s.description === 'In Progress' || s.description === 'Halftime' || s.description === 'End of Period' || (s.shortDetail && s.shortDetail.toLowerCase().includes('half'))) {
                let label = 'LIVE';
                if (s.description === 'Halftime' || (s.shortDetail && s.shortDetail.toLowerCase().includes('half'))) {
                    label = 'HALFTIME';
                } else if (s.description === 'End of Period') {
                    label = `END Q${event.status.period || ''}`;
                } else if (event.status?.displayClock) {
                    label = `${event.status.displayClock} — ${event.status.period ? 'Q' + event.status.period : ''}`;
                }
                return { label: label, cls: 'status-live', isLive: true, isFinal: false };
            }
            const d = event.date ? new Date(event.date) : null;
            const timeStr = d ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : s.description;
            return { label: timeStr, cls: 'status-sched', isLive: false, isFinal: false };
        }

        // ── Card pin & drag state ──────────────────────────────────────────
        const espnPinned = new Set(JSON.parse(localStorage.getItem('espn_pinned') || '[]'));

        function saveEspnOrder(tabKey, ids) {
            espnDragOrder[tabKey] = ids;
            localStorage.setItem('espn_drag_order', JSON.stringify(espnDragOrder));
        }

        function toggleEspnPin(id, btn) {
            if (espnPinned.has(id)) { espnPinned.delete(id); btn.classList.remove('active'); btn.title = 'Pin'; }
            else { espnPinned.add(id); btn.classList.add('active'); btn.title = 'Unpin'; }
            saveEspnPins();
            
            // Toggle pinned class on all card instances across panels!
            const cards = document.querySelectorAll(`[id$="-${id}"]`);
            cards.forEach(card => {
                if (card.id.startsWith('card-')) {
                    card.classList.toggle('pinned', espnPinned.has(id));
                    const pinBtn = card.querySelector('.pin-btn');
                    if (pinBtn) {
                        pinBtn.classList.toggle('active', espnPinned.has(id));
                        pinBtn.title = espnPinned.has(id) ? 'Unpin' : 'Pin';
                    }
                    const grid = card.closest('.games-grid');
                    if (grid) _resortGrid(grid);
                }
            });
        }

        function _resortGrid(grid) {
            const cards = Array.from(grid.querySelectorAll('.game-card'));
            const pinned = cards.filter(c => espnPinned.has(c.dataset.eid));
            const rest = cards.filter(c => !espnPinned.has(c.dataset.eid));
            [...pinned, ...rest].forEach(c => grid.appendChild(c));
        }

            _espnDragSrc = { id, panelType };
            e.dataTransfer.effectAllowed = 'move';
            document.getElementById(`card-${panelType}-${id}`)?.classList.add('dragging');
        }
        function _onEspnDragEnd(id, panelType) {
            document.getElementById(`card-${panelType}-${id}`)?.classList.remove('dragging');
            document.querySelectorAll('.game-card.drag-over').forEach(c => c.classList.remove('drag-over'));
            _espnDragSrc = null;
        }
        function _onEspnDragOver(e, id, panelType) {
            e.preventDefault();
            if (_espnDragSrc && (_espnDragSrc.id !== id || _espnDragSrc.panelType !== panelType)) {
                document.querySelectorAll('.game-card.drag-over').forEach(c => c.classList.remove('drag-over'));
                document.getElementById(`card-${panelType}-${id}`)?.classList.add('drag-over');
            }
        }
        function _onEspnDrop(e, id, tabKey, panelType) {
            e.preventDefault();
            document.getElementById(`card-${panelType}-${id}`)?.classList.remove('drag-over');
            if (!_espnDragSrc || _espnDragSrc.id === id || _espnDragSrc.panelType !== panelType) return;
            const src = document.getElementById(`card-${panelType}-${_espnDragSrc.id}`);
            const tgt = document.getElementById(`card-${panelType}-${id}`);
            if (!src || !tgt || src.parentElement !== tgt.parentElement) return;
            const grid = src.parentElement;
            const cards = Array.from(grid.querySelectorAll('.game-card'));
            const si = cards.indexOf(src), ti = cards.indexOf(tgt);
            if (si < ti) grid.insertBefore(src, tgt.nextSibling);
            else grid.insertBefore(src, tgt);
            const newOrder = Array.from(grid.querySelectorAll('.game-card')).map(c => c.dataset.eid);

        function renderPanel(lg, result) {
            let html = '';

            if (!result.ok) {
                html += `<div class="error-msg">ESPN API error — ${result.error}. Try refreshing.</div>`;
            }

            if (result.events.length === 0) {
                html += `
      <div class="no-games">
        <div class="icon">◻</div>
        No games scheduled for today
      </div>
    `;
            } else {
                const sortedEvents = [...result.events].sort((a, b) => {
                    const isPinA = espnPinned.has(a.id), isPinB = espnPinned.has(b.id);
                    if (isPinA !== isPinB) return isPinA ? -1 : 1; // pinned first
                    const statusOrder = (e) => {
                        const s = gameStatus(e);
                        if (s.isLive) return 0;
                        if (s.isFinal) return 2;
                        return 1;
                    };
                    const oa = statusOrder(a), ob = statusOrder(b);
                    if (oa !== ob) return oa - ob;
                    // Respect saved drag order within same group
                    const savedOrder = espnDragOrder[lg.id] || [];
                    const ia = savedOrder.indexOf(a.id), ib = savedOrder.indexOf(b.id);
                    if (ia >= 0 && ib >= 0) return ia - ib;
                    return new Date(a.date || 0) - new Date(b.date || 0);
                });
                html += `<div class="games-grid">${sortedEvents.map(e => renderCard(e, lg, lg.id)).join('')}</div>`;
            }

            return html;
        }

        function renderLivePanel() {
            let allLiveEvents = [];
            LEAGUES.forEach(lg => {
                if (leagueData[lg.id] && leagueData[lg.id].events) {
                    const liveEvents = leagueData[lg.id].events.filter(e => gameStatus(e).isLive);
                    liveEvents.forEach(e => {
                        allLiveEvents.push({ event: e, lg: lg });
                    });
                }
            });

            if (allLiveEvents.length === 0) {
                const loading = LEAGUES.some(lg => !leagueData[lg.id]);
                if (loading) {
                    return '<div class="loading">LOADING LIVE GAMES...</div>';
                }
                return `
      <div class="no-games">
        <div class="icon">◻</div>
        No live games at the moment
      </div>
    `;
            }

            return `<div class="games-grid">${allLiveEvents.map(item => renderCard(item.event, item.lg, 'live')).join('')}</div>`;
        }

        function buildTabs() {
            const tabsEl = document.getElementById('tabs');

            let totalLiveGames = 0;
            LEAGUES.forEach(lg => {
                if (leagueData[lg.id] && leagueData[lg.id].events) {
                    totalLiveGames += leagueData[lg.id].events.filter(e => gameStatus(e).isLive).length;
                }
            });

            let html = `
      <button class="tab ${activeTab === 'live' ? 'active' : ''}" onclick="switchTab('live')" style="display: inline-flex; align-items: center; gap: 8px;">
        <span style="color: var(--live);">LIVE</span>
        ${totalLiveGames > 0 ? '<span class="live-dot" style="margin-left: 2px;"></span>' : ''}
        <span style="font-size:10px; font-weight:normal; margin-left:8px; opacity:0.8; font-family:var(--font-mono); letter-spacing:0.5px; color:var(--live);">${totalLiveGames} Games</span>
      </button>
            `;

            html += LEAGUES.map(lg => {
                const events = leagueData[lg.id]?.events || [];
                const liveCount = events.filter(e => gameStatus(e).isLive).length;
                const schedCount = events.filter(e => !gameStatus(e).isFinal && !gameStatus(e).isLive).length;
                const finalCount = events.filter(e => gameStatus(e).isFinal).length;

                let countsStr = '';
                if (events.length > 0) {
                    countsStr = `<span style="font-size:10px; font-weight:normal; margin-left:8px; opacity:0.8; font-family:var(--font-mono); letter-spacing:0.5px;">` +
                        `<span style="color:var(--live); margin-right:6px;">${liveCount} Live</span>` +
                        `<span style="color:var(--accent2); margin-right:6px;">${schedCount} Sched</span>` +
                        `<span style="color:var(--muted);">${finalCount} Final</span>` +
                        `</span>`;
                }

                return `
      <button class="tab ${activeTab === lg.id ? 'active' : ''}" onclick="switchTab('${lg.id}')" style="display: inline-flex; align-items: center; gap: 8px;">
        ${lg.logo ? `<img src="${lg.logo}" style="width: 16px; height: 16px; object-fit: contain;">` : ''}
        <span>${lg.label}</span>${countsStr}
      </button>
    `;
            }).join('');
            tabsEl.innerHTML = html;
        }

        function buildMain() {
            const mainEl = document.getElementById('main');
            let html = `
      <div class="league-panel ${activeTab === 'live' ? 'active' : ''}" id="panel-live">
        ${renderLivePanel()}
      </div>
            `;
            html += LEAGUES.map(lg => {
                const result = leagueData[lg.id];
                return `
      <div class="league-panel ${activeTab === lg.id ? 'active' : ''}" id="panel-${lg.id}">
        ${result ? renderPanel(lg, result) : '<div class="loading">LOADING GAMES...</div>'}
      </div>
    `;
            }).join('');
            mainEl.innerHTML = html;
        }

        function switchTab(id) {
            activeTab = id;
            buildTabs();
            document.querySelectorAll('.league-panel').forEach(p => p.classList.remove('active'));
            const panel = document.getElementById('panel-' + id);
            if (panel) panel.classList.add('active');
        }

        async function pollLeague(lg, manual = false) {
            const now = Date.now();
            const result = await fetchLeague(lg);
            leagueData[lg.id] = result;
            
            if (result.leagues && result.leagues[0] && result.leagues[0].logos) {
                lg.logo = result.leagues[0].logos[0].href;
            }

            let shouldFetchOdds = manual || !paidOddsCache[lg.id];
            let hasActive = false;
            let hasUpcomingSoon = false;

            if (result.ok && result.events) {
                result.events.forEach(e => {
                    const comp = e.competitions?.[0];
                    const competitors = comp?.competitors || [];
                    const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
                    const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
                    const currentScore = `${home?.score || 0}-${away?.score || 0}`;
                    const currentStatus = e.status?.type?.state || '';
                    
                    const stateKey = currentScore + '|' + currentStatus;

                    if (currentStatus === 'in') hasActive = true;
                    if (currentStatus === 'pre') {
                        const gameTime = new Date(e.date).getTime();
                        const minsAway = (gameTime - now) / 60000;
                        if (minsAway <= 60) hasUpcomingSoon = true;
                    }

                    if (previousGameState[e.id] !== stateKey) {
                        // Only trigger odds fetch if the game is active or pre-game
                        if (currentStatus === 'in' || currentStatus === 'pre') {
                            shouldFetchOdds = true;
                        }
                        previousGameState[e.id] = stateKey;
                    }
                });
            }

            // Determine next poll interval for ESPN
            let interval = 3600; // 1 hour default
            if (hasActive) interval = 15; // 15 seconds if any live game
            else if (hasUpcomingSoon) interval = 60; // 1 min if game within an hour

            leaguePollingState[lg.id].interval = interval;
            leaguePollingState[lg.id].nextPoll = Date.now() + (interval * 1000);

            // Fetch Odds API only if there was a score/status change, or manual override
            if (shouldFetchOdds) {
                const prevUsed = globalMaxUsed;
                const oddsData = await fetchPaidOdds(lg);
                if (oddsData && oddsData.length > 0) {
                    paidOddsCache[lg.id] = oddsData;
                }

                if (prevUsed !== null && globalMaxUsed !== null) {
                    lastRefreshCost = globalMaxUsed - prevUsed;
                    localStorage.setItem('espn_api_usage', globalMaxUsed);
                }
            }

            // Re-render
            const panel = document.getElementById('panel-' + lg.id);
            if (panel) panel.innerHTML = renderPanel(lg, result);
            const livePanel = document.getElementById('panel-live');
            if (livePanel) livePanel.innerHTML = renderLivePanel();
            buildTabs();

            const usageEl = document.getElementById('api-usage');
            if (usageEl && globalRemaining !== null) {
                usageEl.textContent = `API: ${globalRemaining} LEFT (Cost: ${lastRefreshCost})`;
                usageEl.style.display = 'inline';
            }

            if (currentOpenGame) {
                const card = document.getElementById(`card-${currentOpenGame.panelType}-${currentOpenGame.eventId}`);
                if (card) {
                    card.classList.add('expanded');
                    refreshGameDetails();
                } else {
                    currentOpenGame = null;
                }
            }
        }

        let currentOpenGame = null;

        async function toggleGameDetails(eventId, sport, league, panelType) {
            const card = document.getElementById(`card-${panelType}-${eventId}`);

            if (currentOpenGame && currentOpenGame.eventId === eventId && currentOpenGame.panelType === panelType) {
                card.classList.remove('expanded');
                currentOpenGame = null;
                return;
            }

            if (currentOpenGame) {
                const oldCard = document.getElementById(`card-${currentOpenGame.panelType}-${currentOpenGame.eventId}`);
                if (oldCard) oldCard.classList.remove('expanded');
            }

            currentOpenGame = { eventId, sport, league, panelType };
            card.classList.add('expanded');
            const detailsEl = document.getElementById(`details-${panelType}-${eventId}`);
            detailsEl.innerHTML = '<div class="loading" style="padding:20px 0;">LOADING DEEP DATA...</div>';
            await refreshGameDetails();
        }

        async function refreshGameDetails() {
            if (!currentOpenGame) return;
            const { eventId, sport, league, panelType } = currentOpenGame;
            const url = `https://site.api.espn.com/apis/site/v2/sports/${sport}/${league}/summary?event=${eventId}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                renderSidePanel(data);
            } catch (e) {
                const detailsEl = document.getElementById(`details-${panelType}-${eventId}`);
                if (detailsEl) detailsEl.innerHTML = `<div class="error-msg">Failed to load details: ${e.message}</div>`;
            }
        }

        function renderSidePanel(data) {
            if (!currentOpenGame) return;
            const detailsEl = document.getElementById(`details-${currentOpenGame.panelType}-${currentOpenGame.eventId}`);
            if (!detailsEl) return;

            const box = data.boxscore;
            const plays = data.plays || [];

            let html = '';

            // Athlete lookup helper
            const findAthlete = (id) => {
                if (!id || !data.rosters) return null;
                for (const r of data.rosters) {
                    if (r.roster) {
                        const entry = r.roster.find(item => item.athlete && item.athlete.id == id);
                        if (entry) return entry.athlete;
                    }
                }
                if (data.boxscore && data.boxscore.players) {
                    for (const tp of data.boxscore.players) {
                        if (tp.statistics) {
                            for (const stat of tp.statistics) {
                                if (stat.athletes) {
                                    const entry = stat.athletes.find(a => a.athlete && a.athlete.id == id);
                                    if (entry) return entry.athlete;
                                }
                            }
                        }
                    }
                }
                return null;
            };

            // Batter Stats helper
            const getBatterStatsString = (athleteId) => {
                if (!athleteId || !data.boxscore || !data.boxscore.players) return '';
                for (const tp of data.boxscore.players) {
                    if (tp.statistics) {
                        for (const st of tp.statistics) {
                            const ath = st.athletes?.find(a => a.athlete?.id == athleteId);
                            if (ath && ath.stats && st.labels) {
                                const statsMap = {};
                                st.labels.forEach((lbl, idx) => {
                                    statsMap[lbl] = ath.stats[idx];
                                });
                                const parts = [];
                                if (statsMap['H-AB']) parts.push(statsMap['H-AB']);
                                if (statsMap['RBI'] && parseInt(statsMap['RBI']) > 0) {
                                    parts.push(statsMap['RBI'] + ' RBI');
                                }
                                if (statsMap['BB'] && parseInt(statsMap['BB']) > 0) {
                                    parts.push(statsMap['BB'] + ' BB');
                                }
                                if (statsMap['HR'] && parseInt(statsMap['HR']) > 0) {
                                    parts.push(statsMap['HR'] + ' HR');
                                }
                                return parts.join(', ');
                            }
                        }
                    }
                }
                return '';
            };

            // Pitcher Stats helper
            const getPitcherStatsString = (athleteId) => {
                if (!athleteId || !data.boxscore || !data.boxscore.players) return '';
                for (const tp of data.boxscore.players) {
                    if (tp.statistics) {
                        for (const st of tp.statistics) {
                            const ath = st.athletes?.find(a => a.athlete?.id == athleteId);
                            if (ath && ath.stats && st.labels) {
                                const statsMap = {};
                                st.labels.forEach((lbl, idx) => {
                                    statsMap[lbl] = ath.stats[idx];
                                });
                                const parts = [];
                                if (statsMap['IP']) parts.push(statsMap['IP'] + ' IP');
                                if (statsMap['K']) parts.push(statsMap['K'] + ' K');
                                if (statsMap['ER']) parts.push(statsMap['ER'] + ' ER');
                                if (statsMap['PC']) parts.push(statsMap['PC'] + ' Pitches');
                                return parts.join(', ');
                            }
                        }
                    }
                }
                return '';
            };

            // Render Baseball Live Matchup Card
            if (data.situation && currentOpenGame?.sport === 'baseball') {
                const sit = data.situation;
                
                // Get Batter Athlete & Stats
                const batId = sit.batter?.playerId;
                const batAth = findAthlete(batId);
                const batName = batAth ? batAth.displayName : 'UNKNOWN BATTER';
                const batHeadshot = batAth?.headshot?.href || 'https://a.espncdn.com/i/headshots/placeholder.png';
                const batStats = getBatterStatsString(batId) || '0-0';

                // Get Pitcher Athlete & Stats
                const pitId = sit.pitcher?.playerId;
                const pitAth = findAthlete(pitId);
                const pitName = pitAth ? pitAth.displayName : 'UNKNOWN PITCHER';
                const pitHeadshot = pitAth?.headshot?.href || 'https://a.espncdn.com/i/headshots/placeholder.png';
                const pitStats = getPitcherStatsString(pitId) || '0.0 IP';

                // Matchup Notes / Plays Fallback
                const latestPlayText = plays[plays.length - 1]?.text;
                const matchNote = sit.situationNotes?.[0]?.text || latestPlayText || 'No matchup logs available for this at-bat.';

                // Count Indicators
                const balls = parseInt(sit.balls || 0);
                const strikes = parseInt(sit.strikes || 0);
                const outs = parseInt(sit.outs || 0);

                // Bases occupied
                const on1 = !!sit.onFirst;
                const on2 = !!sit.onSecond;
                const on3 = !!sit.onThird;

                // Runner names for detailed base label
                const run1 = findAthlete(sit.onFirst?.playerId)?.displayName || (sit.onFirst ? 'Runner' : 'Base empty');
                const run2 = findAthlete(sit.onSecond?.playerId)?.displayName || (sit.onSecond ? 'Runner' : 'Base empty');
                const run3 = findAthlete(sit.onThird?.playerId)?.displayName || (sit.onThird ? 'Runner' : 'Base empty');

                // Render Heatmap Zones
                let heatmapCells = '';
                const zones = batAth?.hotZones?.[0]?.zones || [];
                if (zones.length >= 9) {
                    zones.slice(0, 9).forEach(z => {
                        const val = z.battingAvg ? z.battingAvg.toFixed(3).substring(1) : '.000';
                        let cls = 'neutral';
                        if (z.battingAvg >= 0.300) cls = 'hot';
                        else if (z.battingAvg < 0.230) cls = 'cold';
                        heatmapCells += `<div class="egc-heat-cell ${cls}">${val}</div>`;
                    });
                } else {
                    const dummy = ['.000', '.000', '.000', '.000', '.000', '.000', '.000', '.000', '.000'];
                    dummy.forEach(val => {
                        heatmapCells += `<div class="egc-heat-cell neutral">${val}</div>`;
                    });
                }

                const batterSvg = `
                <svg viewBox="0 0 64 128" style="width:40px; height:80px; opacity:0.15; fill:#ffffff; margin-right:8px;">
                    <path d="M30 15c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm18 45c-1-12-11-20-22-20h-6c-1.7 0-3 1.3-3 3s1.3 3 3 3h4c6 0 11 4 12 10l-12 16-8-8c-1.2-1.2-3-1.2-4.2 0s-1.2 3 0 4.2l12 12c1.2 1.2 3 1.2 4.2 0l16-24c1.8-2.7 1.8-6.2.2-8.2zm-28 6l-6 16c-.6 1.6.3 3.3 2 3.9 1.6.6 3.3-.3 3.9-2l6-16c.6-1.6-.3-3.3-2-3.9-1.6-.6-3.3.3-3.9 2zm18 10l-4 28c-.2 1.7 1 3.2 2.7 3.4 1.7.2 3.2-1 3.4-2.7l4-28c.2-1.7-1-3.2-2.7-3.4-1.7-.2-3.2 1-3.4 2.7z"/>
                </svg>
                `;

                html += `
                <div class="espn-game-card">
                    <div class="egc-header">
                        <div class="egc-player-card">

                                <span class="egc-player-stats">${batStats}</span>
                            </div>
                        </div>
                        <div class="egc-vs-badge">VS</div>
                        <div class="egc-player-card" style="justify-content: flex-end; text-align: right;">
                            <div class="egc-player-info" style="align-items: flex-end;">
                                <span class="egc-player-role">PITCHING</span>
                                <span class="egc-player-name">${pitName}</span>
                                <span class="egc-player-stats">${pitStats}</span>
                            </div>
                            <img src="${pitHeadshot}" class="egc-player-img" onerror="this.src='https://a.espncdn.com/i/headshots/placeholder.png'">
                        </div>
                    </div>

                    <div class="egc-grid">
                        <div class="egc-panel-situation">
                            <div class="egc-counts">
                                <div class="egc-count-row">
                                    <span>BALLS</span>
                                    <div class="egc-dots">
                                        <div class="egc-dot ball ${balls >= 1 ? 'active' : ''}"></div>
                                        <div class="egc-dot ball ${balls >= 2 ? 'active' : ''}"></div>
                                        <div class="egc-dot ball ${balls >= 3 ? 'active' : ''}"></div>
                                        <div class="egc-dot ball ${balls >= 4 ? 'active' : ''}"></div>
                                    </div>
                                </div>
                                <div class="egc-count-row">
                                    <span>STRIKES</span>
                                    <div class="egc-dots">
                                        <div class="egc-dot ${strikes >= 1 ? 'active' : ''}"></div>
                                        <div class="egc-dot ${strikes >= 2 ? 'active' : ''}"></div>
                                        <div class="egc-dot ${strikes >= 3 ? 'active' : ''}"></div>
                                    </div>
                                </div>
                                <div class="egc-count-row">
                                    <span>OUTS</span>
                                    <div class="egc-dots">
                                        <div class="egc-dot ${outs >= 1 ? 'active' : ''}"></div>

                                        <div class="egc-dot ${outs >= 3 ? 'active' : ''}"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="egc-diamond">
                                <div class="egc-base second ${on2 ? 'occupied' : ''}" title="2nd Base"></div>
                                <div class="egc-base third ${on3 ? 'occupied' : ''}" title="3rd Base"></div>
                                <div class="egc-base first ${on1 ? 'occupied' : ''}" title="1st Base"></div>
                                <div class="egc-base home" title="Home Plate"></div>
                            </div>

                            <div style="font-size: 8px; color: var(--muted); margin-top: 8px; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                ON BASE: 1B: ${run1.split(' ').pop()} · 2B: ${run2.split(' ').pop()} · 3B: ${run3.split(' ').pop()}
                            </div>
                        </div>

                                ${heatmapCells}

                            <div class="egc-info-text">${matchNote}</div>
                        </div>
                    </div>
                </div>
                `;
            }

            // ── Quarter-by-quarter linescore ──────────────────────────────
            const headerComp = data.header?.competitions?.[0];
            if (headerComp) {
                const competitors = headerComp.competitors || [];
                const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
                const home = competitors.find(c => c.homeAway === 'home') || competitors[0];

                const awayLinescores = away?.linescores || [];
                const homeLinescores = home?.linescores || [];
                const numPeriods = Math.max(awayLinescores.length, homeLinescores.length);
                const periods = Array.from({ length: numPeriods }, (_, i) => i + 1);
                const isOT = numPeriods > 4;
                const isBaseball = currentOpenGame?.sport === 'baseball';

                const getLabel = (i) => {
                    if (isBaseball) return (i + 1);            // 1 2 3 … 9 10 …
                    if (i < 4) return (i + 1);                 // 1 2 3 4
                    const ot = i - 3;                          // 1-indexed OT count
                    return ot === 1 ? 'OT' : (ot + 'OT');     // OT 2OT 3OT …
                };

                const awayAbbr = away?.team?.abbreviation || 'AWAY';
                const homeAbbr = home?.team?.abbreviation || 'HOME';
                const awayLogo = away?.team?.logos?.[0]?.href || '';
                const homeLogo = home?.team?.logos?.[0]?.href || '';
                const awayScore = away?.score || '0';
                const homeScore = home?.score || '0';

                // Series info

                LEAGUES.forEach(lg => {
