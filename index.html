        function buildMain() {
            const mainEl = document.getElementById('main');
            let html = `
      <div class="league-panel ${activeTab === 'live' ? 'active' : ''}" id="panel-live">
        ${renderLivePanel()}
      </div>
            `;
            html += LEAGUES.map(lg => {
                const result = leagueData[lg.id];
                return `
      <div class="league-panel ${activeTab === lg.id ? 'active' : ''}" id="panel-${lg.id}">
        ${result ? renderPanel(lg, result) : '<div class="loading">LOADING GAMES...</div>'}
      </div>
    `;
            }).join('');
            mainEl.innerHTML = html;
            loadKalshiCharts();
        }

        // ── Per-card 24h price chart, drawn below the odds table ──────────
        // Real Kalshi candlestick history via /api/kalshi-history (server
        // proxy — CORS blocks calling Kalshi directly from the browser).
        // Never fabricated: a market with fewer than 2 real candles just
        // shows "not enough history yet" instead of a fake flat line.
        // Each ticker is cached for 5 minutes so re-renders (every poll)
        // don't re-fetch the same chart constantly.
        const kalshiChartCache = {};
        const KALSHI_CHART_TTL_MS = 5 * 60 * 1000;

        function drawKalshiChartSvg(container, points) {
            const w = 300, h = 56, pad = 4;
            const min = 0, max = 100;
            const chartW = w - pad * 2;
            const chartH = h - pad * 2;
            const step = points.length > 1 ? chartW / (points.length - 1) : 0;

            const coords = points.map((p, i) => {
                const x = pad + i * step;
                const y = pad + (chartH - ((p.cents - min) / (max - min) * chartH));
                return { x, y };
            });

            const lineD = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
            const areaD = `${lineD} L ${coords[coords.length - 1].x.toFixed(1)} ${h - pad} L ${coords[0].x.toFixed(1)} ${h - pad} Z`;

            const first = points[0].cents;
            const last = points[points.length - 1].cents;
            const diff = last - first;
            const diffLabel = `${diff >= 0 ? '+' : ''}${diff}\u00a2 24h`;

            container.innerHTML = `
                <span class="bw-chart-label">${diffLabel}</span>
                <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
                    <path class="bw-chart-area" d="${areaD}"></path>
                    <path class="bw-chart-line" d="${lineD}"></path>
                </svg>
            `;
        }

        async function loadKalshiCharts() {
            const containers = document.querySelectorAll('.bw-chart[data-ticker]');
            containers.forEach(async (el) => {
                const ticker = el.dataset.ticker;
                if (!ticker) return;

                const cached = kalshiChartCache[ticker];
                if (cached && (Date.now() - cached.fetchedAt) < KALSHI_CHART_TTL_MS) {
                    if (cached.points && cached.points.length >= 2) {
                        drawKalshiChartSvg(el, cached.points);
                    } else {
                        el.innerHTML = '<div class="bw-chart-loading">Not enough history yet</div>';
                    }
                    return;
                }

                try {
                    const res = await fetch('/api/kalshi-history?ticker=' + encodeURIComponent(ticker));
                    if (!res.ok) throw new Error('status ' + res.status);
                    const data = await res.json();
                    const points = data.points || [];
                    kalshiChartCache[ticker] = { points, fetchedAt: Date.now() };

                    // Element may have been replaced by a re-render while the
                    // fetch was in flight — re-query by ticker before drawing.
                    const liveEl = document.querySelector(`.bw-chart[data-ticker="${ticker}"]`);
                    if (!liveEl) return;

                    if (points.length >= 2) {
                        drawKalshiChartSvg(liveEl, points);
                    } else {
                        liveEl.innerHTML = '<div class="bw-chart-loading">Not enough history yet</div>';
                    }
                } catch (e) {
                    const liveEl = document.querySelector(`.bw-chart[data-ticker="${ticker}"]`);
                    if (liveEl) liveEl.innerHTML = '<div class="bw-chart-loading">Chart unavailable</div>';
                }
            });
        }

        function switchTab(id) {
            activeTab = id;
            buildTabs();
            document.querySelectorAll('.league-panel').forEach(p => p.classList.remove('active'));
            const panel = document.getElementById('panel-' + id);
            if (panel) panel.classList.add('active');
        }

        async function pollLeague(lg, manual = false) {
            const now = Date.now();
            const result = await fetchLeague(lg);
            leagueData[lg.id] = result;
            
            if (result.leagues && result.leagues[0] && result.leagues[0].logos) {
                lg.logo = result.leagues[0].logos[0].href;
            }

            let shouldFetchOdds = manual || !paidOddsCache[lg.id];
            let hasActive = false;
            let hasUpcomingSoon = false;

            if (result.ok && result.events) {
                result.events.forEach(e => {
                    const comp = e.competitions?.[0];
                    const competitors = comp?.competitors || [];
                    const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
                    const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
                    const currentScore = `${home?.score || 0}-${away?.score || 0}`;
                    const currentStatus = e.status?.type?.state || '';
                    
                    const stateKey = currentScore + '|' + currentStatus;

                    if (currentStatus === 'in') hasActive = true;
                    if (currentStatus === 'pre') {
                        const gameTime = new Date(e.date).getTime();
                        const minsAway = (gameTime - now) / 60000;
                        if (minsAway <= 60) hasUpcomingSoon = true;
                    }

                    if (previousGameState[e.id] !== stateKey) {
                        // Only trigger odds fetch if the game is active or pre-game
                        if (currentStatus === 'in' || currentStatus === 'pre') {
                            shouldFetchOdds = true;
                        }
                        previousGameState[e.id] = stateKey;
                    }
                });
            }

            // Determine next poll interval for ESPN
            let interval = 3600; // 1 hour default
            if (hasActive) interval = 15; // 15 seconds if any live game
            else if (hasUpcomingSoon) interval = 60; // 1 min if game within an hour

            leaguePollingState[lg.id].interval = interval;
            leaguePollingState[lg.id].nextPoll = Date.now() + (interval * 1000);

            // Fetch Odds API only if there was a score/status change, or manual override
            if (shouldFetchOdds) {
                const prevUsed = globalMaxUsed;
                const oddsData = await fetchPaidOdds(lg);
                if (oddsData && oddsData.length > 0) {
                    paidOddsCache[lg.id] = oddsData;
                }

                if (prevUsed !== null && globalMaxUsed !== null) {
                    lastRefreshCost = globalMaxUsed - prevUsed;
                    localStorage.setItem('espn_api_usage', globalMaxUsed);
                }
            }

            // Re-render
            const panel = document.getElementById('panel-' + lg.id);
            if (panel) panel.innerHTML = renderPanel(lg, result);
            const livePanel = document.getElementById('panel-live');
            if (livePanel) livePanel.innerHTML = renderLivePanel();
            buildTabs();
            loadKalshiCharts();

            const usageEl = document.getElementById('api-usage');
            if (usageEl && globalRemaining !== null) {
                usageEl.textContent = `API: ${globalRemaining} LEFT (Cost: ${lastRefreshCost})`;
                usageEl.style.display = 'inline';
            }

            if (currentOpenGame) {
                const card = document.getElementById(`card-${currentOpenGame.panelType}-${currentOpenGame.eventId}`);
                if (card) {
                    card.classList.add('expanded');
                    refreshGameDetails();
                } else {
                    currentOpenGame = null;
                }
            }
        }

        let currentOpenGame = null;

        async function toggleGameDetails(eventId, sport, league, panelType) {
            const card = document.getElementById(`card-${panelType}-${eventId}`);

            if (currentOpenGame && currentOpenGame.eventId === eventId && currentOpenGame.panelType === panelType) {
                card.classList.remove('expanded');
                currentOpenGame = null;
                return;
            }

            if (currentOpenGame) {
                const oldCard = document.getElementById(`card-${currentOpenGame.panelType}-${currentOpenGame.eventId}`);
                if (oldCard) oldCard.classList.remove('expanded');
            }

            currentOpenGame = { eventId, sport, league, panelType };
            card.classList.add('expanded');
            const detailsEl = document.getElementById(`details-${panelType}-${eventId}`);
            detailsEl.innerHTML = '<div class="loading" style="padding:20px 0;">LOADING DEEP DATA...</div>';
            await refreshGameDetails();
        }

        async function refreshGameDetails() {
            if (!currentOpenGame) return;
            const { eventId, sport, league, panelType } = currentOpenGame;
            const url = `https://site.api.espn.com/apis/site/v2/sports/${sport}/${league}/summary?event=${eventId}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                renderSidePanel(data);
            } catch (e) {
                const detailsEl = document.getElementById(`details-${panelType}-${eventId}`);
                if (detailsEl) detailsEl.innerHTML = `<div class="error-msg">Failed to load details: ${e.message}</div>`;
            }
        }

        function renderSidePanel(data) {
            if (!currentOpenGame) return;
            const detailsEl = document.getElementById(`details-${currentOpenGame.panelType}-${currentOpenGame.eventId}`);
            if (!detailsEl) return;

            const box = data.boxscore;
            const plays = data.plays || [];

            let html = '';

            // Athlete lookup helper
            const findAthlete = (id) => {
                if (!id || !data.rosters) return null;
                for (const r of data.rosters) {
                    if (r.roster) {
                        const entry = r.roster.find(item => item.athlete && item.athlete.id == id);
                        if (entry) return entry.athlete;
                    }
                }
                if (data.boxscore && data.boxscore.players) {
                    for (const tp of data.boxscore.players) {
                        if (tp.statistics) {
                            for (const stat of tp.statistics) {
                                if (stat.athletes) {
                                    const entry = stat.athletes.find(a => a.athlete && a.athlete.id == id);
                                    if (entry) return entry.athlete;
                                }
                            }
                        }
                    }
                }
                return null;
            };

            // Batter Stats helper
            const getBatterStatsString = (athleteId) => {
                if (!athleteId || !data.boxscore || !data.boxscore.players) return '';
                for (const tp of data.boxscore.players) {
                    if (tp.statistics) {
                        for (const st of tp.statistics) {
                            const ath = st.athletes?.find(a => a.athlete?.id == athleteId);
                            if (ath && ath.stats && st.labels) {
                                const statsMap = {};
                                st.labels.forEach((lbl, idx) => {
                                    statsMap[lbl] = ath.stats[idx];
                                });
                                const parts = [];
                                if (statsMap['H-AB']) parts.push(statsMap['H-AB']);
                                if (statsMap['RBI'] && parseInt(statsMap['RBI']) > 0) {
                                    parts.push(statsMap['RBI'] + ' RBI');
                                }
                                if (statsMap['BB'] && parseInt(statsMap['BB']) > 0) {
                                    parts.push(statsMap['BB'] + ' BB');
                                }
                                if (statsMap['HR'] && parseInt(statsMap['HR']) > 0) {
                                    parts.push(statsMap['HR'] + ' HR');
                                }
                                return parts.join(', ');
                            }
                        }
                    }
                }
                return '';
            };

            // Pitcher Stats helper
            const getPitcherStatsString = (athleteId) => {
                if (!athleteId || !data.boxscore || !data.boxscore.players) return '';
                for (const tp of data.boxscore.players) {
                    if (tp.statistics) {
                        for (const st of tp.statistics) {
                            const ath = st.athletes?.find(a => a.athlete?.id == athleteId);
                            if (ath && ath.stats && st.labels) {
                                const statsMap = {};
                                st.labels.forEach((lbl, idx) => {
                                    statsMap[lbl] = ath.stats[idx];
                                });
                                const parts = [];
                                if (statsMap['IP']) parts.push(statsMap['IP'] + ' IP');
                                if (statsMap['K']) parts.push(statsMap['K'] + ' K');
                                if (statsMap['ER']) parts.push(statsMap['ER'] + ' ER');
                                if (statsMap['PC']) parts.push(statsMap['PC'] + ' Pitches');
                                return parts.join(', ');
                            }
                        }
                    }
                }
                return '';
            };

            // Render Football Live Possession & Field Card
            if (data.situation && (currentOpenGame?.sport === 'football' || data.situation.down !== undefined || data.situation.possessionText)) {
                const headerComp = data.header?.competitions?.[0];
                const competitors = headerComp?.competitors || [];
                const away = competitors.find(c => c.homeAway === 'away') || competitors[1] || { team: {} };
                const home = competitors.find(c => c.homeAway === 'home') || competitors[0] || { team: {} };
                const statusText = data.header?.competitions?.[0]?.status?.type?.detail || 'In Progress';
                
                html += renderFootballGraphic(data.situation, away, home, statusText);
            }

            // Render Baseball Live Matchup Card
            if (data.situation && currentOpenGame?.sport === 'baseball') {
                const sit = data.situation;
                
                // Get Batter Athlete & Stats
                const batId = sit.batter?.playerId || sit.dueUp?.[0]?.playerId;
                const batAth = findAthlete(batId) || sit.batter?.athlete || sit.dueUp?.[0]?.athlete;
                const batName = batAth ? (batAth.displayName || batAth.fullName) : (sit.dueUp?.[0] ? 'DUE UP' : 'UNKNOWN BATTER');
                const batHeadshot = getAthleteHeadshot(batAth, batId);
                const batStats = getBatterStatsString(batId) || sit.batter?.summary || sit.dueUp?.[0]?.summary || '0-0';

                // Get Pitcher Athlete & Stats
                const pitId = sit.pitcher?.playerId;
                const pitAth = findAthlete(pitId) || sit.pitcher?.athlete;
                const pitName = pitAth ? (pitAth.displayName || pitAth.fullName) : 'UNKNOWN PITCHER';
                const pitHeadshot = getAthleteHeadshot(pitAth, pitId);
                const pitStats = getPitcherStatsString(pitId) || sit.pitcher?.summary || '0.0 IP';

                // Matchup Notes / Plays Fallback
                const latestPlayText = plays[plays.length - 1]?.text;
                const matchNote = sit.situationNotes?.[0]?.text || latestPlayText || 'No matchup logs available for this at-bat.';

                // Count Indicators
                const balls = parseInt(sit.balls || 0);
                const strikes = parseInt(sit.strikes || 0);
                const outs = parseInt(sit.outs || 0);

                // Bases occupied
                const on1 = !!sit.onFirst;
                const on2 = !!sit.onSecond;
                const on3 = !!sit.onThird;

                // Runner names for detailed base label
                const run1 = findAthlete(sit.onFirst?.playerId)?.displayName || (sit.onFirst ? 'Runner' : 'Base empty');
                const run2 = findAthlete(sit.onSecond?.playerId)?.displayName || (sit.onSecond ? 'Runner' : 'Base empty');
                const run3 = findAthlete(sit.onThird?.playerId)?.displayName || (sit.onThird ? 'Runner' : 'Base empty');

                // Render Heatmap Zones
                let heatmapCells = '';
                const zones = batAth?.hotZones?.[0]?.zones || [];
                if (zones.length >= 9) {
                    zones.slice(0, 9).forEach(z => {
                        const val = z.battingAvg ? z.battingAvg.toFixed(3).substring(1) : '.000';
                        let cls = 'neutral';
                        if (z.battingAvg >= 0.300) cls = 'hot';
                        else if (z.battingAvg < 0.230) cls = 'cold';
                        heatmapCells += `<div class="egc-heat-cell ${cls}">${val}</div>`;
                    });
                } else {
                    const dummy = ['.000', '.000', '.000', '.000', '.000', '.000', '.000', '.000', '.000'];
                    dummy.forEach(val => {
                        heatmapCells += `<div class="egc-heat-cell neutral">${val}</div>`;
                    });
                }

                const batterSvg = `
                <svg viewBox="0 0 64 128" style="width:40px; height:80px; opacity:0.15; fill:#ffffff; margin-right:8px;">
                    <path d="M30 15c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm18 45c-1-12-11-20-22-20h-6c-1.7 0-3 1.3-3 3s1.3 3 3 3h4c6 0 11 4 12 10l-12 16-8-8c-1.2-1.2-3-1.2-4.2 0s-1.2 3 0 4.2l12 12c1.2 1.2 3 1.2 4.2 0l16-24c1.8-2.7 1.8-6.2.2-8.2zm-28 6l-6 16c-.6 1.6.3 3.3 2 3.9 1.6.6 3.3-.3 3.9-2l6-16c.6-1.6-.3-3.3-2-3.9-1.6-.6-3.3.3-3.9 2zm18 10l-4 28c-.2 1.7 1 3.2 2.7 3.4 1.7.2 3.2-1 3.4-2.7l4-28c.2-1.7-1-3.2-2.7-3.4-1.7-.2-3.2 1-3.4 2.7z"/>
                </svg>
                `;

                html += `
                <div class="espn-game-card">
                    <div class="egc-header">
                        <div class="egc-player-card">
                            <img src="${batHeadshot}" class="egc-player-img" onerror="this.src='https://a.espncdn.com/i/headshots/placeholder.png'">
                            <div class="egc-player-info">
                                <span class="egc-player-role">NOW AT BAT</span>
                                <span class="egc-player-name">${batName}</span>
                                <span class="egc-player-stats">${batStats}</span>
                            </div>
                        </div>
                        <div class="egc-vs-badge">VS</div>
                        <div class="egc-player-card" style="justify-content: flex-end; text-align: right;">
                            <div class="egc-player-info" style="align-items: flex-end;">
                                <span class="egc-player-role">PITCHING</span>
                                <span class="egc-player-name">${pitName}</span>
                                <span class="egc-player-stats">${pitStats}</span>
                            </div>
                            <img src="${pitHeadshot}" class="egc-player-img" onerror="this.src='https://a.espncdn.com/i/headshots/placeholder.png'">
                        </div>
                    </div>

                    <div class="egc-grid">
                        <div class="egc-panel-situation">
                            <div class="egc-counts">
                                <div class="egc-count-row">
                                    <span>BALLS</span>
                                    <div class="egc-dots">
                                        <div class="egc-dot ball ${balls >= 1 ? 'active' : ''}"></div>
                                        <div class="egc-dot ball ${balls >= 2 ? 'active' : ''}"></div>
                                        <div class="egc-dot ball ${balls >= 3 ? 'active' : ''}"></div>
                                        <div class="egc-dot ball ${balls >= 4 ? 'active' : ''}"></div>
                                    </div>
                                </div>
                                <div class="egc-count-row">
                                    <span>STRIKES</span>
                                    <div class="egc-dots">
                                        <div class="egc-dot ${strikes >= 1 ? 'active' : ''}"></div>
                                        <div class="egc-dot ${strikes >= 2 ? 'active' : ''}"></div>
                                        <div class="egc-dot ${strikes >= 3 ? 'active' : ''}"></div>
                                    </div>
                                </div>
                                <div class="egc-count-row">
                                    <span>OUTS</span>
                                    <div class="egc-dots">
                                        <div class="egc-dot ${outs >= 1 ? 'active' : ''}"></div>
                                        <div class="egc-dot ${outs >= 2 ? 'active' : ''}"></div>
                                        <div class="egc-dot ${outs >= 3 ? 'active' : ''}"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="egc-diamond">
                                <div class="egc-base second ${on2 ? 'occupied' : ''}" title="2nd Base"></div>
                                <div class="egc-base third ${on3 ? 'occupied' : ''}" title="3rd Base"></div>
                                <div class="egc-base first ${on1 ? 'occupied' : ''}" title="1st Base"></div>
                                <div class="egc-base home" title="Home Plate"></div>
                            </div>

                            <div style="font-size: 8px; color: var(--muted); margin-top: 8px; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                ON BASE: 1B: ${run1.split(' ').pop()} · 2B: ${run2.split(' ').pop()} · 3B: ${run3.split(' ').pop()}
                            </div>
                        </div>

                        <div class="egc-panel-heatmap">
                            ${batterSvg}
                            <div class="egc-heatmap-grid">
                                ${heatmapCells}
                            </div>
                        </div>

                        <div class="egc-panel-info">
                            <span class="egc-info-title">MATCHUP INSIGHT</span>
                            <div class="egc-info-text">${matchNote}</div>
                        </div>
                    </div>
                </div>
                `;
            }

            // ── Quarter-by-quarter linescore ──────────────────────────────
            const headerComp = data.header?.competitions?.[0];
            if (headerComp) {
                const competitors = headerComp.competitors || [];
                const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
                const home = competitors.find(c => c.homeAway === 'home') || competitors[0];

                const awayLinescores = away?.linescores || [];
                const homeLinescores = home?.linescores || [];
                const numPeriods = Math.max(awayLinescores.length, homeLinescores.length);
                const periods = Array.from({ length: numPeriods }, (_, i) => i + 1);
                const isOT = numPeriods > 4;
                const isBaseball = currentOpenGame?.sport === 'baseball';

                const getLabel = (i) => {
                    if (isBaseball) return (i + 1);            // 1 2 3 … 9 10 …
                    if (i < 4) return (i + 1);                 // 1 2 3 4
                    const ot = i - 3;                          // 1-indexed OT count
                    return ot === 1 ? 'OT' : (ot + 'OT');     // OT 2OT 3OT …
                };

                const awayAbbr = away?.team?.abbreviation || 'AWAY';
                const homeAbbr = home?.team?.abbreviation || 'HOME';
                const awayLogo = away?.team?.logos?.[0]?.href || '';
                const homeLogo = home?.team?.logos?.[0]?.href || '';
                const awayScore = away?.score || '0';
                const homeScore = home?.score || '0';

                // Series info
                const seriesArr = headerComp.series || [];
                const playoffSeries = seriesArr.find(s => s.type === 'playoff');
                const seriesSummary = playoffSeries?.summary || '';
                const gameNote = data.header?.gameNote || '';

                // Venue

                const venueLine = venue ? `${venue.fullName} · ${venue.address?.city}, ${venue.address?.state}` : '';

                html += `

                                <td style="text-align:center; padding:8px 14px; font-weight:700; color:var(--fg); font-size:14px;">${awayScore}</td>

            // Leaders

                if (awayLeaders.length && homeLeaders.length) {
                    html += `
        <div class="sp-section">
          <div class="sp-section-title">Top Performers</div>
          <div class="sp-leaders-grid">
            <div class="sp-team-col">
              <div style="font-size:10px;color:var(--muted);margin-bottom:8px;">AWAY</div>
              ${awayLeaders.slice(0, 3).map(c => c.leaders?.[0] ? `
                <div class="sp-leader">
                  <div>
                    <div style="font-size:9px;color:var(--accent2);">${c.displayName}</div>
                    <div class="sp-leader-name">${c.leaders[0].athlete.shortName}</div>

              ` : '').join('')}
            </div>
            <div class="sp-team-col">
              <div style="font-size:10px;color:var(--muted);margin-bottom:8px;">HOME</div>
              ${homeLeaders.slice(0, 3).map(c => c.leaders?.[0] ? `
                <div class="sp-leader">
                  <div>
                    <div style="font-size:9px;color:var(--accent2);">${c.displayName}</div>
                    <div class="sp-leader-name">${c.leaders[0].athlete.shortName}</div>
                  </div>
                  <div class="sp-leader-val">${c.leaders[0].displayValue}</div>
                </div>
              ` : '').join('')}
            </div>
          </div>
        </div>
      `;
                }
            }

            // Team Stats
            if (box && box.teams) {
                const t1 = box.teams[0];
                const t2 = box.teams[1];
                if (t1.statistics && t2.statistics) {
                    html += `
         <div class="sp-section">
           <div class="sp-section-title">Team Stats</div>
           <div class="sp-stat-row" style="color:var(--muted);font-size:10px;">
             <span>${t1.team.abbreviation}</span>
             <span>STAT</span>
             <span>${t2.team.abbreviation}</span>

           ${t1.statistics.slice(0, 8).map((s1, i) => {
                        const s2 = t2.statistics[i];
                        return `
               <div class="sp-stat-row">
                 <span style="font-weight:600;">${s1.displayValue}</span>
                 <span class="sp-stat-label">${s1.label || s1.name}</span>
                 <span style="font-weight:600;">${s2 ? s2.displayValue : '-'}</span>

             `;
                    }).join('')}
         </div>
       `;
                }

            // Boxscore (Players)
            if (data.boxscore && data.boxscore.players) {
                data.boxscore.players.forEach(teamData => {
                    const statsBlock = teamData.statistics?.[0];
                    if (!statsBlock) return;

                    html += `

                    statsBlock.athletes.forEach(a => {

                        if (a.didNotPlay) {

                    if (statsBlock.totals) {
                        html += `<tr class="totals-row">`;
                        html += `<td class="col-player">TEAM</td>`;

            detailsEl.innerHTML = html || '<div class="no-games">No deep data available yet.</div>';

        async function initialLoad() {
            buildMain();
            const fetches = LEAGUES.map(lg => pollLeague(lg, true));
            await Promise.all(fetches);
        }

        initialLoad();

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            if (btn) btn.textContent = `↻ FETCHING...`;
            LEAGUES.forEach(lg => pollLeague(lg, true).then(() => {
                if (btn) btn.textContent = `↻ FORCE REFRESH`;
            }));
        }

        let isTabVisible = true;
        document.addEventListener("visibilitychange", () => {
            isTabVisible = !document.hidden;
            if (isTabVisible) {
                const now = Date.now();
                // If we were hidden and missed a poll, poll immediately
                LEAGUES.forEach(lg => {
                    if (now >= leaguePollingState[lg.id].nextPoll) {
                        leaguePollingState[lg.id].nextPoll = now + 9999999;
                        pollLeague(lg).catch(e => console.error(e));
                    }
                });
            }
        });

        setInterval(() => {
            if (!isTabVisible) return;
            const now = Date.now();
            LEAGUES.forEach(lg => {
                if (now >= leaguePollingState[lg.id].nextPoll) {
                    // Prevent concurrent overlapping polls for the same league
                    leaguePollingState[lg.id].nextPoll = now + 9999999; 
                    pollLeague(lg).catch(e => console.error(e));
                }
            });
        }, 1000);

    <button class="bs-toggle" onclick="toggleBetSlip()">BET SLIP (<span id="bs-count">0</span>)</button>

            <div style="color:var(--muted); font-size:12px; text-align:center;">You have no active wagers.</div>

    <script>
        let bankroll = 100000.00;
        let debtTokens = 0.00;
        let betSlip = [];
        let activeBsTab = 'slip';

        // Conversion helper from American odds to decimal multiplier (stake multiplier)
        function americanToDecimal(americanOdds) {
            const val = parseInt(americanOdds);
            if (isNaN(val)) return 1.0;
            if (val > 0) {
                return 1.0 + (val / 100);
            } else {
                return 1.0 + (100 / Math.abs(val));
            }
        }

        // Normalize wagers to ensure cross-page compatibility and prevent errors
        function normalizeWager(w) {
            const stakeVal = parseFloat(w.stake !== undefined ? w.stake : (w.wager !== undefined ? w.wager : 0));
            const payoutOdds = w.placedOdds || w.detail || '+100';
            return {
                id: w.id || ('wager-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9)),
                target: w.target || 'Unknown Selection',
                matchup: w.matchup || 'Unknown Matchup',
                stake: stakeVal,
                placedOdds: payoutOdds,
                currentOdds: w.currentOdds || payoutOdds,
                sportsbook: w.sportsbook || 'FanDuel',
                status: w.status || 'PENDING',
                history: Array.isArray(w.history) ? w.history : [payoutOdds],
                type: w.type || 'GAME'
            };
        }

        function switchBsTab(tab) {
            activeBsTab = tab;
            const slipTab = document.getElementById('bs-tab-slip');
            const activeTab = document.getElementById('bs-tab-active');
            const slipContainer = document.getElementById('bs-items');
            const activeContainer = document.getElementById('bs-active-bets');
            const slipFooter = document.getElementById('bs-footer-slip');

            if (tab === 'slip') {
                slipTab.classList.add('active');
                activeTab.classList.remove('active');
                slipContainer.style.display = 'flex';
                activeContainer.style.display = 'none';
                slipFooter.style.display = 'block';
            } else {
                slipTab.classList.remove('active');
                activeTab.classList.add('active');
                slipContainer.style.display = 'none';
                activeContainer.style.display = 'flex';
                slipFooter.style.display = 'none'; // hide place bet button for active wagers
                renderActiveBetsInPanel();
            }
        }

        function updateActiveBetsCountGlobal() {
            const saved = localStorage.getItem('destiny_game_wagers');
            let wagers = [];
            if (saved) {
                try { wagers = JSON.parse(saved); } catch(e) { wagers = []; }
            }
            // Filter out Timberwolves wagers
            wagers = wagers.filter(w => {
                const target = w.target || '';
                const matchup = w.matchup || '';
                return !target.toLowerCase().includes('timberwolves') && 
                       !matchup.toLowerCase().includes('minnesota') && 
                       !matchup.toLowerCase().includes('timberwolves');
            });
            const activeCountEl = document.getElementById('bs-active-count');
            if (activeCountEl) activeCountEl.innerText = wagers.length;
        }

        function renderActiveBetsInPanel() {
            const container = document.getElementById('bs-active-bets');
            const saved = localStorage.getItem('destiny_game_wagers');
            let wagers = [];
            if (saved) {
                try { 
                    wagers = JSON.parse(saved).map(normalizeWager); 
                } catch(e) { 
                    wagers = []; 
                }
            }

            // Filter out Timberwolves wagers
            wagers = wagers.filter(w => {
                const target = w.target || '';
                const matchup = w.matchup || '';
                return !target.toLowerCase().includes('timberwolves') && 
                       !matchup.toLowerCase().includes('minnesota') && 
                       !matchup.toLowerCase().includes('timberwolves');
            });

            const activeCountEl = document.getElementById('bs-active-count');
            if (activeCountEl) activeCountEl.innerText = wagers.length;

            if (wagers.length === 0) {
                container.innerHTML = '<div style="color:var(--muted); font-size:12px; text-align:center; padding-top:20px;">You have no active wagers.</div>';
                return;
            }

            container.innerHTML = wagers.map(w => {
                const isProp = w.type === 'PROP';
                const cleanTarget = w.target;
                const isPending = w.status === 'PENDING';
                
                return `
                    <div class="bs-active-wager-card">
                        <div class="bs-active-wager-header">
                            <span class="bs-active-wager-title" style="word-break: break-word; max-width: 75%;">${cleanTarget}</span>
                            <span class="badge ${w.status.toLowerCase()}" style="font-size:8px; padding:2px 6px;">${w.status}</span>
                        </div>
                        <div class="bs-active-wager-matchup">${w.matchup}</div>
                        <div class="bs-active-wager-row">
                            <span style="color:var(--muted)">Bookmaker:</span>
                            <span style="color:#fff; font-weight:600; text-transform:uppercase;">${w.sportsbook}</span>
                        </div>
                        <div class="bs-active-wager-row">
                            <span style="color:var(--muted)">Placed Odds:</span>
                            <span style="color:var(--accent2); font-weight:600;">${w.placedOdds}</span>
                        </div>
                        <div class="bs-active-wager-row">
                            <span style="color:var(--muted)">Stake / Payout:</span>
                            <span style="color:#fff; font-weight:600;">$${w.stake.toFixed(2)} → $${(w.stake * americanToDecimal(w.placedOdds)).toFixed(2)}</span>
                        </div>
                        ${isPending ? `
                        <div class="bs-active-wager-row" style="margin-top: 8px; border-top:1px dashed var(--border2); padding-top:6px;">
                            <span style="color:var(--muted)">Live Odds:</span>
                            <span style="color:#fff; font-weight:bold;">${w.currentOdds}</span>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Initialize: clear past wagers & set $1M default bankroll + crypto debt tokens
        localStorage.removeItem('wagers');
        localStorage.removeItem('espn_api_usage');
        
        bankroll = 1000000.00;
        debtTokens = 0.00;

        const savedBankroll = localStorage.getItem('destiny_bankroll') || localStorage.getItem('bankroll');
        if (savedBankroll !== null && !isNaN(parseFloat(savedBankroll))) {
            const parsed = parseFloat(savedBankroll);
            if (parsed < 1000000.00) {
                bankroll = 1000000.00;
            } else {
                bankroll = parsed;
            }
        } else {
            bankroll = 1000000.00;
        }

        localStorage.setItem('destiny_bankroll', bankroll);
        localStorage.setItem('bankroll', bankroll);

        const savedDebt = localStorage.getItem('destiny_debt_tokens');
        if (savedDebt !== null && !isNaN(parseFloat(savedDebt))) {
            debtTokens = parseFloat(savedDebt);
        }

        function updateBankrollDisplay() {
            const bEl = document.getElementById('bankroll-amount');
            if (bEl) bEl.innerText = bankroll.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const dBadge = document.getElementById('debt-tokens-badge');
            const dEl = document.getElementById('debt-tokens-amount');
            if (dBadge && dEl) {
                if (debtTokens > 0) {
                    dBadge.style.display = 'inline-flex';
                    dEl.innerText = debtTokens.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                } else {
                    dBadge.style.display = 'none';
                }
            }
        }
        updateBankrollDisplay();

        function toggleBetSlip() {
            document.getElementById('bet-slip-panel').classList.toggle('open');
        }

        function addToBetSlip(team, type, odds) {
            if (odds === '-' || odds === undefined || odds === '' || odds.includes('—')) return;
            
            // Clean up team name
            let displayTeam = (team || '').trim();
            if (displayTeam.includes('<')) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = displayTeam;
                displayTeam = tempDiv.textContent || tempDiv.innerText || 'Unknown Team';
            }
            displayTeam = displayTeam.trim() || 'Unknown Team';
            
            let line = '';
            let price = '';
            
            const parts = odds.toString().trim().split(/\s+/);
            if (parts.length > 1) {
                price = parts[parts.length - 1];
                line = parts.slice(0, parts.length - 1).join(' ');
            } else {
                const val = parts[0];
                if (val.includes('.') || (val.startsWith('+') && parseFloat(val) < 50 && parseFloat(val) > -50)) {
                    line = val;
                    price = '-110';
                } else {
                    price = val;
                }
            }
            
            let cleanedPrice = parseInt(price.replace(/[^0-9-]/g, ''));
            if (isNaN(cleanedPrice)) {
                cleanedPrice = -110;
            }
            
            let displayType = type;
            if (line) {
                displayType = `${type} (${line})`;
            }
            
            betSlip.push({ id: Date.now(), team: displayTeam, type: displayType, odds: cleanedPrice, wager: 0 });
            renderBetSlip();
            document.getElementById('bet-slip-panel').classList.add('open');
        }

        function removeFromBetSlip(id) {
            betSlip = betSlip.filter(b => b.id !== id);
            renderBetSlip();
        }

        function updateWager(id, amount) {
            const bet = betSlip.find(b => b.id === id);
            if (bet) {
                bet.wager = parseFloat(amount) || 0;
                const payout = calculatePayout(bet.wager, bet.odds);
                const payoutEl = document.getElementById(`payout-${id}`);
                if (payoutEl) {
                    payoutEl.innerText = payout.toFixed(2);
                }
            }
        }

        function setMaxWager(id) {
            const bet = betSlip.find(b => b.id === id);
            if (!bet) return;
            const otherWagers = betSlip.filter(b => b.id !== id).reduce((sum, b) => sum + (parseFloat(b.wager) || 0), 0);
            const availBankroll = Math.max(0, bankroll - otherWagers);
            bet.wager = availBankroll > 0 ? availBankroll : (bankroll > 0 ? bankroll : 1000.00);
            renderBetSlip();
        }

        function calculatePayout(wager, odds) {
            if (!wager) return 0;
            if (odds > 0) return wager + (wager * (odds / 100));
            if (odds < 0) return wager + (wager * (100 / Math.abs(odds)));
            return wager;
        }

        function renderBetSlip() {
            const container = document.getElementById('bs-items');
            document.getElementById('bs-count').innerText = betSlip.length;
            const slipCountEl = document.getElementById('bs-slip-count');
            if (slipCountEl) slipCountEl.innerText = betSlip.length;

            if (betSlip.length === 0) {
                container.innerHTML = '<div style="color:var(--muted); font-size:12px; text-align:center;">Your bet slip is empty.</div>';
                return;
            }

            container.innerHTML = betSlip.map(bet => `
                <div class="bs-item">
                    <div class="bs-item-head">
                        <span class="bs-item-team">${bet.team}</span>
                        <button class="bs-remove" onclick="removeFromBetSlip(${bet.id})">×</button>
                    </div>
                    <div class="bs-item-type">${bet.type} <span style="float:right" class="bs-item-odds">${bet.odds > 0 ? '+' : ''}${bet.odds}</span></div>
                    <div class="bs-wager-row" style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
                        <div style="display:flex; align-items:center; gap:4px; flex:1;">
                            <span style="font-size:12px;color:var(--muted)">Wager: $</span>
                            <input type="number" id="wager-input-${bet.id}" class="bs-wager-input" placeholder="0.00" value="${bet.wager || ''}" onchange="updateWager(${bet.id}, this.value)" onkeyup="updateWager(${bet.id}, this.value)" style="flex:1; min-width:0;">
                        </div>
                        <button class="bs-max-btn" onclick="setMaxWager(${bet.id})" title="Set wager to maximum available bankroll">MAX</button>
                    </div>
                    <div class="bs-to-win">To Win: $<span id="payout-${bet.id}">${(calculatePayout(bet.wager || 0, bet.odds) - (bet.wager || 0)).toFixed(2)}</span></div>
                </div>
            `).join('');
        }

        function placeBets() {
            let totalWager = betSlip.reduce((sum, bet) => sum + (parseFloat(bet.wager) || 0), 0);
            if (totalWager <= 0) return alert('Please enter wager amounts.');

            if (totalWager > bankroll) {
                const deficit = totalWager - bankroll;
                const confirmDebt = confirm(
                    `🪙 INSUFFICIENT BANKROLL!\n\n` +
                    `Your wager total ($${totalWager.toFixed(2)}) exceeds your available bankroll ($${bankroll.toFixed(2)}).\n\n` +
                    `Would you like to issue $${deficit.toFixed(2)} in Crypto Debt Tokens (DEBT) to cover the overdraft and place this bet?`
                );
                if (!confirmDebt) return;

                debtTokens += deficit;
                bankroll = 0.00;
                localStorage.setItem('destiny_debt_tokens', debtTokens);
                localStorage.setItem('destiny_bankroll', bankroll);
                localStorage.setItem('bankroll', bankroll);
                updateBankrollDisplay();
            } else {
                bankroll -= totalWager;
                localStorage.setItem('destiny_bankroll', bankroll);
                localStorage.setItem('bankroll', bankroll);
                updateBankrollDisplay();
            }

            // Log each placed bet into destiny_game_wagers!
            const KEY = 'destiny_game_wagers';
            let wagers = [];
            try { wagers = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { wagers = []; }
            
            betSlip.forEach(bet => {
                let matchupName = 'Unknown Game';
                for (const lgId in leagueData) {
                    const events = leagueData[lgId]?.events || [];
                    const found = events.find(ev => {
                        const comp = ev.competitions?.[0];
                        return comp?.competitors?.some(c => c.team?.name === bet.team || c.team?.abbreviation === bet.team || c.team?.displayName === bet.team);
                    });
                    if (found) {
                        const comp = found.competitions[0];
                        const away = comp.competitors.find(c => c.homeAway === 'away');
                        const home = comp.competitors.find(c => c.homeAway === 'home');
                        matchupName = `${away.team?.abbreviation || 'AWAY'} @ ${home.team?.abbreviation || 'HOME'}`;
                        break;
                    }
                }
                
                if (matchupName === 'Unknown Game' && (bet.team.includes('Thunder') || bet.team.includes('OKC') || bet.team.includes('Spurs') || bet.team.includes('SAS'))) {
                    matchupName = 'OKC @ SAS';
                }

                const cleanOddsStr = (bet.odds > 0 ? '+' : '') + bet.odds;
                const cleanType = bet.type.split(' ')[0];
                const cleanDetail = bet.type.includes('(') ? bet.type.match(/\(([^)]+)\)/)?.[1] || '' : cleanOddsStr;
                const displayTarget = `${cleanType} — ${bet.team} ${cleanDetail}`;

                wagers.push({
                    id: 'placed-' + bet.id + '-' + Date.now(),
                    matchup: matchupName,
                    target: displayTarget,
                    type: cleanType,
                    detail: cleanDetail,
                    wager: bet.wager,
                    stake: bet.wager,
                    placedOdds: cleanOddsStr,
                    currentOdds: cleanOddsStr,
                    sportsbook: 'FanDuel',
                    status: 'PENDING',
                    history: [cleanOddsStr, cleanOddsStr, cleanOddsStr],
                    betType: 'GAME',
                    toWin: calculatePayout(bet.wager, bet.odds) - bet.wager
                });
            });
            
            localStorage.setItem(KEY, JSON.stringify(wagers));

            betSlip = [];
            renderBetSlip();
            updateAllCardBetsCounts();
            updateActiveBetsCountGlobal();
            if (activeBsTab === 'active') {
                renderActiveBetsInPanel();
            }
            alert('Bets placed successfully!');
            const panel = document.getElementById('bet-slip-panel');
            if (panel && panel.classList.contains('open')) {
                panel.classList.remove('open');
            }
        }
        window.addToBetSlip = addToBetSlip;
        window.setMaxWager = setMaxWager;
        window.placeBets = placeBets;

        // Close bet slip on Escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const panel = document.getElementById('bet-slip-panel');
                if (panel && panel.classList.contains('open')) {
                    panel.classList.remove('open');
                }
            }
        });

        // Close bet slip when clicking outside the panel
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('bet-slip-panel');
            if (panel && panel.classList.contains('open')) {
                const toggleBtn = document.querySelector('.bs-toggle');
                if (!panel.contains(e.target) && (!toggleBtn || !toggleBtn.contains(e.target)) && !e.target.closest('.clickable')) {
                    panel.classList.remove('open');
                }
            }
        });

        // ── My Bets Modal Logic ───────────────────────────────────────────
        let activeWagerGame = null;

        // NOTE: this used to force-inject two hardcoded demo wagers (a Red Sox/
        // Dodgers total and a Thunder spread) into your real bet ledger every
        // time it ran — which is why they kept reappearing even after being
        // removed. That's gone; this is now a no-op kept only so the two call
        // sites below don't need to change.
        function seedWagersIfEmpty() {
            // Intentionally empty — no more fake wager injection.
        }

        function getWagersForGame(awayAbbr, awayName, homeAbbr, homeName) {
            const saved = localStorage.getItem('destiny_game_wagers');
            if (!saved) return [];
            try {
                const parsed = JSON.parse(saved);
                const aAbbr = (awayAbbr || '').toLowerCase();
                const aName = (awayName || '').toLowerCase();
                const hAbbr = (homeAbbr || '').toLowerCase();
                const hName = (homeName || '').toLowerCase();
                
                return parsed.filter(w => {
                    const m = (w.matchup || '').toLowerCase();
                    const t = (w.target || '').toLowerCase();
                    if (t.includes('timberwolves') || m.includes('minnesota') || m.includes('timberwolves')) {
                        return false;
                    }
                    const matchAwayText = (aAbbr && (m.includes(aAbbr) || t.includes(aAbbr))) || (aName && (m.includes(aName) || t.includes(aName)));
                    const matchHomeText = (hAbbr && (m.includes(hAbbr) || t.includes(hAbbr))) || (hName && (m.includes(hName) || t.includes(hName)));
                    return matchAwayText && matchHomeText;
                });
            } catch(e) {
                return [];
            }
        }

        function updateAllCardBetsCounts() {
            document.querySelectorAll('.game-card').forEach(card => {
                const myBetsBtn = card.querySelector('.card-my-bets-btn');
                if (!myBetsBtn) return;
                
                const onclickStr = myBetsBtn.getAttribute('onclick') || '';
                const match = onclickStr.match(/openMyBetsModal\([^,]+,\s*'([^']+)',\s*'([^']+)',\s*'([^']+)',\s*'([^']+)'\)/);
                if (match) {
                    const [, awayAbbr, awayName, homeAbbr, homeName] = match;
                    const wagers = getWagersForGame(awayAbbr, awayName, homeAbbr, homeName);
                    const countEl = myBetsBtn.querySelector('.bets-count');
                    if (wagers.length > 0) {
                        if (countEl) {
                            countEl.innerText = wagers.length;
                        } else {
                            const newCountEl = document.createElement('span');
                            newCountEl.className = 'bets-count';
                            newCountEl.innerText = wagers.length;
                            myBetsBtn.appendChild(newCountEl);
                        }
                    } else {
                        if (countEl) countEl.remove();
                    }
                }
            });
        }

        function openMyBetsModal(gameId, awayAbbr, awayName, homeAbbr, homeName) {
            seedWagersIfEmpty();
            activeWagerGame = { gameId, awayAbbr, awayName, homeAbbr, homeName };
            
            const overlay = document.getElementById('my-bets-modal-overlay');
            const titleEl = document.getElementById('mb-game-title');
            
            titleEl.innerText = `${awayAbbr} @ ${homeAbbr}`;
            
            const targetSelect = document.getElementById('mb-form-target');
            targetSelect.innerHTML = `
                <option value="${awayName}">${awayName} (${awayAbbr})</option>
                <option value="${homeName}">${homeName} (${homeAbbr})</option>
            `;
            
            renderWagersInModal();
            overlay.classList.add('open');
        }

        function closeMyBetsModal() {
            const overlay = document.getElementById('my-bets-modal-overlay');
            overlay.classList.remove('open');
            activeWagerGame = null;
        }

        function getImpliedProbability(americanOdds) {
            const odds = parseInt(americanOdds);
            if (isNaN(odds)) return 0.50;
            if (odds > 0) return 100 / (odds + 100);
            const abs = Math.abs(odds);
            return abs / (abs + 100);
        }

        function calculateCLV(placedOdds, currentOdds) {
            const probPlaced = getImpliedProbability(placedOdds);
            const probCurrent = getImpliedProbability(currentOdds);
            if (probPlaced === 0) return 0;
            return (probCurrent / probPlaced) - 1;
        }

        function getLiveWagerMetrics(w) {
            // Real numbers only, derived from the wager's own stored data —
            // no hardcoded placeholder odds/equity. "Live" odds falls back
            // to placed odds when nothing more current is stored; equity is
            // a real mark-to-market estimate (stake x current decimal odds),
            // not a fabricated figure.
            const liveOddsStr = w.currentOdds || w.placedOdds || 'N/A';
            const liveCents = liveOddsStr !== 'N/A' ? Math.round(getImpliedProbability(liveOddsStr) * 100) : null;

            const clvVal = calculateCLV(w.placedOdds || liveOddsStr, w.currentOdds || liveOddsStr);
            const clvSign = clvVal >= 0 ? '+' : '';
            const clvPct = clvSign + (clvVal * 100).toFixed(1) + '% CLV';

            const wagerAmt = parseFloat(w.wager || w.stake || 0);
            const equityVal = liveOddsStr !== 'N/A' ? wagerAmt * americanToDecimal(liveOddsStr) : wagerAmt;
            const equityPctVal = wagerAmt > 0 ? ((equityVal / wagerAmt - 1) * 100) : 0;
            const equitySign = equityPctVal >= 0 ? '+' : '';
            const equityStr = `$${equityVal.toFixed(2)} Equity (${equitySign}${equityPctVal.toFixed(0)}%)`;

            return {
                liveOdds: liveOddsStr,
                cents: liveCents,
                clv: clvPct,
                equity: equityStr
            };
        }

        function renderWagersInModal() {
            if (!activeWagerGame) return;
            const listEl = document.getElementById('mb-wagers-list');
            const wagers = getWagersForGame(activeWagerGame.awayAbbr, activeWagerGame.awayName, activeWagerGame.homeAbbr, activeWagerGame.homeName);
            
            if (wagers.length === 0) {
                listEl.innerHTML = '<div class="mb-empty-state">No wagers registered for this matchup. Add one below to track it live!</div>';
                return;
            }
            
            listEl.innerHTML = wagers.map(w => {
                const metrics = getLiveWagerMetrics(w, activeWagerGame.awayAbbr, activeWagerGame.homeAbbr);
                const wagerAmt = parseFloat(w.wager || w.stake || 0).toFixed(2);
                const toWinAmt = parseFloat(w.toWin || 0).toFixed(2);
                const placedOddsStr = w.placedOdds || w.odds || '-155';

                return `
                <div class="mb-wager-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <span class="mb-wager-team">${w.target || w.matchup}</span>
                        <span class="mb-wager-badge">ACTIVE TRACK</span>
                    </div>
                    
                    <div class="mb-wager-details">
                        <div class="mb-wager-row">
                            <span class="mb-wager-label">Bet Selection:</span>
                            <span class="mb-wager-val">${w.type || 'Total'} (${w.detail || placedOddsStr})</span>
                        </div>
                        <div class="mb-wager-row">
                            <span class="mb-wager-label">Placed Line & Stake:</span>
                            <span class="mb-wager-val">${placedOddsStr} / $${wagerAmt}</span>
                        </div>
                        <div class="mb-wager-row">
                            <span class="mb-wager-label">Live Market Odds:</span>
                            <span class="mb-wager-val" style="color:#06B6D4; font-weight:bold;">${metrics.liveOdds}${metrics.cents !== null ? ` (${metrics.cents}\u00a2 implied)` : ''}</span>
                        </div>
                        <div class="mb-wager-row">
                            <span class="mb-wager-label">Closing Line Value (CLV):</span>
                            <span class="mb-wager-val" style="color:var(--win); font-weight:bold;">${metrics.clv}</span>
                        </div>
                        <div class="mb-wager-row">
                            <span class="mb-wager-label">To Win / Live Equity:</span>
                            <span class="mb-wager-val" style="color:var(--win); font-weight:bold;">$${toWinAmt} (${metrics.equity})</span>
                        </div>
                    </div>
                    
                    <div style="display:flex; justify-content:flex-end; border-top:1px solid rgba(255,255,255,0.06); padding-top:8px; margin-top:4px;">
                        <button class="mb-wager-delete-btn" style="position:static;" onclick="deleteWagerFromModal('${w.id}')">🗑 Delete Track</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        function handleModalQuickAdd(e) {
            e.preventDefault();
            if (!activeWagerGame) return;
            
            const target = document.getElementById('mb-form-target').value;
            const type = document.getElementById('mb-form-type').value;
            const detail = document.getElementById('mb-form-detail').value.trim() || 'ML';
            const wager = parseFloat(document.getElementById('mb-form-wager').value) || 0;
            const toWin = parseFloat(document.getElementById('mb-form-towin').value) || 0;
            
            if (wager <= 0 || toWin <= 0) {
                alert('Please enter valid wager and to-win amounts.');
                return;
            }
            
            const KEY = 'destiny_game_wagers';
            let wagers = [];
            try { wagers = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { wagers = []; }
            
            wagers.push({
                id: 'track-' + Date.now(),
                matchup: `${activeWagerGame.awayName} @ ${activeWagerGame.homeName}`,
                target: target,
                type: type,
                detail: detail,
                wager: wager,
                toWin: toWin
            });
            
            localStorage.setItem(KEY, JSON.stringify(wagers));
            
            document.getElementById('mb-form-detail').value = '';
            document.getElementById('mb-form-wager').value = '';
            document.getElementById('mb-form-towin').value = '';
            
            renderWagersInModal();
            updateAllCardBetsCounts();
            updateActiveBetsCountGlobal();
            if (activeBsTab === 'active') {
                renderActiveBetsInPanel();
            }
        }

        function deleteWagerFromModal(id) {
            const KEY = 'destiny_game_wagers';
            let wagers = [];
            try { wagers = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { wagers = []; }
            wagers = wagers.filter(w => w.id !== id);
            localStorage.setItem(KEY, JSON.stringify(wagers));
            
            renderWagersInModal();
            updateAllCardBetsCounts();
            updateActiveBetsCountGlobal();
            if (activeBsTab === 'active') {
                renderActiveBetsInPanel();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            seedWagersIfEmpty();
            updateBankrollDisplay();
            renderBetSlip();
            updateActiveBetsCountGlobal();
            setTimeout(updateAllCardBetsCounts, 1200); // Allow scoreboard to load before counting wagers

            // ⚡ Live Kalshi tick listener — on every tick, re-pull each
            // card's numbers from window.DestinyLiveFeed's own (correct)
            // matching logic instead of guessing team assignment from the
            // tick payload itself. That guesswork used to compare ESPN
            // abbreviations (e.g. "JAX") against Kalshi's team labels (e.g.
            // "Jacksonville") with plain substring checks, which silently
            // fails whenever the two don't share letters in the right
            // order — flipping the away/home numbers. getKalshiOdds/
            // getKalshiBookLine already check the full team name too, so
            // reusing them here keeps this in sync with the values shown
            // when the card was first rendered.
            if (window.DestinyLiveFeed) {
                window.DestinyLiveFeed.onKalshiTick(() => {
                    document.querySelectorAll('.game-card').forEach(card => {
                        const tile = card.querySelector('.kalshi-card-tile');
                        if (!tile) return;
                        const awayAbbr = tile.dataset.away || '';
                        const homeAbbr = tile.dataset.home || '';
                        const awayName = tile.dataset.awayName || awayAbbr;
                        const homeName = tile.dataset.homeName || homeAbbr;
                        if (!awayAbbr || !homeAbbr) return;

                        const odds = window.DestinyLiveFeed.getKalshiOdds
                            ? window.DestinyLiveFeed.getKalshiOdds(awayAbbr, homeAbbr, awayName, homeName)
                            : null;
                        if (!odds) return;

                        const probLeft = tile.querySelector('.bw-prob-bar-left');
                        const probRight = tile.querySelector('.bw-prob-bar-right');
                        const valLeft = tile.querySelector('.bw-prob-val-left');
                        const valRight = tile.querySelector('.bw-prob-val-right');
                        if (probLeft && probRight && valLeft && valRight) {
                            probLeft.style.width = odds.awayCents + '%';
                            probRight.style.width = odds.homeCents + '%';
                            valLeft.innerText = `${odds.awayCents}% ${awayAbbr} (${odds.awayAmerican})`;
                            valRight.innerText = `${odds.homeCents}% ${homeAbbr}`;
                        }

                        const boxes = tile.querySelectorAll('.kalshi-odds-box');
                        if (boxes.length >= 2) {
                            const awayCentsEl = boxes[0].querySelector('.kalshi-cents-val');
                            const awayAmEl = boxes[0].querySelector('.kalshi-american-val');
                            const homeCentsEl = boxes[1].querySelector('.kalshi-cents-val');
                            const homeAmEl = boxes[1].querySelector('.kalshi-american-val');
                            if (awayCentsEl) awayCentsEl.innerText = `${odds.awayCents}¢`;
                            if (awayAmEl) awayAmEl.innerText = odds.awayAmerican;
                            if (homeCentsEl) homeCentsEl.innerText = `${odds.homeCents}¢`;
                            if (homeAmEl) homeAmEl.innerText = odds.homeAmerican;
                        }
                    });
                });
            }
        });
    </script>
    <script src="nav.js"></script>
</body>

</html>
