<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny — Sports Command Center</title>
    <script src="live-feed.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c0f;
            --surface: #111418;
            --surface2: #181c22;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.13);
            --text: #e8eaed;
            --muted: #6b7280;
            --accent: #f59e0b;
            --accent2: #3b82f6;
            --live: #ef4444;
            --win: #10b981;
            --font-head: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            border-bottom: 1px solid var(--border2);
            background: var(--surface);
        }

        .logo {
            font-family: var(--font-head);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--text);
            opacity: 0.4;
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #clock {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .refresh-btn {
            background: none;
            border: 1px solid var(--border2);
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .refresh-select {
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            outline: none;
        }

        .refresh-select:hover {
            border-color: var(--accent);
        }

        .league-tabs {
            display: flex;
            gap: 2px;
            padding: 16px 28px 0;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            background: var(--surface);
        }

        .tab {
            font-family: var(--font-head);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 20px;
            border: none;
            background: none;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--live);
            border-radius: 50%;
            margin-left: 6px;
            animation: pulse 1.4s infinite;
            vertical-align: middle;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .main {
            padding: 24px 28px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .league-panel {
            display: none;
        }

        .league-panel.active {
            display: block;
        }

        .league-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 20px;
        }

        .league-title {
            font-family: var(--font-head);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text);
        }

        .league-date {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
            align-items: start;
        }

        .game-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 18px;
            transition: border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            border-color: var(--border2);
        }

        .game-card.live {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .game-card.live::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--live);
        }

        .game-card.pinned {
            border-color: rgba(251, 191, 36, 0.45);
            box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.2);
        }

        .game-card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }

        .game-card.drag-over {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .card-top-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .drag-handle {
            cursor: grab;
            color: var(--muted);
            font-size: 14px;
            padding: 0 4px;
            user-select: none;
            flex-shrink: 0;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .pin-btn {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 4px;
            line-height: 1;
            color: var(--muted);
            transition: color 0.15s;
            flex-shrink: 0;
        }

        .pin-btn:hover {
            color: #FBBF24;
        }

        .pin-btn.active {
            color: #FBBF24;
        }


        .game-status {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-live {
            color: var(--live);
            font-weight: 500;
        }

        .status-sched {
            color: var(--muted);
        }

        .status-final {
            color: var(--win);
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .team-name {
            font-family: var(--font-head);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .team-record {
            font-size: 10px;
            color: var(--muted);
        }

        .team-score {
            font-family: var(--font-head);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text);
            min-width: 48px;
            text-align: right;
            flex-shrink: 0;
        }

        .team-score.winner {
            color: var(--accent);
        }

        .game-footer {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .game-info {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        .game-odds {
            font-size: 10px;
            color: var(--accent2);
            letter-spacing: 0.5px;
        }

        .no-games {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 1px;
            border: 1px dashed var(--border2);
            border-radius: 6px;
        }

        .kalshi-card-tile {
            background: rgba(15, 23, 34, 0.75);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 6px;
            padding: 10px 12px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        .kalshi-card-tile:hover {
            border-color: rgba(6, 182, 212, 0.7);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
        }
        .kalshi-tile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .kalshi-live-tag {
            font-size: 9px;
            font-weight: 800;
            color: #06B6D4;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kalshi-market-type {
            font-size: 8px;
            color: var(--muted);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }
        .kalshi-tile-rows {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .kalshi-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .kalshi-team-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .kalshi-mini-logo {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .kalshi-team-abbr {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }
        .kalshi-team-role {
            font-size: 8px;
            color: var(--muted);
            font-family: var(--font-mono);
        }
        .kalshi-odds-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.25);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .kalshi-odds-box:hover {
            background: rgba(6, 182, 212, 0.25);
            border-color: #06B6D4;
        }
        .kalshi-cents-val {
            font-size: 13px;
            font-weight: 800;
            color: #06B6D4;
        }
        .kalshi-american-val {
            font-size: 10px;
            font-weight: 700;
            color: var(--text);
            opacity: 0.85;
        }

        .no-games .icon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 2px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .error-msg {
            font-size: 10px;
            color: var(--live);
            letter-spacing: 1px;
            padding: 4px 8px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .summary-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--surface2);
            border-radius: 4px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .summary-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .summary-value {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .summary-value.live-count {
            color: var(--live);
        }

        .summary-value.sched-count {
            color: var(--accent2);
        }

        .vs-divider {
            font-size: 10px;
            color: var(--muted);
            text-align: center;
            margin: 2px 0;
        }

        /* CARD DETAILS */
        .card-details {
            display: none;
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .game-card.expanded .card-details {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sp-section {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .sp-section:last-child {
            margin-bottom: 0;
        }

        /* PREMIUM ESPN LIVE BASEBALL GAME CARD */
        .espn-game-card {
            background: linear-gradient(135deg, rgba(20, 30, 45, 0.95), rgba(10, 15, 25, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            font-family: var(--font-mono), monospace;
        }
        .egc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }
        .egc-player-card {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .egc-player-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0,0,0,0.2);
            object-fit: cover;
        }
        .egc-player-info {
            display: flex;
            flex-direction: column;
        }
        .egc-player-role {
            font-size: 8px;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .egc-player-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--fg);
        }
        .egc-player-stats {
            font-size: 10px;
            color: var(--accent2);
        }
        .egc-vs-badge {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            font-size: 9px;
            color: var(--muted);
            font-weight: 700;
            margin: 0 12px;
        }
        .egc-grid {
            display: grid;
            grid-template-columns: 1.1fr 1fr 1.1fr;
            gap: 12px;
        }
        @media (max-width: 768px) {
            .egc-grid {
                grid-template-columns: 1fr;
            }
        }
        .egc-panel-situation {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .egc-counts {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            margin-bottom: 8px;
        }
        .egc-count-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: var(--muted);
        }
        .egc-dots {
            display: flex;
            gap: 4px;
        }
        .egc-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            background: transparent;
        }
        .egc-dot.active {
            background: #E53E3E;
            border-color: #E53E3E;
            box-shadow: 0 0 6px #E53E3E;
        }
        .egc-dot.ball.active {
            background: #4A90E2;
            border-color: #4A90E2;
            box-shadow: 0 0 6px #4A90E2;
        }
        .egc-diamond {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 8px auto;
        }
        .egc-base {
            position: absolute;
            width: 13px;
            height: 13px;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.02);
            transform: rotate(45deg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .egc-base.occupied {
            background: var(--blue);
            border-color: var(--blue);
            box-shadow: 0 0 10px var(--blue);
        }
        .egc-base.first { right: 6px; top: 33px; }
        .egc-base.second { left: 33px; top: 6px; }
        .egc-base.third { left: 6px; top: 33px; }
        .egc-base.home {
            left: 33px;
            bottom: 6px;
            border: 1.5px solid rgba(255,255,255,0.1);
            background: rgba(255, 255, 255, 0.05);
        }
        .egc-panel-heatmap {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.03);
            position: relative;
        }
        .egc-heatmap-grid {
            display: grid;
            grid-template-columns: repeat(3, 24px);
            grid-template-rows: repeat(3, 24px);
            gap: 2px;
        }
        .egc-heat-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 700;
            color: #fff;
            border-radius: 2px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .egc-heat-cell.hot { background: rgba(229, 62, 62, 0.85); border: 1px solid rgba(229, 62, 62, 0.3); }
        .egc-heat-cell.neutral { background: rgba(74, 144, 226, 0.65); border: 1px solid rgba(74, 144, 226, 0.3); }
        .egc-heat-cell.cold { background: rgba(45, 142, 255, 0.85); border: 1px solid rgba(45, 142, 255, 0.3); }

        .egc-panel-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.03);
            font-size: 10px;
            justify-content: center;
        }
        .egc-info-title {
            font-size: 8px;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .egc-info-text {
            color: var(--fg);
            line-height: 1.4;
        }

        .sp-section-title {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .sp-play {
            font-size: 11px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            line-height: 1.4;
        }

        .sp-play:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .sp-play-time {
            color: var(--accent2);
            font-size: 9px;
            margin-right: 6px;
        }

        .sp-stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px dashed var(--border);
        }

        .sp-stat-row:last-child {
            border-bottom: none;
        }

        .sp-stat-label {
            color: var(--muted);
            font-size: 11px;
        }

        .sp-leader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .sp-leader-name {
            font-size: 12px;
            font-weight: 500;
        }

        .sp-leader-val {
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .sp-team-col {
            flex: 1;
        }

        .sp-team-col:first-child {
            border-right: 1px solid var(--border);
            padding-right: 8px;
        }

        .sp-team-col:last-child {
            padding-left: 8px;
        }

        .sp-leaders-grid {
            display: flex;
            gap: 8px;
        }

        .sp-boxscore-wrapper {
            overflow-x: auto;
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            scrollbar-width: thin;
        }

        .sp-boxscore-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: right;
        }

        .sp-boxscore-table th {
            font-family: var(--font-head);
            font-weight: 700;
            color: var(--muted);
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
            white-space: nowrap;
        }

        .sp-boxscore-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border2);
            white-space: nowrap;
        }

        .sp-boxscore-table tr:last-child td {
            border-bottom: none;
        }

        .sp-boxscore-table th.col-player,
        .sp-boxscore-table td.col-player {
            text-align: left;
            position: sticky;
            left: 0;
            background: var(--surface2);
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .sp-boxscore-table td.col-player {
            font-weight: 500;
            color: var(--text);
        }

        .sp-boxscore-table tr.totals-row td {
            font-weight: 700;
            color: var(--accent);
            background: rgba(255, 255, 255, 0.03);
            border-top: 2px solid var(--border);
        }

        .dnp-text {
            color: var(--muted);
            font-size: 10px;

            'nba': 'basketball_nba',
            'mlb': 'baseball_mlb',
            'nhl': 'icehockey_nhl',
            'ncaaf': 'americanfootball_ncaaf',
            'nfl': 'americanfootball_nfl',
            'wnba': 'basketball_wnba'
        };

        let globalMaxUsed = parseInt(localStorage.getItem('espn_api_usage')) || null;
        let globalRemaining = null;
        let lastRefreshCost = 0;

        async function fetchPaidOdds(lg) {
            const oddsSport = ODDS_SPORT_MAP[lg.id];
            if (!oddsSport) return [];

            console.log(`[Odds API] Fetching ${lg.id} from network due to score/status change.`);

            const url = `/api/odds?path=${oddsSport}/odds&regions=us&markets=h2h,spreads,totals&oddsFormat=american&eventStatus=pre,in`;
            try {
                const res = await fetch(url, { cache: 'no-store' });

                // Read Odds API usage from headers
                const rem = parseInt(res.headers.get('x-requests-remaining'));
                const used = parseInt(res.headers.get('x-requests-used'));
                if (!isNaN(rem) && !isNaN(used)) {
                    globalRemaining = rem;
                    if (globalMaxUsed === null || used > globalMaxUsed) {
                        globalMaxUsed = used;
                    }
                }

                if (!res.ok) return paidOddsCache[lg.id] || [];
                return await res.json();
            } catch (e) {
                console.error("Odds API Error:", e);
                return paidOddsCache[lg.id] || [];
            }
        }

        function clockTick() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) +
                '  ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            const badge = document.getElementById('today-date-badge');
            if (badge) {
                badge.textContent = '📅 TODAY: ' + now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
            }
        }
        setInterval(clockTick, 1000);
        clockTick();

        function todayAndTomorrowStr() {
            const d1 = new Date();
            const d2 = new Date(Date.now() + 86400000);
            const fmt = d => d.getFullYear().toString() +
                String(d.getMonth() + 1).padStart(2, '0') +
                String(d.getDate()).padStart(2, '0');
            return `${fmt(d1)}-${fmt(d2)}`;
        }

        async function fetchLeague(lg) {
            const url = `https://site.api.espn.com/apis/site/v2/sports/${lg.sport}/${lg.league}/scoreboard?dates=${todayAndTomorrowStr()}&limit=50`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                return { ok: true, events: data.events || [], leagues: data.leagues || [] };
            } catch (e) {
                return { ok: false, error: e.message, events: [] };
            }
        }

        function gameStatus(event) {
            const s = event.status?.type;
            if (!s) return { label: 'SCHEDULED', cls: 'status-sched', isLive: false, isFinal: false };
            if (s.completed) {
                const finalLabel = s.shortDetail && s.shortDetail.toUpperCase().includes('OT') ? s.shortDetail.toUpperCase() : 'FINAL';
                return { label: finalLabel, cls: 'status-final', isLive: false, isFinal: true };
            }
            if (s.state === 'in' || s.description === 'In Progress' || s.description === 'Halftime' || s.description === 'End of Period' || (s.shortDetail && s.shortDetail.toLowerCase().includes('half'))) {
                let label = 'LIVE';
                if (s.description === 'Halftime' || (s.shortDetail && s.shortDetail.toLowerCase().includes('half'))) {
                    label = 'HALFTIME';
                } else if (s.description === 'End of Period') {
                    label = `END Q${event.status.period || ''}`;
                } else if (event.status?.displayClock) {
                    label = `${event.status.displayClock} — ${event.status.period ? 'Q' + event.status.period : ''}`;
                }
                return { label: label, cls: 'status-live', isLive: true, isFinal: false };
            }
            const d = event.date ? new Date(event.date) : null;
            const timeStr = d ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : s.description;
            return { label: timeStr, cls: 'status-sched', isLive: false, isFinal: false };
        }

        // ── Card pin & drag state ──────────────────────────────────────────
        const espnPinned = new Set(JSON.parse(localStorage.getItem('espn_pinned') || '[]'));
        const espnDragOrder = JSON.parse(localStorage.getItem('espn_drag_order') || '{}'); // { tabKey: [id,...] }
        let _espnDragSrc = null;

        function saveEspnPins() { localStorage.setItem('espn_pinned', JSON.stringify([...espnPinned])); }
        function saveEspnOrder(tabKey, ids) {
            espnDragOrder[tabKey] = ids;
            localStorage.setItem('espn_drag_order', JSON.stringify(espnDragOrder));
        }

        function toggleEspnPin(id, btn) {
            if (espnPinned.has(id)) { espnPinned.delete(id); btn.classList.remove('active'); btn.title = 'Pin'; }
            else { espnPinned.add(id); btn.classList.add('active'); btn.title = 'Unpin'; }
            saveEspnPins();
            
            // Toggle pinned class on all card instances across panels!
            const cards = document.querySelectorAll(`[id$="-${id}"]`);
            cards.forEach(card => {
                if (card.id.startsWith('card-')) {
                    card.classList.toggle('pinned', espnPinned.has(id));
                    const pinBtn = card.querySelector('.pin-btn');
                    if (pinBtn) {
                        pinBtn.classList.toggle('active', espnPinned.has(id));
                        pinBtn.title = espnPinned.has(id) ? 'Unpin' : 'Pin';
                    }
                    const grid = card.closest('.games-grid');
                    if (grid) _resortGrid(grid);
                }
            });
        }

        function _resortGrid(grid) {
            const cards = Array.from(grid.querySelectorAll('.game-card'));
            const pinned = cards.filter(c => espnPinned.has(c.dataset.eid));
            const rest = cards.filter(c => !espnPinned.has(c.dataset.eid));
            [...pinned, ...rest].forEach(c => grid.appendChild(c));
        }

        function _onEspnDragStart(e, id, panelType) {
            _espnDragSrc = { id, panelType };
            e.dataTransfer.effectAllowed = 'move';
            document.getElementById(`card-${panelType}-${id}`)?.classList.add('dragging');
        }
        function _onEspnDragEnd(id, panelType) {
            document.getElementById(`card-${panelType}-${id}`)?.classList.remove('dragging');
            document.querySelectorAll('.game-card.drag-over').forEach(c => c.classList.remove('drag-over'));
            _espnDragSrc = null;
        }
        function _onEspnDragOver(e, id, panelType) {
            e.preventDefault();
            if (_espnDragSrc && (_espnDragSrc.id !== id || _espnDragSrc.panelType !== panelType)) {
                document.querySelectorAll('.game-card.drag-over').forEach(c => c.classList.remove('drag-over'));
                document.getElementById(`card-${panelType}-${id}`)?.classList.add('drag-over');
            }
        }
        function _onEspnDrop(e, id, tabKey, panelType) {
            e.preventDefault();
            document.getElementById(`card-${panelType}-${id}`)?.classList.remove('drag-over');
            if (!_espnDragSrc || _espnDragSrc.id === id || _espnDragSrc.panelType !== panelType) return;
            const src = document.getElementById(`card-${panelType}-${_espnDragSrc.id}`);
            const tgt = document.getElementById(`card-${panelType}-${id}`);
            if (!src || !tgt || src.parentElement !== tgt.parentElement) return;
            const grid = src.parentElement;
            const cards = Array.from(grid.querySelectorAll('.game-card'));
            const si = cards.indexOf(src), ti = cards.indexOf(tgt);
            if (si < ti) grid.insertBefore(src, tgt.nextSibling);
            else grid.insertBefore(src, tgt);
            const newOrder = Array.from(grid.querySelectorAll('.game-card')).map(c => c.dataset.eid);
            saveEspnOrder(tabKey, newOrder);
        }

        function renderFootballGraphic(sit, away, home, statusLabel) {
            if (!sit) return '';

            const awayColor = away.team?.color ? '#' + away.team.color : '#004C54';
            const homeColor = home.team?.color ? '#' + home.team.color : '#241773';
            
            const awayAbbr = away.team?.abbreviation || 'AWAY';
            const homeAbbr = home.team?.abbreviation || 'HOME';

            const awayLogo = away.team?.logo || away.team?.logos?.[0]?.href || '';
            const homeLogo = home.team?.logo || home.team?.logos?.[0]?.href || '';

            const possessionId = String(sit.possession || sit.possessionText || sit.lastPlay?.team?.id || '');
            const isAwayPossession = possessionId === String(away.team?.id || away.id || '') || possessionId.toUpperCase().includes(awayAbbr);
            const isHomePossession = possessionId === String(home.team?.id || home.id || '') || possessionId.toUpperCase().includes(homeAbbr);

            const down = parseInt(sit.down);
            const dist = parseInt(sit.distance || 0);
            const isInvalidDown = isNaN(down) || down <= 0;

            let rawYardLine = parseInt(sit.yardLine || 50);
            if (isNaN(rawYardLine) || rawYardLine < 1) rawYardLine = 50;

            const posText = String(sit.possessionText || '');
            let ballPosPct = 50;

            if (isAwayPossession) {
                // Away team (PHI) drives RIGHT towards Home (BAL)
                if (posText.includes(awayAbbr)) {
                    ballPosPct = rawYardLine; // e.g. PHI 34 = 34% (own territory)
                } else if (posText.includes(homeAbbr)) {
                    ballPosPct = 100 - rawYardLine; // e.g. BAL 34 = 66% (opponent territory)
                } else {
                    ballPosPct = rawYardLine;
                }
            } else if (isHomePossession) {
                // Home team (BAL) drives LEFT towards Away (PHI)
                if (posText.includes(homeAbbr)) {
                    ballPosPct = 100 - rawYardLine; // e.g. BAL 34 = 66% (own territory)
                } else if (posText.includes(awayAbbr)) {
                    ballPosPct = rawYardLine; // e.g. PHI 34 = 34% (opponent territory)
                } else {
                    ballPosPct = 100 - rawYardLine;
                }
            } else {
                ballPosPct = rawYardLine;
            }
            ballPosPct = Math.max(3, Math.min(97, ballPosPct));

            let firstDownPct = isAwayPossession ? (ballPosPct + dist) : (ballPosPct - dist);
            firstDownPct = Math.max(2, Math.min(98, firstDownPct));

            let downText = sit.downDistanceText;
            if (!downText) {
                if (!isInvalidDown) {
                    const ord = down === 1 ? '1st' : down === 2 ? '2nd' : down === 3 ? '3rd' : '4th';
                    const distStr = dist === 0 ? 'Goal' : dist;
                    const posStr = posText || (isAwayPossession ? `${awayAbbr} ${rawYardLine}` : `${homeAbbr} ${rawYardLine}`);
                    downText = `${ord} & ${distStr}, ${posStr}`;
                } else {
                    downText = sit.lastPlay?.text || sit.lastPlay?.type?.text || 'Timeout / Game Break';
                }
            }

            const driveLength = Math.min(20, isAwayPossession ? ballPosPct : (100 - ballPosPct));
            const arrowStartPct = isAwayPossession ? (ballPosPct - driveLength) : (ballPosPct + driveLength);
            const showArrow = !isInvalidDown && dist > 0 && (isAwayPossession || isHomePossession);

            return `
            <div class="football-possession-card" style="background:#111923; border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:12px 16px; margin:10px 0; font-family:var(--font-mono);" onclick="event.stopPropagation()">
                <!-- Top Situation Header -->
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        ${awayLogo ? `<img src="${awayLogo}" style="width:26px; height:26px; object-fit:contain;">` : ''}
                        ${isAwayPossession ? '<span style="font-size:14px; filter:drop-shadow(0 0 4px #06B6D4);" title="Possession">🏈</span>' : ''}
                    </div>
                    
                    <div style="text-align:center; flex:1; padding:0 8px; overflow:hidden;">
                        <div style="font-size:13px; font-weight:800; color:#FFFFFF; letter-spacing:0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${downText}</div>
                        <div style="font-size:11px; color:var(--muted); margin-top:2px;">${statusLabel}</div>
                    </div>

                    <div style="display:flex; align-items:center; gap:8px;">
                        ${isHomePossession ? '<span style="font-size:14px; filter:drop-shadow(0 0 4px #06B6D4);" title="Possession">🏈</span>' : ''}
                        ${homeLogo ? `<img src="${homeLogo}" style="width:26px; height:26px; object-fit:contain;">` : ''}
                    </div>
                </div>

                <!-- 3D Field Bar Graphic -->
                <div style="position:relative; width:100%; height:34px; background:#1C242F; border-radius:4px; overflow:hidden; border:1px solid rgba(255,255,255,0.12); display:flex; box-shadow:inset 0 2px 6px rgba(0,0,0,0.6);">
                    <!-- Left Endzone -->
                    <div style="width:10%; height:100%; background:${awayColor}; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#fff; letter-spacing:1px; flex-shrink:0;">${awayAbbr}</div>
                    
                    <!-- Field Surface (80%) -->
                    <div style="position:relative; width:80%; height:100%; background:linear-gradient(180deg, #18222C 0%, #121A22 100%);">
                        <!-- 10-Yard Gridlines -->
                        <div style="position:absolute; inset:0; display:flex; justify-content:space-between; opacity:0.12; pointer-events:none;">
                            <div style="border-right:1px solid #fff; flex:1;"></div>
                            <div style="border-right:1px solid #fff; flex:1;"></div>
                            <div style="border-right:1px solid #fff; flex:1;"></div>
                            <div style="border-right:1px solid #fff; flex:1;"></div>
                            <div style="border-right:1px solid #fff; flex:1;"></div>
                            <div style="border-right:1px solid #fff; flex:1;"></div>
                            <div style="border-right:1px solid #fff; flex:1;"></div>
                            <div style="border-right:1px solid #fff; flex:1;"></div>
                        </div>

                        ${!isInvalidDown && dist > 0 ? `<div style="position:absolute; top:0; bottom:0; left:${firstDownPct}%; width:2px; background:#F59E0B; z-index:2; box-shadow:0 0 6px #F59E0B;" title="First Down Target Line"></div>` : ''}

                        <!-- Line of Scrimmage Line (White Line) -->
                        <div style="position:absolute; top:0; bottom:0; left:${ballPosPct}%; width:2px; background:#FFFFFF; z-index:3; box-shadow:0 0 8px #FFFFFF;" title="Line of Scrimmage"></div>

                        <!-- Drive Direction Arrow -->
                        ${showArrow ? `
                        <div style="position:absolute; top:50%; transform:translateY(-50%); ${isAwayPossession ? `left:${arrowStartPct}%; width:${ballPosPct - arrowStartPct}%;` : `left:${ballPosPct}%; width:${arrowStartPct - ballPosPct}%;`} height:2px; background:rgba(255,255,255,0.75); pointer-events:none; z-index:1;">
                            <div style="position:absolute; ${isAwayPossession ? 'right:-2px' : 'left:-2px'}; top:-3px; border-top:4px solid transparent; border-bottom:4px solid transparent; ${isAwayPossession ? 'border-left:7px solid #FFFFFF' : 'border-right:7px solid #FFFFFF'};"></div>
                        </div>` : ''}
                    </div>

                    <!-- Right Endzone -->
                    <div style="width:10%; height:100%; background:${homeColor}; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#fff; letter-spacing:1px; flex-shrink:0;">${homeAbbr}</div>
                </div>

                <!-- Yard Labels Below -->
                <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--muted); margin-top:5px; padding:0 2px;">
                    <span>${awayAbbr}</span>
                    <span>10</span>
                    <span>20</span>
                    <span>30</span>
                    <span>40</span>
                    <span>50</span>
                    <span>40</span>
                    <span>30</span>
                    <span>20</span>
                    <span>10</span>
                    <span>${homeAbbr}</span>
                </div>
            </div>
            `;
        }
        window.renderFootballGraphic = renderFootballGraphic;

        function getAthleteHeadshot(ath, playerId) {

                if (typeof ath.headshot === 'string' && ath.headshot.startsWith('http')) return ath.headshot;
                if (ath.headshot && typeof ath.headshot === 'object' && ath.headshot.href) return ath.headshot.href;
                if (ath.headshot?.href) return ath.headshot.href;

            const pid = playerId || ath?.id || ath?.playerId;
            if (pid) {
                return `https://a.espncdn.com/i/headshots/mlb/players/full/${pid}.png`;
            }
            return 'https://a.espncdn.com/i/headshots/placeholder.png';

            let batImg = getAthleteHeadshot(batAth, batId);

            return `

        }
        function getLeagueLogo(leagueStr, sportStr) {
            const l = String(leagueStr || '').toLowerCase();
            const s = String(sportStr || '').toLowerCase();

            if (l.includes('nfl') || s === 'nfl') return 'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png';
            if (l.includes('mlb') || s === 'mlb' || s === 'baseball') return 'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png';
            if (l.includes('nba') || s === 'nba') return 'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png';
            if (l.includes('nhl') || s === 'nhl' || s === 'hockey') return 'https://a.espncdn.com/i/teamlogos/leagues/500/nhl.png';
            if (l.includes('wnba') || s === 'wnba') return 'https://a.espncdn.com/i/teamlogos/leagues/500/wnba.png';
            if (l.includes('college') || l.includes('ncaa') || l.includes('cfb') || l.includes('cbk')) return 'https://a.espncdn.com/i/espn/misc_logos/500/ncaa.png';
            
            if (s === 'football') return 'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png';
            if (s === 'basketball') return 'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png';

            return 'https://a.espncdn.com/i/espn/misc_logos/500/ncaa.png';
        }
        window.getLeagueLogo = getLeagueLogo;

        function renderCard(event, lg, panelType) {
            const comp = event.competitions?.[0];
            if (!comp) return '';
            const competitors = comp.competitors || [];
            const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
            const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
            if (!home || !away) return '';

            const status = gameStatus(event);
            const homeScore = parseInt(home.score || 0);
            const awayScore = parseInt(away.score || 0);
            const homeWin = status.isFinal && homeScore > awayScore;
            const awayWin = status.isFinal && awayScore > homeScore;

            const oddsObj = comp.odds?.find(o => o.details || (o.awayTeamOdds && o.homeTeamOdds) || o.moneyLine || o.spread) || comp.odds?.[0];
            if (oddsObj) {
                oddsCache[event.id] = oddsObj;
            }
            const odds = oddsObj || oddsCache[event.id];
            const oddsStr = odds ? `${odds.details || ''} · O/U ${odds.overUnder || ''}` : '';

            const venue = comp.venue?.fullName || '';
            const broadcast = comp.broadcasts?.[0]?.names?.[0] || '';

            const homeRecord = home.records?.[0]?.summary || '';
            const awayRecord = away.records?.[0]?.summary || '';

            const awayLogo = away.team?.logo || '';
            const homeLogo = home.team?.logo || '';

            const awayAbbr = away.team?.abbreviation || '';
            const homeAbbr = home.team?.abbreviation || '';
            const awayName = away.team?.displayName || away.team?.name || awayAbbr;
            const homeName = home.team?.displayName || home.team?.name || homeAbbr;

            const sit = comp.situation;
            let sportGraphicHtml = '';
            if (status.isLive && sit) {
                if (lg.sport === 'football' || sit.down !== undefined || sit.possessionText) {
                    sportGraphicHtml = renderFootballGraphic(sit, away, home, status.label);
                } else if (lg.sport === 'baseball' || sit.batter !== undefined || sit.outs !== undefined) {
                    sportGraphicHtml = renderBaseballGraphic(sit, away, home, status.label);
                }
            }

            let bettingWidgetHtml = '';

            // ── Merged Kalshi widget: Spread / Moneyline / Total / Win% ───────
            // One combined table instead of two separate boxes. Sourced
            // ENTIRELY from Kalshi's free markets via DestinyLiveFeed
            // (api/kalshi.js -> live-feed.js). No paid odds API, no
            // fabricated numbers — if Kalshi doesn't have real pricing for
            // this game yet, we show a clean "ODDS N/A" row instead of
            // guessing.
            const kalshiML = (window.DestinyLiveFeed && window.DestinyLiveFeed.getKalshiOdds)
                ? window.DestinyLiveFeed.getKalshiOdds(awayAbbr, homeAbbr, awayName, homeName)
                : null;
            const kalshiBook = (window.DestinyLiveFeed && window.DestinyLiveFeed.getKalshiBookLine)
                ? window.DestinyLiveFeed.getKalshiBookLine(awayAbbr, homeAbbr, awayName, homeName)
                : null;

            const spreadObj = kalshiBook && kalshiBook.spread;
            const totalObj = kalshiBook && kalshiBook.total;

            const liveAwayMargin = awayScore - homeScore;
            const liveTotalPoints = awayScore + homeScore;

            // 1) Cover Margin Calculation vs Live Line
            let coverMarginText = '';
            let coverMarginColor = '#06B6D4';
            if (spreadObj && (spreadObj.awayLine !== undefined && spreadObj.awayLine !== null)) {
                const awaySp = parseFloat(spreadObj.awayLine);
                const effectiveMargin = liveAwayMargin + awaySp;
                if (effectiveMargin > 0) {
                    coverMarginText = `${awayAbbr} COVERING BY +${effectiveMargin.toFixed(1)}`;
                    coverMarginColor = '#10B981';
                } else if (effectiveMargin < 0) {
                    coverMarginText = `${homeAbbr} COVERING BY +${Math.abs(effectiveMargin).toFixed(1)}`;
                    coverMarginColor = '#38BDF8';
                } else {
                    coverMarginText = `PUSH ON ${awaySp > 0 ? '+' : ''}${awaySp} LINE`;
                    coverMarginColor = '#F59E0B';
                }
            } else {
                coverMarginText = liveAwayMargin > 0 ? `${awayAbbr} +${liveAwayMargin} LEAD` : (liveAwayMargin < 0 ? `${homeAbbr} +${Math.abs(liveAwayMargin)} LEAD` : 'TIED');
            }

            // 2) Total Line Pace Calculation vs Live Line
            let totalPaceText = '';
            let totalPaceColor = '#F59E0B';
            if (totalObj && (totalObj.line !== undefined && totalObj.line !== null)) {
                const targetTotal = parseFloat(totalObj.line);
                const ptsNeeded = targetTotal - liveTotalPoints;
                if (ptsNeeded > 0) {
                    totalPaceText = `${ptsNeeded.toFixed(1)} PTS TO OVER ${targetTotal}`;
                    totalPaceColor = '#F59E0B';
                } else if (ptsNeeded < 0) {
                    totalPaceText = `OVER BY +${Math.abs(ptsNeeded).toFixed(1)} PTS`;
                    totalPaceColor = '#10B981';
                } else {
                    totalPaceText = `EXACT ON ${targetTotal}`;
                    totalPaceColor = '#38BDF8';
                }
            } else {
                totalPaceText = `${liveTotalPoints} PTS SCORED`;
            }

            if (kalshiML || kalshiBook) {
                const spread = kalshiBook && kalshiBook.spread;
                const total = kalshiBook && kalshiBook.total;

                const spreadCell = (line, american) => (line !== undefined && line !== null)

                bettingWidgetHtml = `
                <div class="betting-widget" onclick="event.stopPropagation()">

                    <div class="bw-row">
                        <span class="bw-team" style="display:flex; align-items:center; gap:8px;">

                            <div style="display:flex; flex-direction:column; align-items:flex-start; line-height:1.2;">

                            </div>
                        </span>
                        <div class="bw-cell clickable" onclick="addToBetSlip('${(awayName || awayAbbr).replace(/'/g, "\'")}', 'Spread (Kalshi)', '${spread ? (spread.awayLine > 0 ? '+' : '') + spread.awayLine + ' ' + spread.awayAmerican : 'N/A'}')">${spreadCell(spread && spread.awayLine, spread && spread.awayAmerican)}</div>
                        <div class="bw-cell clickable" onclick="addToBetSlip('${(awayName || awayAbbr).replace(/'/g, "\'")}', 'Moneyline (Kalshi)', '${kalshiML ? kalshiML.awayAmerican : 'N/A'}')">${mlCell(kalshiML && kalshiML.awayCents, kalshiML && kalshiML.awayAmerican)}</div>
                        <div class="bw-cell clickable" onclick="addToBetSlip('${(awayName || awayAbbr).replace(/'/g, "\'")}', 'Total (Kalshi)', '${total ? 'O ' + total.line + ' ' + total.overAmerican : 'N/A'}')">${totalCell('O', total && total.line, total && total.overAmerican)}</div>
                    </div>
                    <div class="bw-row">
                        <span class="bw-team" style="display:flex; align-items:center; gap:8px;">
                            ${homeLogo ? `<img src="${homeLogo}" style="width:24px;height:24px;object-fit:contain;" onerror="this.outerHTML='<span style=font-size:10px>${homeAbbr}</span>'">` : ''}
                            <div style="display:flex; flex-direction:column; align-items:flex-start; line-height:1.2;">
                                <span style="font-size:12px; font-weight:700; color:var(--text);">${homeAbbr}</span>
                                ${homeRecord ? `<span style="font-size:9px; color:var(--muted); font-weight:normal;">${homeRecord}</span>` : ''}
                            </div>
                        </span>
                        <div class="bw-cell clickable" onclick="addToBetSlip('${(homeName || homeAbbr).replace(/'/g, "\'")}', 'Spread (Kalshi)', '${spread ? (spread.homeLine > 0 ? '+' : '') + spread.homeLine + ' ' + spread.homeAmerican : 'N/A'}')">${spreadCell(spread && spread.homeLine, spread && spread.homeAmerican)}</div>
                        <div class="bw-cell clickable" onclick="addToBetSlip('${(homeName || homeAbbr).replace(/'/g, "\'")}', 'Moneyline (Kalshi)', '${kalshiML ? kalshiML.homeAmerican : 'N/A'}')">${mlCell(kalshiML && kalshiML.homeCents, kalshiML && kalshiML.homeAmerican)}</div>
                        <div class="bw-cell clickable" onclick="addToBetSlip('${(homeName || homeAbbr).replace(/'/g, "\'")}', 'Total (Kalshi)', '${total ? 'U ' + total.line + ' ' + total.underAmerican : 'N/A'}')">${totalCell('U', total && total.line, total && total.underAmerican)}</div>
                    </div>
                    ${kalshiML ? `
                    <div class="bw-prob" style="margin-top: 4px;">
                        <span class="bw-prob-val-left">${kalshiML.awayCents}% ${awayAbbr} (${kalshiML.awayAmerican})</span>
                        <div class="bw-prob-bar-wrap">
                            <div class="bw-prob-bar-left" style="width: ${kalshiML.awayCents}%;"></div>
                            <div class="bw-prob-bar-right" style="width: ${kalshiML.homeCents}%;"></div>
                        </div>
                        <span class="bw-prob-val-right">${kalshiML.homeCents}% ${homeAbbr}</span>
                    </div>
                    <div class="bw-chart" data-ticker="${kalshiML.awayTicker || ''}" data-away="${awayAbbr}" data-home="${homeAbbr}">
                        <div class="bw-chart-loading">Loading 24h chart&hellip;</div>
                    </div>
                    ` : ''}
                </div>
                `;
            }

            // No real Kalshi pricing for this game yet — tidy N/A row, never fabricated
            if (!bettingWidgetHtml) {
                bettingWidgetHtml = `
                <div class="betting-widget" onclick="event.stopPropagation()" style="opacity:.4;">
                    <div class="bw-header">
                        <span style="font-size: 8px; color: var(--muted);">ODDS N/A</span>
                        <span>Spread</span><span>Moneyline</span><span>Total</span><span>Markets</span>
                    </div>
                    <div class="bw-row">
                        <span class="bw-team">${awayLogo ? `<img src="${awayLogo}" style="width:28px;height:28px;object-fit:contain;">` : awayAbbr}</span>
                        <div class="bw-cell"><span class="bw-val">&mdash;</span></div>
                        <div class="bw-cell"><span class="bw-val-only">&mdash;</span></div>
                        <div class="bw-cell"><span class="bw-val">&mdash;</span></div>
                        <div class="bw-cell"><span class="bw-val">&mdash;</span></div>
                    </div>
                    <div class="bw-row">
                        <span class="bw-team">${homeLogo ? `<img src="${homeLogo}" style="width:28px;height:28px;object-fit:contain;">` : homeAbbr}</span>
                        <div class="bw-cell"><span class="bw-val">&mdash;</span></div>
                        <div class="bw-cell"><span class="bw-val-only">&mdash;</span></div>
                        <div class="bw-cell"><span class="bw-val">&mdash;</span></div>
                        <div class="bw-cell"><span class="bw-val">&mdash;</span></div>
                    </div>
                </div>`;
            }

            const kalshiTileHtml = '';

            const wagersList = (() => {
                const saved = localStorage.getItem('destiny_game_wagers');
                if (!saved) return [];
                try {
                    const parsed = JSON.parse(saved);
                    const aAbbr = (awayAbbr || '').toLowerCase();
                    const aName = (awayName || '').toLowerCase();
                    const hAbbr = (homeAbbr || '').toLowerCase();
                    const hName = (homeName || '').toLowerCase();
                    return parsed.filter(w => {
                        const m = (w.matchup || '').toLowerCase();
                        const t = (w.target || '').toLowerCase();
                        const matchAwayText = (aAbbr && (m.includes(aAbbr) || t.includes(aAbbr))) || (aName && (m.includes(aName) || t.includes(aName)));
                        const matchHomeText = (hAbbr && (m.includes(hAbbr) || t.includes(hAbbr))) || (hName && (m.includes(hName) || t.includes(hName)));
                        return matchAwayText && matchHomeText;
                    });
                } catch(e) {
                    return [];
                }
            })();
            const betsCount = wagersList.length;
            const showScoreBlock = status.isLive || status.isFinal;

            return `
    <div class="game-card ${status.isLive ? 'live' : ''} ${espnPinned.has(event.id) ? 'pinned' : ''}" id="card-${panelType}-${event.id}" data-eid="${event.id}"
         draggable="true"
         ondragstart="_onEspnDragStart(event,'${event.id}','${panelType}')"
         ondragend="_onEspnDragEnd('${event.id}','${panelType}')"
         ondragover="_onEspnDragOver(event,'${event.id}','${panelType}')"
         ondrop="_onEspnDrop(event,'${event.id}','${lg.id}','${panelType}')"
         onclick="toggleGameDetails('${event.id}', '${lg.sport}', '${lg.league}', '${panelType}')">
      <div class="card-top-bar" style="display:flex; align-items:center; gap:8px;">
        <img src="${getLeagueLogo(lg.league || lg.id, lg.sport)}" class="league-logo" style="width:18px; height:18px; object-fit:contain; flex-shrink:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));" alt="${lg.league || lg.id || lg.sport}" title="${(lg.league || lg.id || lg.sport || '').toUpperCase()}" onerror="this.src='https://a.espncdn.com/i/espn/misc_logos/500/ncaa.png'">
        <span class="drag-handle" onclick="event.stopPropagation()" title="Drag to reorder">⠿</span>
        <div class="game-status" style="margin:0; display:flex; align-items:center; gap:6px; flex:1;">
          <span class="${status.cls}">${status.label}</span>
          ${status.isLive ? '<span class="live-dot"></span>' : ''}
        </div>
        <button class="card-my-bets-btn" onclick="event.stopPropagation(); openMyBetsModal('${event.id}', '${(awayAbbr || '').replace(/'/g, "\\'")}', '${(awayName || '').replace(/'/g, "\\'")}', '${(homeAbbr || '').replace(/'/g, "\\'")}', '${(homeName || '').replace(/'/g, "\\'")}')">
          My Bets ${betsCount > 0 ? `<span class="bets-count">${betsCount}</span>` : ''}
        </button>
        <button class="pin-btn ${espnPinned.has(event.id) ? 'active' : ''}" onclick="event.stopPropagation(); toggleEspnPin('${event.id}', this)" title="${espnPinned.has(event.id) ? 'Unpin' : 'Pin'}">★</button>
      </div>
      ${showScoreBlock ? `
      <div class="teams">
        <div class="team-row">
          <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
            ${awayLogo ? `<img src="${awayLogo}" class="team-logo" alt="">` : ''}
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <span class="team-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${away.team?.abbreviation || away.team?.displayName || 'AWAY'}</span>
              ${awayRecord ? `<span class="team-record" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${awayRecord}</span>` : ''}
            </div>
          </div>
          <span class="team-score ${awayWin ? 'winner' : ''}">${awayScore}</span>
        </div>
        <div class="vs-divider">@</div>
        <div class="team-row">
          <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
            ${homeLogo ? `<img src="${homeLogo}" class="team-logo" alt="">` : ''}
            <div style="display: flex; flex-direction: column; min-width: 0;">
              <span class="team-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${home.team?.abbreviation || home.team?.displayName || 'HOME'}</span>
              ${homeRecord ? `<span class="team-record" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${homeRecord}</span>` : ''}
            </div>
          </div>
          <span class="team-score ${homeWin ? 'winner' : ''}">${homeScore}</span>
        </div>
        
        <!-- Row 1: Live Margin & Combined Total Points -->
        <div class="live-calc-row" style="display:flex; align-items:center; justify-content:space-between; background:rgba(6, 182, 212, 0.08); border:1px solid rgba(6, 182, 212, 0.2); border-radius:6px; padding:6px 12px; margin-top:8px; font-family:var(--font-mono); font-size:11px;" onclick="event.stopPropagation()">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="color:var(--muted); font-size:9px; font-weight:700; letter-spacing:0.5px;">LIVE MARGIN</span>
            <span style="color:#06B6D4; font-weight:800;">${awayScore === homeScore ? 'TIED' : (awayScore > homeScore ? `${awayAbbr} +${awayScore - homeScore}` : `${homeAbbr} +${homeScore - awayScore}`)}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="color:var(--muted); font-size:9px; font-weight:700; letter-spacing:0.5px;">COMBINED TOTAL</span>
            <span style="color:#F59E0B; font-weight:800;">${liveTotalPoints} PTS</span>
          </div>
        </div>

        <!-- Row 2: Live Cover Margin & Total Pace vs Line -->
        <div class="live-calc-row-2" style="display:flex; align-items:center; justify-content:space-between; background:rgba(16, 185, 129, 0.08); border:1px solid rgba(16, 185, 129, 0.2); border-radius:6px; padding:6px 12px; margin-top:4px; font-family:var(--font-mono); font-size:11px;" onclick="event.stopPropagation()">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="color:var(--muted); font-size:9px; font-weight:700; letter-spacing:0.5px;">COVER MARGIN</span>
            <span style="color:${coverMarginColor}; font-weight:800;">${coverMarginText}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="color:var(--muted); font-size:9px; font-weight:700; letter-spacing:0.5px;">TOTAL PACE</span>
            <span style="color:${totalPaceColor}; font-weight:800;">${totalPaceText}</span>
          </div>
        </div>
      </div>
      ` : ''}
      ${sportGraphicHtml}
      ${kalshiTileHtml}
      ${bettingWidgetHtml}
      <div class="game-footer" style="${bettingWidgetHtml !== '' ? 'display: none;' : ''}">
        <span class="game-info">${[venue, broadcast].filter(Boolean).join(' · ')}</span>
        ${oddsStr ? `<span class="game-odds">${oddsStr}</span>` : ''}
      </div>
      <div class="card-details" id="details-${panelType}-${event.id}" onclick="event.stopPropagation()"></div>
    </div>
  `;
        }

        function renderPanel(lg, result) {
            let html = '';

            if (!result.ok) {
                html += `<div class="error-msg">ESPN API error — ${result.error}. Try refreshing.</div>`;
            }

            if (result.events.length === 0) {
                html += `
      <div class="no-games">
        <div class="icon">◻</div>
        No games scheduled for today
      </div>
    `;
            } else {
                const sortedEvents = [...result.events].sort((a, b) => {
                    const isPinA = espnPinned.has(a.id), isPinB = espnPinned.has(b.id);
                    if (isPinA !== isPinB) return isPinA ? -1 : 1; // pinned first
                    const statusOrder = (e) => {
                        const s = gameStatus(e);
                        if (s.isLive) return 0;
                        if (s.isFinal) return 2;
                        return 1;
                    };
                    const oa = statusOrder(a), ob = statusOrder(b);
                    if (oa !== ob) return oa - ob;
                    // Respect saved drag order within same group
                    const savedOrder = espnDragOrder[lg.id] || [];
                    const ia = savedOrder.indexOf(a.id), ib = savedOrder.indexOf(b.id);
                    if (ia >= 0 && ib >= 0) return ia - ib;
                    return new Date(a.date || 0) - new Date(b.date || 0);
                });
                html += `<div class="games-grid">${sortedEvents.map(e => renderCard(e, lg, lg.id)).join('')}</div>`;
            }

            return html;
        }

        function renderLivePanel() {
            let allLiveEvents = [];
            LEAGUES.forEach(lg => {
                if (leagueData[lg.id] && leagueData[lg.id].events) {
                    const liveEvents = leagueData[lg.id].events.filter(e => gameStatus(e).isLive);
                    liveEvents.forEach(e => {
                        allLiveEvents.push({ event: e, lg: lg });
                    });
                }
            });

            if (allLiveEvents.length === 0) {
                const loading = LEAGUES.some(lg => !leagueData[lg.id]);
                if (loading) {
                    return '<div class="loading">LOADING LIVE GAMES...</div>';
                }
                return `
      <div class="no-games">
        <div class="icon">◻</div>
        No live games at the moment
      </div>
    `;
            }

            allLiveEvents.sort((a, b) => {
                const isPinA = espnPinned.has(a.event.id), isPinB = espnPinned.has(b.event.id);
                if (isPinA !== isPinB) return isPinA ? -1 : 1;
                return new Date(a.event.date || 0) - new Date(b.event.date || 0);
            });

            return `<div class="games-grid">${allLiveEvents.map(item => renderCard(item.event, item.lg, 'live')).join('')}</div>`;
        }

        function buildTabs() {
            const tabsEl = document.getElementById('tabs');

            let totalLiveGames = 0;
            LEAGUES.forEach(lg => {
                if (leagueData[lg.id] && leagueData[lg.id].events) {
                    totalLiveGames += leagueData[lg.id].events.filter(e => gameStatus(e).isLive).length;
                }
            });

            let html = `
      <button class="tab ${activeTab === 'live' ? 'active' : ''}" onclick="switchTab('live')" style="display: inline-flex; align-items: center; gap: 8px;">
        <span style="color: var(--live);">LIVE</span>
        ${totalLiveGames > 0 ? '<span class="live-dot" style="margin-left: 2px;"></span>' : ''}
        <span style="font-size:10px; font-weight:normal; margin-left:8px; opacity:0.8; font-family:var(--font-mono); letter-spacing:0.5px; color:var(--live);">${totalLiveGames} Games</span>
      </button>
            `;

            html += LEAGUES.map(lg => {
                const events = leagueData[lg.id]?.events || [];
                const liveCount = events.filter(e => gameStatus(e).isLive).length;
                const schedCount = events.filter(e => !gameStatus(e).isFinal && !gameStatus(e).isLive).length;
                const finalCount = events.filter(e => gameStatus(e).isFinal).length;

                let countsStr = '';
                if (events.length > 0) {
                    countsStr = `<span style="font-size:10px; font-weight:normal; margin-left:8px; opacity:0.8; font-family:var(--font-mono); letter-spacing:0.5px;">` +
                        `<span style="color:var(--live); margin-right:6px;">${liveCount} Live</span>` +
                        `<span style="color:var(--accent2); margin-right:6px;">${schedCount} Sched</span>` +
                        `<span style="color:var(--muted);">${finalCount} Final</span>` +
                        `</span>`;
                }

                return `
      <button class="tab ${activeTab === lg.id ? 'active' : ''}" onclick="switchTab('${lg.id}')" style="display: inline-flex; align-items: center; gap: 8px;">

        <span>${lg.label}</span>${countsStr}
