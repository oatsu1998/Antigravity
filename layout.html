<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny — Universal Layout & Page Customizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="nav.js"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #18181b;
            --surface2: #1e293b;
            --surface3: #27272a;
            --border: #27272a;
            --border2: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #f59e0b;
            --cyan: #06b6d4;
            --win: #4ade80;
            --font-head: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .layout-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px 28px;
        }

        /* HEADER */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .header-title h1 {
            font-family: var(--font-head);
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2.5px;
            color: var(--accent);
            text-transform: uppercase;
            line-height: 1.1;
        }

        .header-title p {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* PAGE SELECTOR TABS */
        .page-selector-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .page-tab-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: var(--font-head);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .page-tab-btn:hover {
            background: var(--surface2);
            color: #fff;
            border-color: var(--border2);
        }

        .page-tab-btn.active {
            background: var(--surface2);
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.2);
        }

        /* LAYOUT EDITOR MAIN GRID */
        .editor-workspace {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
        }

        @media (max-width: 980px) {
            .editor-workspace {
                grid-template-columns: 1fr;
            }
        }

        /* LEFT PANEL: CONTROLS & WIDGET PALETTE */
        .controls-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }

        .panel-section-title {
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--cyan);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .select-input, .btn-action {
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-input:focus, .select-input:hover {
            border-color: var(--cyan);
        }

        .btn-action {
            background: var(--accent);
            color: #000;
            font-weight: 800;
            border: none;
            text-transform: uppercase;
        }

        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #ef4444;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 800;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #fff;
        }

        /* TOGGLE SWITCH LIST */
        .toggle-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toggle-item {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }

        .toggle-item label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-weight: 600;
        }

        /* RIGHT PANEL: LIVE PREVIEW & DRAG CANVAS */
        .preview-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }

        .preview-header-bar {
            background: var(--surface2);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .preview-title {
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 900;
            color: var(--win);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-iframe-container {
            width: 100%;
            height: 800px;
            border: none;
            background: var(--bg);
        }

        .preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div class="layout-container">
        <!-- TOP PAGE HEADER -->
        <header class="page-header">
            <div class="header-title">
                <h1>Universal Layout & Page Customizer</h1>
                <p>Customize Grid Layouts, Column Counts, Display Density & Component Visibility Across Every Page in Destiny Network</p>
            </div>
            <div class="controls-row">
                <button class="btn-reset" onclick="resetCurrentPageLayout()">↻ RESET PAGE LAYOUT</button>
                <button class="btn-action" onclick="saveCurrentPageLayout()">💾 SAVE & APPLY LAYOUT</button>
            </div>
        </header>

        <!-- PAGE SELECTOR TABS -->
        <div class="page-selector-bar" id="page-tabs-bar">
            <!-- Rendered dynamically -->
        </div>

        <!-- MAIN WORKSPACE GRID -->
        <div class="editor-workspace">
            <!-- LEFT PANEL: PAGE CONFIGURATION CONTROLS -->
            <div class="controls-panel">
                <div class="panel-section-title">
                    <span id="active-page-title">🏆 Daily Results Layout</span>
                    <span style="font-size:10px; color:var(--muted);" id="active-page-file">results.html</span>
                </div>

                <!-- GRID COLUMNS SELECTOR -->
                <div class="control-group">
                    <span class="control-label">Grid Layout Columns</span>
                    <select id="cfg-grid-cols" class="select-input" onchange="updateLiveLayoutPreview()">
                        <option value="1">1 Column (Single Full Width Stack)</option>
                        <option value="2" selected>2 Columns (Responsive Sportsbook Grid)</option>
                        <option value="3">3 Columns (Compact Multi-Matchup Grid)</option>
                        <option value="4">4 Columns (Dense Monitor Dashboard)</option>
                    </select>
                </div>

                <!-- DISPLAY DENSITY SELECTOR -->
                <div class="control-group">
                    <span class="control-label">Display Density</span>
                    <select id="cfg-density" class="select-input" onchange="updateLiveLayoutPreview()">
                        <option value="comfortable">Comfortable (Standard Padding)</option>
                        <option value="compact">Compact (High Information Density)</option>
                        <option value="spacious">Spacious (Expanded View)</option>
                    </select>
                </div>

                <!-- COMPONENT VISIBILITY TOGGLES -->
                <div class="control-group">
                    <span class="control-label">Component Visibility</span>
                    <div class="toggle-list" id="toggle-components-list">
                        <!-- Component Toggles Rendered dynamically -->
                    </div>
                </div>

                <button class="btn-action" style="margin-top: 10px;" onclick="saveCurrentPageLayout()">
                    <span>✨</span> APPLY LAYOUT TO LIVE PAGE
                </button>
            </div>

            <!-- RIGHT PANEL: LIVE INTERACTIVE PREVIEW -->
            <div class="preview-panel">
                <div class="preview-header-bar">
                    <div class="preview-title">
                        <span>👁️</span> LIVE INTERACTIVE PAGE PREVIEW
                    </div>
                    <span id="preview-url-badge" style="font-size: 11px; color: var(--muted); font-weight: 700;">results.html</span>
                </div>

                <div class="preview-iframe-container">
                    <iframe id="page-preview-iframe" class="preview-iframe" src="results.html"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configurable Pages Registry across the Destiny Suite
        const DESTINY_PAGES = [
            {
                key: "results",
                name: "🏆 Daily Results & Recaps",
                file: "results.html",
                components: [
                    { id: "kpi_summary", label: "Daily Slate KPI Summary Header", default: true },
                    { id: "league_filters", label: "League Filter Pills", default: true },
                    { id: "date_controls", label: "Date Stepper & Picker Controls", default: true },
                    { id: "game_recaps", label: "Expandable Game Recap Drawers", default: true },
                    { id: "sportsbook_grid", label: "Action Network Sportsbook Table", default: true }
                ]
            },
            {
                key: "index",
                name: "🏠 Home / Command Center",
                file: "index.html",
                components: [
                    { id: "ticker", label: "Top Live ESPN Ticker Bar", default: true },
                    { id: "sidebar", label: "Live Wagers Sidebar", default: true },
                    { id: "scoreboards", label: "Live Game Scoreboards Grid", default: true },
                    { id: "weather", label: "Live Open-Meteo Weather Chips", default: true },
                    { id: "portfolio_engine", label: "7-Wager Portfolio Engine", default: true }
                ]
            },
            {
                key: "mybets",
                name: "🎟️ Live Bets Tracking",
                file: "my-bets.html",
                components: [
                    { id: "ticket_health", label: "Ticket Health Indicators (🔴🟡🟢)", default: true },
                    { id: "cashout_control", label: "95% Cash-Out Action Engine", default: true },
                    { id: "active_tickets", label: "Active Ticket Cards Grid", default: true }
                ]
            },
            {
                key: "linetracker",
                name: "📈 Line Tracker",
                file: "line-tracker.html",
                components: [
                    { id: "line_matrix", label: "Multi-Bookmaker Line Matrix", default: true },
                    { id: "line_chart", label: "Historical Line Movement Graph", default: true }
                ]
            },
            {
                key: "props",
                name: "🎯 Player Props",
                file: "props.html",
                components: [
                    { id: "prop_filters", label: "NBA/NFL Prop Series Filter Tabs", default: true },
                    { id: "prop_cards", label: "50/50 Prop Line Cards Grid", default: true }
                ]
            },
            {
                key: "history",
                name: "📜 Line History & Logs",
                file: "history.html",
                components: [
                    { id: "timeline_graph", label: "Chart.js Timeline Graph", default: true },
                    { id: "history_table", label: "Historical Audit Log Table", default: true }
                ]
            },
            {
                key: "bethistory",
                name: "📑 Bet History Ledger",
                file: "bet-history.html",
                components: [
                    { id: "settled_ledger", label: "Settled Wagers Ledger Table", default: true },
                    { id: "pnl_summary", label: "Cumulative Bankroll Summary", default: true }
                ]
            },
            {
                key: "betslip",
                name: "🧾 Bet Slip Builder",
                file: "bet-slip.html",
                components: [
                    { id: "slip_builder", label: "Multi-Leg Slip Builder Panel", default: true },
                    { id: "parlay_teaser_calc", label: "Parlay & Teaser Odds Calculator", default: true }
                ]
            },
            {
                key: "kalshi",
                name: "📊 Kalshi Prediction Terminal",
                file: "kalshi.html",
                components: [
                    { id: "prediction_cards", label: "Prediction Markets Cards Grid", default: true },
                    { id: "candlestick_chart", label: "Orderbook & Price Candlestick Chart", default: true }
                ]
            },
            {
                key: "sandbox",
                name: "🧪 Strategy Sandbox",
                file: "sandbox.html",
                components: [
                    { id: "backtesting_engine", label: "Backtesting Portfolio Engine", default: true },
                    { id: "hedge_advisor", label: "AI Hedge Advisor Console", default: true }
                ]
            },
            {
                key: "portfolio",
                name: "💼 Portfolio & Ledger",
                file: "portfolio.html",
                components: [
                    { id: "bankroll_ledger", label: "Bankroll Ledger Ledger Engine", default: true },
                    { id: "pnl_trajectory", label: "PnL Trajectory Graph", default: true }
                ]
            }
        ];

        let activePageKey = "results";

        // Initialize Page Selector Tabs
        document.addEventListener('DOMContentLoaded', () => {
            renderPageTabs();
            selectPage("results");
        });

        function renderPageTabs() {
            const tabsBar = document.getElementById('page-tabs-bar');
            if (!tabsBar) return;

            tabsBar.innerHTML = DESTINY_PAGES.map(page => `
                <button class="page-tab-btn ${page.key === activePageKey ? 'active' : ''}" 
                        onclick="selectPage('${page.key}')">
                    ${page.name}
                </button>
            `).join('');
        }

        function selectPage(pageKey) {
            activePageKey = pageKey;
            renderPageTabs();

            const pageObj = DESTINY_PAGES.find(p => p.key === pageKey);
            if (!pageObj) return;

            document.getElementById('active-page-title').innerText = pageObj.name;
            document.getElementById('active-page-file').innerText = pageObj.file;
            document.getElementById('preview-url-badge').innerText = pageObj.file;

            // Load stored layout for this page or defaults
            const savedLayout = getPageLayoutConfig(pageKey, pageObj);

            document.getElementById('cfg-grid-cols').value = savedLayout.cols || "2";
            document.getElementById('cfg-density').value = savedLayout.density || "comfortable";

            // Render Toggles
            const toggleContainer = document.getElementById('toggle-components-list');
            toggleContainer.innerHTML = pageObj.components.map(comp => {
                const isChecked = savedLayout.components ? savedLayout.components[comp.id] !== false : comp.default;
                return `
                    <div class="toggle-item">
                        <label for="toggle-${comp.id}">
                            <input type="checkbox" id="toggle-${comp.id}" data-compid="${comp.id}" ${isChecked ? 'checked' : ''} onchange="updateLiveLayoutPreview()">
                            ${comp.label}
                        </label>
                    </div>
                `;
            }).join('');

            // Load iframe
            const iframe = document.getElementById('page-preview-iframe');
            if (iframe) iframe.src = pageObj.file;
        }

        function getPageLayoutConfig(pageKey, pageObj) {
            const saved = localStorage.getItem(`destiny_layout_${pageKey}`);
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { }
            }
            return { cols: "2", density: "comfortable", components: {} };
        }

        function updateLiveLayoutPreview() {
            const pageObj = DESTINY_PAGES.find(p => p.key === activePageKey);
            if (!pageObj) return;

            const cols = document.getElementById('cfg-grid-cols').value;
            const density = document.getElementById('cfg-density').value;

            const componentStates = {};
            pageObj.components.forEach(comp => {
                const checkbox = document.getElementById(`toggle-${comp.id}`);
                if (checkbox) componentStates[comp.id] = checkbox.checked;
            });

            const layoutConfig = {
                cols: cols,
                density: density,
                components: componentStates
            };

            // Save layout setting to localStorage
            localStorage.setItem(`destiny_layout_${activePageKey}`, JSON.stringify(layoutConfig));

            // Notify iframe to re-apply layout styles
            const iframe = document.getElementById('page-preview-iframe');
            if (iframe && iframe.contentWindow) {
                try {
                    iframe.contentWindow.postMessage({ type: 'DESTINY_LAYOUT_UPDATE', config: layoutConfig }, '*');
                } catch (e) { }
            }
        }

        function saveCurrentPageLayout() {
            updateLiveLayoutPreview();
            alert(`Layout configuration for ${activePageKey.toUpperCase()} saved successfully! All page views will now apply this layout.`);
        }

        function resetCurrentPageLayout() {
            localStorage.removeItem(`destiny_layout_${activePageKey}`);
            selectPage(activePageKey);
        }
    </script>
</body>

</html>
