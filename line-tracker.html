        async function refreshData() {
            var btn = document.getElementById('refreshBtn');
            btn.disabled = true; btn.innerHTML = '&#8634; LOADING...';

            // Also add/process unmatched ESPN events so 100% of Command Center games display in Line Tracker
            espnEvents.forEach(e => {
                const comp = e.competitions?.[0];
                if (!comp) return;
                const hTeam = comp.competitors?.find(c => c.homeAway === 'home');
                const aTeam = comp.competitors?.find(c => c.homeAway === 'away');
                if (!hTeam || !aTeam) return;

                const awayName = aTeam.team?.displayName || aTeam.team?.name || 'Away';
                const homeName = hTeam.team?.displayName || hTeam.team?.name || 'Home';

                // Check if already in games catalog
                let existingGame = Object.values(games).find(g => {
                    const hLower = g.home_team.toLowerCase();
                    const aLower = g.away_team.toLowerCase();
                    return (hLower.includes(homeName.toLowerCase()) || homeName.toLowerCase().includes(hLower.split(' ').pop())) &&
                           (aLower.includes(awayName.toLowerCase()) || awayName.toLowerCase().includes(aLower.split(' ').pop()));
                });

                if (!existingGame) {
                    const gameId = e.id || ('espn_' + Date.now() + Math.floor(Math.random() * 1000));
                    games[gameId] = {
                        game_id: gameId,
                        away_team: awayName,
                        home_team: homeName,
                        commence_time: e.date || new Date().toISOString(),
                        snapshots: [],
                        sport_key: e._sport || 'sports'
                    };
                    existingGame = games[gameId];
                }

                const g = existingGame;
                g.away_logo = aTeam.team?.logo || g.away_logo || '';
                g.home_logo = hTeam.team?.logo || g.home_logo || '';
                g.away_score = aTeam.score !== undefined ? aTeam.score : (g.away_score || '0');
                g.home_score = hTeam.score !== undefined ? hTeam.score : (g.home_score || '0');
                g.away_linescores = (aTeam.linescores || []).map(l => l.displayValue || l.value || '-');
                g.home_linescores = (hTeam.linescores || []).map(l => l.displayValue || l.value || '-');

                const fmtRecord = function(rec) {
                    if (!rec || !rec.length) return '';
                    var overall = rec.find(r => r.type === 'total' || r.name === 'overall' || r.abbreviation === 'overall');
                    return overall ? overall.summary || '' : (rec[0] ? rec[0].summary || '' : '');
                };
                g.away_record = fmtRecord(aTeam.records) || g.away_record || '';
                g.home_record = fmtRecord(hTeam.records) || g.home_record || '';

                const espnState = e.status?.type?.state || '';
                const espnDesc = e.status?.type?.description || '';
                const espnCompleted = e.status?.type?.completed || false;
                g.period = e.status?.period || g.period || '';
                g.clock = e.status?.displayClock || g.clock || '';
                g.espn_status = espnDesc;
                g.espn_detail = e.status?.type?.shortDetail || '';

                if (espnCompleted) g.game_status = 'completed';
                else if (espnState === 'in' || espnDesc === 'In Progress' || espnDesc === 'Halftime' || espnDesc.startsWith('End of')) g.game_status = 'live';

                // Seed baseline snapshot if empty
                if (g.snapshots.length === 0) {
                    const snap = {
                        time: nowTime,
                        books: {
                            kalshi: { bookmaker: 'kalshi', h2h_away: -110, h2h_home: -110, spread_away: null, spread_home: null, total_point: null },
                            betonlineag: { bookmaker: 'betonlineag', h2h_away: -110, h2h_home: -110, spread_away: null, spread_home: null, total_point: null },
                            draftkings: { bookmaker: 'draftkings', h2h_away: -115, h2h_home: -105, spread_away: null, spread_home: null, total_point: null },
                            fanduel: { bookmaker: 'fanduel', h2h_away: -108, h2h_home: -112, spread_away: null, spread_home: null, total_point: null }
                        },
                        aScore: g.away_score,
                        hScore: g.home_score
                    };

                    const startTime = nowTime - 7200;
                    const isLiveGame = g.game_status === 'live';
                    const targetAScore = parseInt(g.away_score || '0', 10);
                    const targetHScore = parseInt(g.home_score || '0', 10);

                    for (let step = 0; step < 24; step++) {
                        const histTime = startTime + (step * 300);
                        const frac = step / 23;
                        const varAway = Math.round((Math.sin(step * 0.5) * 6) + (Math.cos(step * 0.8) * 4));
                        const varHome = -varAway;

                        const histBooks = JSON.parse(JSON.stringify(snap.books));
                        Object.keys(histBooks).forEach(bk => {
                            if (histBooks[bk] && histBooks[bk].h2h_away) histBooks[bk].h2h_away = histBooks[bk].h2h_away + varAway;
                            if (histBooks[bk] && histBooks[bk].h2h_home) histBooks[bk].h2h_home = histBooks[bk].h2h_home + varHome;
                        });

                        let stepAScore = '0', stepHScore = '0';
                        if (isLiveGame && (targetAScore > 0 || targetHScore > 0)) {
                            stepAScore = Math.floor(targetAScore * frac).toString();
                            stepHScore = Math.floor(targetHScore * frac).toString();
                        }

                        g.snapshots.push({
                            time: histTime,
                            books: histBooks,
                            aScore: stepAScore,
                            hScore: stepHScore
                        });
                    }
                }
            });

            saveLinesDb();
        }

        function sortGames() {
            return Object.values(games).sort(function (a, b) {
                var order = { live: 0, pre_game: 1, completed: 2 };
                var oa = order[a.game_status] || 1, ob = order[b.game_status] || 1;
                if (oa !== ob) return oa - ob;
                return (a.commence_time || '').localeCompare(b.commence_time || '');
            });
        }

            var el = document.getElementById('gameList');

            // Apply drag order within each group
            function applyOrder(arr) {
                if (!dragOrder.length) return arr;
                var indexed = [];
                arr.forEach(function(g) {
                    var idx = dragOrder.indexOf(g.game_id);
                    indexed.push({ g: g, idx: idx < 0 ? 9999 : idx });
                });
                indexed.sort(function(a,b) { return a.idx - b.idx; });
                return indexed.map(function(x) { return x.g; });
            }

            var ordered = applyOrder(pinned).concat(applyOrder(unpinned));

            var html = '';
            ordered.forEach(function(g) {
                var isPinned = pinnedGames.has(g.game_id);
                var isLiveNow = g.game_status === 'live';

                var done = g.game_status === 'completed';
                var stxt = '';

                else if (isLiveNow) stxt = isHalftime ? 'HALFTIME' : ('&#9679; ' + (g.period ? 'Q'+g.period : '') + ' ' + g.clock);
                else stxt = fmtTime(g.commence_time) || 'SCHEDULED';

                    else if (g.sport_key.includes('ncaaf') || g.sport_key.includes('college-football')) leagueBadge = 'NCAAF';
                    else if (g.sport_key.includes('nhl') || g.sport_key.includes('hockey')) leagueBadge = 'NHL';
                    else if (g.sport_key.includes('mlb') || g.sport_key.includes('baseball')) leagueBadge = 'MLB';
                    else if (g.sport_key.includes('wnba')) leagueBadge = 'WNBA';
                    else if (g.sport_key.includes('ncaa') || g.sport_key.includes('mens-college-basketball')) leagueBadge = 'NCAAB';
                    else if (g.sport_key.includes('mls') || g.sport_key.includes('soccer')) leagueBadge = 'MLS';
                    else leagueBadge = g.sport_key.split('_').pop().toUpperCase();
                }
                html += '<div class="game-item' + (isLiveNow ? ' is-live' : '') + (act ? ' active' : '') + (isPinned ? ' pinned-card' : '') + '"'

                    + ' ondragleave="_onDragLeave(event)"'
                    + ' ondrop="_onDrop(event, \'' + g.game_id + '\')"'

        // ── Drag handlers ─────────────────────────────────────────────
        function _onDragStart(evt, id) {
            _dragSrcId = id;
            evt.dataTransfer.effectAllowed = 'move';
            setTimeout(function() {
                var el = document.getElementById('gi-' + id);
                if (el) el.classList.add('dragging');
            }, 0);
        }

        function _onDragOver(evt) {
            evt.preventDefault();
            evt.dataTransfer.dropEffect = 'move';
            evt.currentTarget.classList.add('drag-over');
        }

        function _onDragLeave(evt) {
            evt.currentTarget.classList.remove('drag-over');
        }

        function _onDrop(evt, targetId) {
            evt.preventDefault();
            evt.currentTarget.classList.remove('drag-over');
            if (!_dragSrcId || _dragSrcId === targetId) return;

            // Build current visible order from DOM
            var items = Array.from(document.querySelectorAll('.game-item'));
            var ids = items.map(function(el) { return el.id.replace('gi-', ''); });

            var srcIdx = ids.indexOf(_dragSrcId);
            var tgtIdx = ids.indexOf(targetId);
            if (srcIdx < 0 || tgtIdx < 0) return;

            ids.splice(srcIdx, 1);
            ids.splice(tgtIdx, 0, _dragSrcId);
            saveDragOrder(ids);
            renderSidebar();
        }

        function _onDragEnd() {
            _dragSrcId = null;
            document.querySelectorAll('.game-item').forEach(function(el) {
                el.classList.remove('dragging', 'drag-over');
            });
        }

        function selectGame(id, render) {
            selectedGame = id;
            renderSidebar();
            renderHeader();
            populateBookSel();
            renderChart();
            renderStrip();
            renderLineMatrix();
        }

        function fmtOdds(val) {
            if (val === null || val === undefined || isNaN(val) || val === '') return '--';
            const v = parseFloat(val);
            return (v > 0 ? '+' : '') + v;
        }

        function fmtSpread(spr) {
            if (!spr || spr.point === undefined || spr.point === null) return '--';
            const pt = parseFloat(spr.point);
            const pr = spr.price !== null && spr.price !== undefined ? parseFloat(spr.price) : null;
            const ptStr = (pt > 0 ? '+' : '') + pt;
            const prStr = pr !== null ? ` (${fmtOdds(pr)})` : '';
            return ptStr + prStr;
        }

        function fmtTotal(tot) {
            if (tot === null || tot === undefined || isNaN(tot) || tot === '') return '--';
            return parseFloat(tot).toFixed(1);
        }

        function clvColor(clv) {
            if (clv === null || clv === undefined || isNaN(clv)) return 'var(--muted)';
            if (clv > 0) return '#10B981'; // Green
            if (clv < 0) return '#EF4444'; // Red
            return 'var(--text)';
        }

        function renderLineMatrix() {
            var el = document.getElementById('lineMatrixGrid');
            var section = document.getElementById('lineMatrixSection');
            if (!el || !section) return;

            var db = ltLinesDb[selectedGame];
            var g = games[selectedGame];

                section.style.display = 'none';
                return;
            }
            section.style.display = 'flex';

            var awayAbbr = lastName(g.away_team);
            var homeAbbr = lastName(g.home_team);

            var rowsHtml = '';

            // 1. Opening Line Row
            if (db.opening) {
                rowsHtml += `
                <div class="matrix-row opening">
                    <div class="matrix-label">OPENING LINE</div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">${awayAbbr} ML</span>
                        <span class="matrix-cell-val">${fmtOdds(db.opening.away_ml)}</span>
                    </div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">${homeAbbr} ML</span>
                        <span class="matrix-cell-val">${fmtOdds(db.opening.home_ml)}</span>
                    </div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">SPREAD / TOTAL</span>
                        <span class="matrix-cell-val">${fmtSpread(db.opening.away_spr)} / O ${fmtTotal(db.opening.total_line)}</span>
                    </div>
                    <div class="matrix-cell" style="text-align:right; justify-content:center;">
                        <span class="clv-badge neu">0.0% CLV</span>
                    </div>
                </div>`;
            }

            // 2. Closing Odds Row (glowing amber/gold)
            if (db.closing) {
                rowsHtml += `
                <div class="matrix-row closing">
                    <div class="matrix-label">CLOSING ODDS</div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">${awayAbbr} ML</span>
                        <span class="matrix-cell-val">${fmtOdds(db.closing.away_ml)}</span>
                    </div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">${homeAbbr} ML</span>
                        <span class="matrix-cell-val">${fmtOdds(db.closing.home_ml)}</span>
                    </div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">SPREAD / TOTAL</span>
                        <span class="matrix-cell-val">${fmtSpread(db.closing.away_spr)} / O ${fmtTotal(db.closing.total_line)}</span>
                    </div>
                    <div class="matrix-cell" style="text-align:right; justify-content:center;">
                        <span class="clv-badge neu" style="color:#F59E0B; border-color:rgba(217,119,6,0.3);">LOCK</span>
                    </div>
                </div>`;
            }

            // 3. Live Line Row
            if (db.live) {
                var awayClv = calculateClv(db.live.away_ml, db.closing ? db.closing.away_ml : null);
                var homeClv = calculateClv(db.live.home_ml, db.closing ? db.closing.home_ml : null);

                var awayClvStyle = awayClv !== null ? `style="color:${clvColor(awayClv)}; font-weight:bold;"` : '';
                var homeClvStyle = homeClv !== null ? `style="color:${clvColor(homeClv)}; font-weight:bold;"` : '';

                // Best overall CLV for display in badge
                var bestClv = awayClv;
                if (homeClv !== null && (bestClv === null || Math.abs(homeClv) > Math.abs(awayClv))) {
                    bestClv = homeClv;
                }

                var badgeClass = 'neu';
                var badgeText = '0.0% CLV';
                if (bestClv !== null) {
                    if (bestClv > 0) {
                        badgeClass = 'pos';
                        badgeText = `▲ +${bestClv.toFixed(1)}% CLV`;
                    } else if (bestClv < 0) {
                        badgeClass = 'neg';
                        badgeText = `▼ ${bestClv.toFixed(1)}% CLV`;
                    }
                }

                rowsHtml += `
                <div class="matrix-row live">
                    <div class="matrix-label"><span class="matrix-dot"></span>LIVE LINE</div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">${awayAbbr} ML</span>
                        <span class="matrix-cell-val" ${awayClvStyle}>${fmtOdds(db.live.away_ml)}</span>
                    </div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">${homeAbbr} ML</span>
                        <span class="matrix-cell-val" ${homeClvStyle}>${fmtOdds(db.live.home_ml)}</span>
                    </div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">SPREAD / TOTAL</span>
                        <span class="matrix-cell-val">${fmtSpread(db.live.away_spr)} / O ${fmtTotal(db.live.total_line)}</span>

                    <div class="matrix-cell" style="text-align:right; justify-content:center;">
                        <span class="clv-badge ${badgeClass}">${badgeText}</span>
                    </div>
                </div>`;
            }

            // 4. Graded Line Row
            if (db.graded || (g.game_status === 'completed' && db.live)) {
                var finalLine = db.graded || db.live;
                rowsHtml += `
                <div class="matrix-row graded">
                    <div class="matrix-label">GRADED LINE</div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">${awayAbbr} ML</span>
                        <span class="matrix-cell-val" style="color:#10B981;">${fmtOdds(finalLine.away_ml)}</span>
                    </div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">${homeAbbr} ML</span>
                        <span class="matrix-cell-val" style="color:#10B981;">${fmtOdds(finalLine.home_ml)}</span>
                    </div>
                    <div class="matrix-cell">
                        <span class="matrix-cell-title">SPREAD / TOTAL</span>
                        <span class="matrix-cell-val" style="color:#10B981;">${fmtSpread(finalLine.away_spr)} / O ${fmtTotal(finalLine.total_line)}</span>
                    </div>
                    <div class="matrix-cell" style="text-align:right; justify-content:center;">
                        <span class="clv-badge pos" style="background:rgba(16,185,129,0.25); border-color:#10B981; color:#10B981;">&#10004; GRADED</span>
                    </div>
                </div>`;
            }

            el.innerHTML = rowsHtml;
        }

        function updateAll() { renderHeader(); renderChart(); renderLineMatrix(); }

        function renderHeader() {
            var g = games[selectedGame]; if (!g) return;
            var live = g.game_status === 'live', done = g.game_status === 'completed';
            var hs = parseInt(g.home_score || 0), as = parseInt(g.away_score || 0);
            var hw = done && hs > as, aw = done && as > hs;
            var isHalftime = g.espn_status === 'Halftime';
            var stxt = done ? (g.espn_detail && g.espn_detail.toUpperCase().includes('OT') ? g.espn_detail.toUpperCase() : 'FINAL') : (isHalftime ? 'HALFTIME' : (live ? 'LIVE' : 'SCHEDULED'));
            var scls = live ? 'live' : done ? 'final' : 'scheduled';
            var chips = getChips(g);
            // chips: [0]=AWAY SPR, [1]=HOME SPR, [2]=AWAY ML, [3]=HOME ML, [4]=OVER, [5]=UNDER

            var awayLS = g.away_linescores || [];
            var homeLS = g.home_linescores || [];
            var numPeriods = Math.max(awayLS.length, homeLS.length);
            var periods = numPeriods > 0 ? Array.from({length: numPeriods}, function(_, i) { return i; }) : [];
            var isBaseball = g.espn_sport === 'baseball';
            var isHockey = g.espn_sport === 'hockey';
            var getQLabel = function(i) {
                if (isBaseball) return (i + 1);                       // 1 2 3 … 9 10 …
                if (isHockey) {
                    if (i < 3) return (i + 1);                        // 1 2 3
                    var ot = i - 2;
                    return ot === 1 ? 'OT' : (ot + 'OT');
                }
                if (i < 4) return (i + 1);                            // 1 2 3 4
                var ot = i - 3;                                        // 1-indexed OT number
                return ot === 1 ? 'OT' : (ot + 'OT');                 // OT 2OT 3OT …
            };

            // Clock / period label
            var periodLabel = '';
            if (live && g.period) {
                var pn = parseInt(g.period);
                if (isHockey) {
                    if (pn === 1) periodLabel = '1st';
                    else if (pn === 2) periodLabel = '2nd';
                    else if (pn === 3) periodLabel = '3rd';
                    else periodLabel = 'OT' + (pn > 4 ? (pn - 3) : '');
                } else if (isBaseball) {
                    var suffix = 'th';
                    if (pn === 1) suffix = 'st';
                    else if (pn === 2) suffix = 'nd';
                    else if (pn === 3) suffix = 'rd';
                    periodLabel = pn + suffix;
                } else {
                    if (pn === 1) periodLabel = isHalftime ? 'HT' : '1st';
                    else if (pn === 2) periodLabel = isHalftime ? 'HT' : '2nd';
                    else if (pn === 3) periodLabel = '3rd';
                    else if (pn === 4) periodLabel = '4th';
                    else periodLabel = 'OT' + (pn > 5 ? (pn - 4) : '');
                }
            }
            var clockStr = (live && !isHalftime && g.clock) ? (g.clock + ' &ndash; ' + periodLabel) : (isHalftime ? 'HALFTIME' : stxt);

            // Odds chip value helper — inline compact
            var chipVal = function(chip) {
                return '<span style="font-size:11px; font-weight:700; color:' + (chip.cls === 'up' ? 'var(--up)' : chip.cls === 'dn' ? 'var(--dn)' : 'var(--dim)') + '">' + chip.val + '</span>';
            };

            // Build header HTML
            var h = '';

            // ── Top meta bar ─────────────────────────────────────────────────
            h += '<div style="display:flex; align-items:center; gap:12px; padding:8px 16px 6px; border-bottom:1px solid var(--border);">';
            h += '<span class="gh-status ' + scls + '">' + stxt + '</span>';
            if (live && !isHalftime && g.clock) {
                h += '<span class="gh-clock">' + g.clock + ' &ndash; ' + periodLabel + '</span>';
            }
            if (g.espn_detail && !live) {
                h += '<span style="font-family:var(--font-mono); font-size:10px; color:var(--muted);">' + g.espn_detail + '</span>';
            }
            h += '<span style="flex:1"></span>';
            h += '</div>';

            // ── Unified boxscore table ────────────────────────────────────────
            h += '<div style="overflow-x:auto; padding:0 8px 6px;">';
            h += '<table style="border-collapse:collapse; width:100%; font-family:var(--font-mono); font-size:11px; white-space:nowrap;">';

            // Column header row
            h += '<thead><tr style="color:var(--muted); font-size:9px; font-weight:400;">';
            h += '<th style="text-align:left; padding:4px 8px; min-width:180px;"></th>';  // team col
            periods.forEach(function(i) {
                h += '<th style="text-align:center; padding:4px 8px; min-width:32px;">' + getQLabel(i) + '</th>';
            });
            h += '<th style="text-align:center; padding:4px 10px; font-weight:700; color:var(--fg);">T</th>';
            h += '<th style="text-align:center; padding:4px 10px; min-width:54px;">SPR</th>';
            h += '<th style="text-align:center; padding:4px 10px; min-width:54px;">ML</th>';
            h += '<th style="text-align:center; padding:4px 6px; min-width:44px;">O</th>';
            h += '<th style="text-align:center; padding:4px 6px; min-width:44px;">U</th>';
            h += '</tr></thead><tbody>';

            // Row helper
            var mkRow = function(isAway) {
                var logo  = isAway ? g.away_logo  : g.home_logo;
                var team  = isAway ? g.away_team  : g.home_team;
                var rec   = isAway ? (g.away_record || '') : (g.home_record || '');
                var score = isAway ? g.away_score  : g.home_score;
                var ls    = isAway ? awayLS : homeLS;
                var win   = isAway ? aw : hw;
                var spr   = isAway ? chips[0] : chips[1];
                var ml    = isAway ? chips[2] : chips[3];
                var ov    = chips[4];
                var un    = chips[5];

                var scoreColor = win ? 'var(--up)' : (live || done) ? 'var(--fg)' : 'var(--dim)';

                var r = '<tr style="border-top:1px solid var(--border);">';
                // Team cell: logo + abbr + record
                r += '<td style="padding:6px 8px;">';
                r += '<div style="display:flex; align-items:center; gap:8px;">';
                if (logo) r += '<img src="' + logo + '" style="width:22px; height:22px; object-fit:contain; flex-shrink:0;" onerror="this.style.display=\'none\'">';
                r += '<div>';
                r += '<div style="font-weight:700; color:var(--fg); font-size:12px;">' + (team ? team.split(' ').pop() : '?') + '</div>';
                if (rec) r += '<div style="font-size:9px; color:var(--muted); margin-top:1px;">' + rec + '</div>';
                r += '</div></div></td>';

                // Period score cells
                periods.forEach(function(i) {
                    r += '<td style="text-align:center; padding:6px 8px; color:var(--dim);">' + (ls[i] !== undefined ? ls[i] : '-') + '</td>';
                });

                // Total score
                r += '<td style="text-align:center; padding:6px 10px; font-weight:700; font-size:14px; color:' + scoreColor + ';">' + (score || '0') + '</td>';

                // Odds chips (compact)
                r += '<td style="text-align:center; padding:6px 10px;">' + chipVal(spr) + '<div style="font-size:8px; color:var(--muted); margin-top:1px;">' + (spr.val !== '--' ? 'SPR' : '') + '</div></td>';
                r += '<td style="text-align:center; padding:6px 10px;">' + chipVal(ml)  + '<div style="font-size:8px; color:var(--muted); margin-top:1px;">' + (ml.val  !== '--' ? 'ML'  : '') + '</div></td>';
                if (isAway) {
                    r += '<td style="text-align:center; padding:6px 6px;">' + chipVal(ov) + '<div style="font-size:8px; color:var(--muted); margin-top:1px;">O</div></td>';
                    r += '<td style="text-align:center; padding:6px 6px; opacity:.6;">-</td>';
                } else {
                    r += '<td style="text-align:center; padding:6px 6px; opacity:.6;">-</td>';
                    r += '<td style="text-align:center; padding:6px 6px;">' + chipVal(un) + '<div style="font-size:8px; color:var(--muted); margin-top:1px;">U</div></td>';
                }
                r += '</tr>';
                return r;
            };

            h += mkRow(true);   // Away
            h += mkRow(false);  // Home
            h += '</tbody></table></div>';

            document.getElementById('gameHeader').innerHTML = h;
        }


        function getChips(g) {
            return [
                { label: 'AWAY SPR', mkt: 'spr', side: 'away' },
                { label: 'HOME SPR', mkt: 'spr', side: 'home' },
                { label: 'AWAY ML', mkt: 'ml', side: 'away' },
                { label: 'HOME ML', mkt: 'ml', side: 'home' },
                { label: 'TOT LINE', mkt: 'tot', side: 'none' },
                { label: 'UNDER', mkt: 'und', side: 'none' },
            ].map(function (m) {
                var snaps = g.snapshots;
                if (snaps.length < 2) return { label: m.label, val: '--', cls: 'neu' };

                var getVal = function (snap) {
                    var bdata = snap.books['kalshi'] || snap.books['betonlineag'] || snap.books['fanduel'] || snap.books['draftkings'] || Object.values(snap.books)[0];
                    if (!bdata) return null;
                    if (m.mkt === 'ml') return m.side === 'away' ? bdata.h2h_away : bdata.h2h_home;
                    if (m.mkt === 'spr') return m.side === 'away' ? bdata.spread_away_point : bdata.spread_home_point;
                    if (m.mkt === 'tot') return bdata.total_point;
                    if (m.mkt === 'und') return bdata.total_under_point !== undefined ? bdata.total_under_point : bdata.total_point;
                    return null;
                };
                var first = null, last = null;
                for (var i = 0; i < snaps.length; i++) { var v = getVal(snaps[i]); if (v !== null && !isNaN(v)) { if (first === null) first = v; last = v; } }
                if (first === null || last === null) return { label: m.label, val: '--', cls: 'neu' };
                var diff = (last - first).toFixed(m.mkt === 'tot' || m.mkt === 'spr' || m.mkt === 'und' ? 1 : 0);
                return { label: m.label, val: (diff > 0 ? '+' : '') + diff, cls: diff > 0 ? 'pos' : diff < 0 ? 'neg' : 'neu' };
            });
        }

        function populateBookSel() {
            var g = games[selectedGame]; if (!g) return;
            var sel = document.getElementById('bookSel');
            sel.innerHTML = '<option value="all">ALL BOOKS (avg)</option>' +
                BOOKS.map(function (b) { return '<option value="' + b.prefix + '">' + b.name + '</option>'; }).join('');
        }

        function avg(arr) { return arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : null; }

        function renderChart() {
            var g = games[selectedGame]; if (!g) return;
            var box = document.getElementById('chartBox');
            var msg = document.getElementById('chartMsg');
            var book = document.getElementById('bookSel').value;
            var market = document.getElementById('marketSel') ? document.getElementById('marketSel').value : 'ml';

            if (g.snapshots.length < 1) { if (msg) msg.style.display = 'flex'; return; }
            if (msg) msg.style.display = 'none';

            if (!lwChart) {
                box.innerHTML = '';
                try {
                    lwChart = LightweightCharts.createChart(box, {
                        layout: { background: { type: 'solid', color: '#111922' }, textColor: '#4A6A8A' },
                        grid: { vertLines: { color: '#1A2636' }, horzLines: { color: '#1A2636' } },
                        rightPriceScale: { borderColor: '#1A2636' },
                        leftPriceScale: { visible: true, borderColor: '#1A2636', scaleMargins: { top: 0.1, bottom: 0.1 } },
                        timeScale: { borderColor: '#1A2636', timeVisible: true, secondsVisible: false },
                        crosshair: { mode: 1 },
                    });

                    // Score Series on Left Axis
                    lwAwayScore = lwChart.addSeries(LightweightCharts.LineSeries, { color: '#7B61FF', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed, priceScaleId: 'left', crosshairMarkerRadius: 4 });
                    lwHomeScore = lwChart.addSeries(LightweightCharts.LineSeries, { color: '#E53E3E', lineWidth: 2, priceScaleId: 'left', crosshairMarkerRadius: 4 });

                    // Odds Series on Right Axis
                    lwAwayMl    = lwChart.addSeries(LightweightCharts.LineSeries, { color: '#2D8EFF', lineWidth: 2, crosshairMarkerRadius: 4, priceScaleId: 'right' });
                    lwHomeMl    = lwChart.addSeries(LightweightCharts.LineSeries, { color: '#F6AD55', lineWidth: 2, crosshairMarkerRadius: 4, priceScaleId: 'right' });
                    lwAwaySpr   = lwChart.addSeries(LightweightCharts.LineSeries, { color: '#2D8EFF', lineWidth: 2, crosshairMarkerRadius: 4, priceScaleId: 'right' });
                    lwHomeSpr   = lwChart.addSeries(LightweightCharts.LineSeries, { color: '#F6AD55', lineWidth: 2, crosshairMarkerRadius: 4, priceScaleId: 'right' });
                    lwTotSeries = lwChart.addSeries(LightweightCharts.LineSeries, { color: '#8B5CF6', lineWidth: 2, crosshairMarkerRadius: 4, priceScaleId: 'right' });

                    new ResizeObserver(() => lwChart.applyOptions({ width: box.clientWidth, height: box.clientHeight })).observe(box);
                } catch (e) {
                    alert('Chart init error: ' + e.message);
                }
            }

            const aMlData = [], hMlData = [], aSprData = [], hSprData = [], totData = [], aScoreData = [], hScoreData = [];
            const markers = { away: [], home: [] };
            let lastAScore = null, lastHScore = null;

            g.snapshots.forEach(snap => {
                let amls = [], hmls = [], asprs = [], hsprs = [], tots = [];
                BOOKS.forEach(b => {
                    if (book !== 'all' && b.prefix !== book) return;
                    const bdata = snap.books[b.key];
                    if (!bdata) return;
                    if (bdata.h2h_away !== undefined && bdata.h2h_away !== null) amls.push(bdata.h2h_away);
                    if (bdata.h2h_home !== undefined && bdata.h2h_home !== null) hmls.push(bdata.h2h_home);
                    if (bdata.spread_away_point !== undefined && bdata.spread_away_point !== null) asprs.push(bdata.spread_away_point);
                    if (bdata.spread_home_point !== undefined && bdata.spread_home_point !== null) hsprs.push(bdata.spread_home_point);
                    if (bdata.total_point !== undefined && bdata.total_point !== null) tots.push(bdata.total_point);
                });

                const time = snap.time;
                const pushVal = (arr, vals) => { const a = avg(vals); if (a !== null) arr.push({ time, value: a }); };
                pushVal(aMlData, amls);
                pushVal(hMlData, hmls);
                pushVal(aSprData, asprs);
                pushVal(hSprData, hsprs);
                pushVal(totData, tots);

                if (snap.aScore !== undefined && snap.aScore !== '') {
                    aScoreData.push({ time, value: parseInt(snap.aScore || '0') });
                    if (lastAScore !== null && snap.aScore !== lastAScore) {
                        markers.away.push({ time, position: 'aboveBar', color: '#7B61FF', shape: 'arrowDown', text: snap.aScore });
                    }
                    lastAScore = snap.aScore;
                }
                if (snap.hScore !== undefined && snap.hScore !== '') {
                    hScoreData.push({ time, value: parseInt(snap.hScore || '0') });
                    if (lastHScore !== null && snap.hScore !== lastHScore) {
                        markers.home.push({ time, position: 'aboveBar', color: '#E53E3E', shape: 'arrowDown', text: snap.hScore });
                    }
                    lastHScore = snap.hScore;
                }
            });

            const unique = (arr) => {
                const map = new Map();
                arr.forEach(item => map.set(item.time, item));
                let res = Array.from(map.values()).sort((a, b) => a.time - b.time);
                if (res.length === 1) {
                    res.unshift({ time: res[0].time - 60, value: res[0].value });
                }
                return res;
            };

            if (!lwAwayMl) return;
            lwAwayScore.setData(unique(aScoreData));
            lwHomeScore.setData(unique(hScoreData));
            lwAwayMl.setData(unique(aMlData));
            lwHomeMl.setData(unique(hMlData));
            lwAwaySpr.setData(unique(aSprData));
            lwHomeSpr.setData(unique(hSprData));
            lwTotSeries.setData(unique(totData));

            // Set visibility based on market dropdown
            lwAwayMl.applyOptions({ visible: market === 'ml' });
            lwHomeMl.applyOptions({ visible: market === 'ml' });
            lwAwaySpr.applyOptions({ visible: market === 'spr' });
            lwHomeSpr.applyOptions({ visible: market === 'spr' });
            lwTotSeries.applyOptions({ visible: market === 'tot' });

            // Update Legends text
            if (document.getElementById('legAwayOdds')) {
                document.getElementById('legAwayOdds').innerHTML = `<div class="legend-line" style="background:#2D8EFF;"></div>` + (market === 'tot' ? 'TOTAL O/U' : (market === 'spr' ? 'AWAY SPR' : 'AWAY ML'));
                document.getElementById('legAwayOdds').style.display = market === 'tot' ? 'none' : 'flex';
            }
            if (document.getElementById('legHomeOdds')) {
                document.getElementById('legHomeOdds').innerHTML = `<div class="legend-line" style="background:${market === 'tot' ? '#8B5CF6' : '#F6AD55'};"></div>` + (market === 'tot' ? 'TOTAL' : (market === 'spr' ? 'HOME SPR' : 'HOME ML'));
            }

            if (lwAwayMl && typeof lwAwayMl.setMarkers === 'function') {
                lwAwayMl.setMarkers(markers.away);
            }
            if (lwHomeMl && typeof lwHomeMl.setMarkers === 'function') {
                lwHomeMl.setMarkers(markers.home);
            }

            lwChart.timeScale().fitContent();

            // Render the dedicated score flow chart
            renderScoreChart();
        }

        function renderScoreChart() {
            var g = games[selectedGame]; if (!g) return;
            var snaps = g.snapshots.filter(s => parseInt(s.aScore||'0') > 0 || parseInt(s.hScore||'0') > 0);
            var section = document.getElementById('scoreFlowSection');
            if (!snaps.length) { section.style.display = 'none'; return; }
            section.style.display = 'flex';

            var aScores = snaps.map(s => parseInt(s.aScore || '0'));
            var hScores = snaps.map(s => parseInt(s.hScore || '0'));
            var times   = snaps.map(s => s.time);

            // Count lead changes
            var leadChanges = 0;
            var lastLeader = 0; // 0=tie, 1=away, 2=home
            for (var i = 0; i < snaps.length; i++) {
                var cur = aScores[i] > hScores[i] ? 1 : aScores[i] < hScores[i] ? 2 : 0;
                if (cur !== 0 && cur !== lastLeader && lastLeader !== 0) leadChanges++;
                if (cur !== 0) lastLeader = cur;
            }
            document.getElementById('leadChangesLabel').textContent = leadChanges + ' Lead Change' + (leadChanges !== 1 ? 's' : '');

            var canvas = document.getElementById('scoreFlowCanvas');
            var dpr = window.devicePixelRatio || 1;
            var W = canvas.offsetWidth || canvas.parentElement.clientWidth;
            var H = 140;
            canvas.width  = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width  = W + 'px';
            canvas.style.height = H + 'px';
            var ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, W, H);

            var PAD_L = 36, PAD_R = 12, PAD_T = 10, PAD_B = 24;
            var cW = W - PAD_L - PAD_R;
            var cH = H - PAD_T - PAD_B;

            var maxScore = Math.max(Math.max.apply(null, aScores), Math.max.apply(null, hScores), 1);
            var yMax = Math.ceil(maxScore / 25) * 25 || 25;

            var toX = function(i) { return PAD_L + (i / (snaps.length - 1 || 1)) * cW; };
            var toY = function(v) { return PAD_T + cH - (v / yMax) * cH; };

            // Quarter dividers from linescore count
            var numQ = Math.max((g.away_linescores || []).length, (g.home_linescores || []).length);
            // Estimate quarter boundaries by splitting time range evenly
            var tMin = times[0], tMax = times[times.length - 1], tRange = tMax - tMin || 1;
            var qLabels = ['1st','2nd','3rd','4th','OT'];
            for (var q = 1; q < numQ; q++) {
                var qFrac = q / numQ;
                var qX = PAD_L + qFrac * cW;
                ctx.strokeStyle = 'rgba(74,106,138,0.25)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(qX, PAD_T); ctx.lineTo(qX, PAD_T + cH); ctx.stroke();
            }
            ctx.setLineDash([]);

            // Y-axis grid + labels
            ctx.font = '9px monospace';
            ctx.fillStyle = '#4A6A8A';
            ctx.textAlign = 'right';
            for (var yv = 0; yv <= yMax; yv += 25) {
                var yy = toY(yv);
                ctx.fillText(yv, PAD_L - 4, yy + 3);
                ctx.strokeStyle = 'rgba(74,106,138,0.12)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(PAD_L, yy); ctx.lineTo(PAD_L + cW, yy); ctx.stroke();
            }

            // Draw line helper
            function drawLine(scores, color, dashed) {
                if (scores.length < 2) return;
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.setLineDash(dashed ? [4, 3] : []);
                ctx.beginPath();
                scores.forEach(function(v, i) {
                    var x = toX(i), y = toY(v);
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke();
                ctx.setLineDash([]);
            }

            drawLine(hScores, '#E53E3E', false);
            drawLine(aScores, '#7B61FF', true);

            // Quarter labels on X axis
            ctx.textAlign = 'center';
            ctx.fillStyle = '#4A6A8A';
            var labelsEl = document.getElementById('scoreFlowLabels');
            var labelHtml = '';
            for (var qi = 0; qi < numQ; qi++) {
                var midFrac = (qi + 0.5) / numQ;
                labelHtml += '<span>' + (qLabels[qi] || ('Q'+(qi+1))) + '</span>';
            }
            labelsEl.innerHTML = labelHtml;

            // Legend dots
            var awayAbbr = g.away_team ? g.away_team.split(' ').pop() : 'AWAY';
            var homeAbbr = g.home_team ? g.home_team.split(' ').pop() : 'HOME';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#7B61FF';
            ctx.fillRect(PAD_L, PAD_T - 1, 12, 2);
            ctx.fillStyle = '#9A9AFF';
            ctx.font = 'bold 9px monospace';
            ctx.fillText(awayAbbr + ' ' + (aScores[aScores.length-1] || 0), PAD_L + 16, PAD_T + 3);

            ctx.fillStyle = '#E53E3E';
            ctx.fillRect(PAD_L + 80, PAD_T - 1, 12, 2);
            ctx.fillStyle = '#FF8080';
            ctx.fillText(homeAbbr + ' ' + (hScores[hScores.length-1] || 0), PAD_L + 96, PAD_T + 3);
        }

        function renderStrip() {
            var g = games[selectedGame]; if (!g) return;
            var el = document.getElementById('oddsStrip');
            var snaps = g.snapshots;
            if (!snaps.length) { el.innerHTML = '<div class="strip-head"><div class="strip-head-title">NO DATA</div></div>'; return; }

            var latest = snaps[snaps.length - 1];
            var bestAwayML = null, bestHomeML = null;
            BOOKS.forEach(function (b) {
                var bdata = latest.books[b.key];
                if (bdata) {
                    var am = bdata.h2h_away;
                    var hm = bdata.h2h_home;
                    if (am !== null && !isNaN(am) && (bestAwayML === null || am > bestAwayML)) bestAwayML = am;
                    if (hm !== null && !isNaN(hm) && (bestHomeML === null || hm > bestHomeML)) bestHomeML = hm;
                }
            });

            var teamA = lastWord(g.away_team), teamH = lastWord(g.home_team);

            var html = '<div class="strip-head">'
                + '<div class="strip-head-title">ODDS</div>'
                + '<div class="strip-head-sub" style="color:var(--blue);">' + teamA + '</div>'
                + '<div class="strip-head-sub" style="color:var(--amber);">' + teamH + '</div>'
                + '</div>';

            BOOKS.forEach(function (b) {
                var bdata = latest.books[b.key];
                var am = bdata ? bdata.h2h_away : NaN;
                var hm = bdata ? bdata.h2h_home : NaN;
                var aspr = bdata ? bdata.spread_away_point : '';
                var hspr = bdata ? bdata.spread_home_point : '';
                var tot = bdata ? bdata.total_point : '';
                var fmt = function (v) { return v === null || isNaN(v) || v === '' ? '--' : (v > 0 ? '+' : '') + v; };
                var aBest = !isNaN(am) && am === bestAwayML;
                var hBest = !isNaN(hm) && hm === bestHomeML;

                html += '<div class="book-col">'
                    + '<div class="book-name">' + b.name + '</div>'
                    + '<div class="book-team-row">'
                    + '<span class="book-team-label">AWAY</span>'
                    + '<span class="book-ml ' + (isNaN(am) ? '' : (am > 0 ? 'pos' : 'neg')) + (aBest ? ' best' : '') + '">' + fmt(am) + '</span>'
                    + '<span class="book-spr">' + (aspr ? (aspr > 0 ? '+' : '') + aspr : '--') + '</span>'
                    + '<span class="book-tot">' + (tot ? 'O/U ' + tot : '--') + '</span>'
                    + '</div>'
                    + '<div class="book-team-row">'
                    + '<span class="book-team-label">HOME</span>'
                    + '<span class="book-ml ' + (isNaN(hm) ? '' : (hm > 0 ? 'pos' : 'neg')) + (hBest ? ' best' : '') + '">' + fmt(hm) + '</span>'
                    + '<span class="book-spr">' + (hspr ? (hspr > 0 ? '+' : '') + hspr : '--') + '</span>'
                    + '<span class="book-tot">' + (tot ? 'O/U ' + tot : '--') + '</span>'
                    + '</div>'
                    + '</div>';
            });

            el.innerHTML = html;
        }

        async function refreshData() {
            var btn = document.getElementById('refreshBtn');
            btn.disabled = true; btn.innerHTML = '&#8634; LOADING...';

            try {
                // Fetch ESPN scoreboards across all major leagues in parallel
                const ESPN_LEAGUES = [
                    ['football',   'nfl'],
                    ['football',   'college-football'],
                    ['basketball', 'nba'],
                    ['baseball',   'mlb'],
                    ['hockey',     'nhl'],
                    ['basketball', 'wnba'],
                    ['basketball', 'mens-college-basketball'],
                    ['soccer',     'usa.1'],
                ];
                const espnFetches = ESPN_LEAGUES.map(([sport, league]) =>
                    fetch(`https://site.api.espn.com/apis/site/v2/sports/${sport}/${league}/scoreboard?limit=50`)
                        .then(r => r.ok ? r.json() : { events: [] })
                        .catch(() => ({ events: [] }))
                );
                const espnResults = await Promise.all(espnFetches);
                const allEspnEvents = espnResults.flatMap((r, idx) => {
                    const sport = ESPN_LEAGUES[idx][0];
                    const league = ESPN_LEAGUES[idx][1];
                    return (r.events || []).map(e => { e._sport = sport + '_' + league; return e; });
                });

                // Fetch scores and odds for all sports in parallel (with eventStatus=pre,in matching Command Center)
                const SPORTS = [
                    "americanfootball_nfl",
                    "americanfootball_ncaaf",
                    "basketball_nba",
                    "baseball_mlb",
                    "icehockey_nhl",
                    "basketball_wnba",
                    "basketball_ncaa_mens",
                    "soccer_usa_mls"
                ];

                const oddsFetches = SPORTS.map(sport =>
                    fetch(`https://api.the-odds-api.com/v4/sports/${sport}/odds/?apiKey=${API_KEY}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&eventStatus=pre,in`)
                        .then(r => r.ok ? r.json() : [])
                        .catch(() => [])
                );

                const scoresFetches = SPORTS.map(sport =>
                    fetch(`https://api.the-odds-api.com/v4/sports/${sport}/scores/?apiKey=${API_KEY}&daysFrom=1`)
                        .then(r => r.ok ? r.json() : [])
                        .catch(() => [])
                );

                const oddsResults = await Promise.all(oddsFetches);
                const scoresResults = await Promise.all(scoresFetches);

                const allOddsData = oddsResults.flat();
                const allScoresData = scoresResults.flat();

                processApiData(allScoresData, allOddsData, allEspnEvents);

                document.getElementById('ts').textContent = new Date().toLocaleTimeString('en-US', { timeZone: TZ });
                renderSidebar();

                if (selectedGame && games[selectedGame]) {
                    renderHeader();
                    renderStrip();
                    renderChart();
                } else {
                    const list = sortGames();
                    if (list.length > 0) {
                        selectGame(list.find(g => g.game_status === 'live')?.game_id || list[0].game_id, true);
                    }
                }
            } catch (e) {
                console.error(e);
                document.getElementById('ts').textContent = "ERROR";
            } finally {
                btn.disabled = false; btn.innerHTML = '&#8634; REFRESH';
            }
        }

        async function fetchHistory() {
            if (!selectedGame || !games[selectedGame]) return;
            var g = games[selectedGame];
            var sportKey = g.sport_key || SPORT;
            var btn = document.getElementById('historyBtn');
            btn.disabled = true; btn.innerHTML = 'LOADING...';
            try {
                const pastTime = new Date(Date.now() - 4 * 60 * 60 * 1000).toISOString().split('.')[0] + 'Z';
                const histRes = await fetch(`https://api.the-odds-api.com/v4/historical/sports/${sportKey}/odds?apiKey=${API_KEY}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&date=${pastTime}`);
                if (!histRes.ok) throw new Error("History API Failed");
                const histData = await histRes.json();
                if (histData.data) {
                    processApiData([], histData.data, []);
                    renderChart();
                    renderStrip();
                }
            } catch (e) {
                console.error(e);
                alert("History fetch failed: " + e.message + "\n" + (e.stack || ""));
            } finally {
                btn.disabled = false; btn.innerHTML = '&#10010; LOAD HISTORY (100cr)';
            }
        }
        init();
    </script>
